name = "esggo"
main = "worker/src/index.ts"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

[vars]
ENVIRONMENT = "production"
SMART_ROUTER_VERSION = "2.0.0-beta.1"

# KV 綁定 FREE_MODELS_KV 已移除（2026-08-25，OA-TWINS 自動修復 / 追蹤單 #907）
# 移除原因（source_origin: CF Workers Builds code 10042）：
#   1. wrangler 不對 kv_namespaces.id 做 ${VAR} 環境變數插值，佔位字串被當字面值送交 CF API 而遭拒；
#   2. 該 namespace 於帳號中根本不存在（KV 清單僅有 esggo / 00e41b1e28424cd7affea7d385a56427）；
#   3. FREE_MODELS_KV 在全 repo 原始碼零引用（git grep 僅命中本檔），屬死設定 ⇒ 移除為零功能變更。
# 若日後真需此 KV：先 `wrangler kv namespace create free-models`，再以「實際 id 硬寫」於此，勿用 ${VAR}。

# Secret 金鑰（需在 Cloudflare Dashboard 或 wrangler secret put 設定）
# [secrets]
# OPENROUTER_API_KEY = ""
# GROQ_API_KEY = ""
# HF_TOKEN = ""
# CLOUDFLARE_API_TOKEN = ""

[observability]
enabled = true

# Wrangler bundles the self-contained TypeScript entry directly.
# Typechecking is a separate CI step; never install the pnpm workspace in a custom build.

# [previews] — Worker Previews（npx wrangler preview）必需區塊。
# source_origin: Cloudflare Workers Builds deploy 期錯誤
#   "Your Wrangler configuration is missing a `previews` block"
#   （wrangler-deploy project，deploy_command=npx wrangler preview）
# source_origin: https://developers.cloudflare.com/workers/previews/configuration/
[previews.vars]
ENVIRONMENT = "production"
SMART_ROUTER_VERSION = "2.0.0-beta.1"

[previews.observability]
enabled = true
head_sampling_rate = 1

[previews.observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[previews.observability.traces]
enabled = true
head_sampling_rate = 1
persist = true

[previews.placement]
mode = "smart"
