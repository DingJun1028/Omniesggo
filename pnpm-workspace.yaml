# source_origin: esggo monorepo workspace 定義（本輪加入 esggo-auto-repair/*，見 a1fedbb4e）
packages:
  - 'apps/*'
  - 'apps/*/functions'
  - 'cli/*'
  - 'packages/*'
  - 'libs/*'
  # esggo-auto-repair/worker 為獨立部署的 CF Worker（自有 wrangler.toml + queue 綁定）。
  # 修正 2026-09-28：先前未列入本清單，導致 `pnpm install` 不進此目錄、
  # devDependencies（hono 等）永遠不被安裝 → tsc 報 TS2307 Cannot find module 'hono'
  # → CF Workers Builds 失敗。
  - 'esggo-auto-repair/*'
  - '.'
  # oa-swarm 為獨立可部署 App (自有 Dockerfile/ecosystem/lock)，排除出根 workspace
  # 避免根 pnpm-lock.yaml 需同步其 devDeps 導致 --frozen-lockfile 失敗
  # '!apps/oa-swarm' 排除「部署標的殘留的 apps/oa-swarm/」(未版控，僅存在於 VPS 工作樹)
  #   ↑ 缺此行導致 VPS 上 'apps/*' 收進第 22 個 project → ERR_PNPM_OUTDATED_LOCKFILE
  # 注意: 源碼層 oa-swarm/ 已納回根 workspace (上方未排除)，使 @esggo/incremental (libs/*)
  #   的 workspace:* 依賴可被 pnpm 解析並 symlink，消除「紙上依賴、實際未解析」的 drift。
  #   VPS 部署仍走 apps/oa-swarm (自有 lock)，不受根 workspace 影響。
  - '!apps/oa-swarm'

overrides:
  "@azure/msal-node": ">=7.1.0 <8"
  "@vitest/mocker": ">=4.1.11 <5"
  ws: '>=8.21.0 <9'
  "tar": ">=7.5.21 <8"
  "postcss": ">=8.5.23"
  "uuid": ">=11.1.1"
  "gaxios": ">=7.1.4"
  "glob": ">=10.5.0"
  "minimatch": ">=9.0.7"
  "fast-uri": ">=3.1.6 <4"
  "fast-xml-parser": ">=5.10.1"
  "brace-expansion": ">=5.0.12 <6"
  # 安全修補：必須加 <major 上界，裸 '>=' 會讓 pnpm 跳到跨 major。
  # （原註解引用的 AGENTS.md #4 經實查不存在：root AGENTS.md 無編號條文）
  "nanoid": ">=3.3.18 <4"
  "dompurify": ">=3.4.17 <4"
  "happy-dom": ">=21.0.4 <22"
  "body-parser": ">=1.20.9 <2"
  # ── 2026-09-05 pnpm audit 修補：qs SSRF (express → body-parser → qs) ──
  # 傳入鏈路：express@4.22.2 → body-parser(~1.20.5) → qs(~6.15.1)
  # 修補：升級至 >=6.15.4 (patched version)
  "qs": ">=6.15.4 <7"
  # ── 2026-09-05 pnpm audit 修補：@xmldom/xmldom XML Injection ──
  # 傳入鏈路：officeparser → @everworker/oneringai → @esggo/oa-framework
  # 修補：升級至 >=0.9.12 <1 (patched version)
  "@xmldom/xmldom": ">=0.9.12 <1"
  # ── 2026-09-05 pnpm audit 修補：@google/adk SSRF ──
  # 傳入鏈路：@google/adk@1.6.0 → express → body-parser → qs
  # 修補：升級至 >=1.6.1 (patched version)
  "@google/adk": ">=1.6.1"
  "protobufjs": ">=7.6.5 <8"
  # ── 2026-08-11 dependabot 批次修補 (pnpm audit 13 項) ──
  "esbuild": ">=0.24.3 <1"
  "@tootallnate/once": ">=2.0.1 <3"
  "adm-zip": ">=0.6.1 <1"
  "pdfjs-dist": ">=6.2.108 <7"
  "@opentelemetry/core": ">=2.8.0 <3"
  "@opentelemetry/sdk-node": ">=0.217.0 <1"
  "@opentelemetry/auto-instrumentations-node": ">=0.75.0 <1"
  "@opentelemetry/propagator-jaeger": ">=2.9.0 <3"
  # ── 2026-08-17 Dependabot 告警追加 (放寬到修補版所在 major) ──
  # sharp 原依「AGENTS.md #7」排除 (next 限制 0.34.5) —— 該條文經實查不存在；
  # chromadb 僅 .venv 不納入 pnpm
  # vitest 最新穩定 4.1.10 (5.x 仍 beta, 不跨)；CVE 上游未修, 先鎖穩定最新
  #
  # 2026-09-28 修正：原值 ">=4.1.11" 為裸 >=，無上界 → 實際解析到 5.0.1，
  # 與上一行註解「5.x 仍 beta, 不跨」直接矛盾，且違反上方 major 上界原則
  # (override 須含 <major 上界)。實測：package.json 宣告 ^4.1.10，
  # node_modules/vitest 實際為 5.0.1。
  # 該矛盾同時是 12 筆 GHSA-5xrq-8626-4rwp critical 誤報的根源：
  # manifest 宣告的版本落在 advisory 範圍內，但實際安裝的 5.0.1 不受影響。
  "vitest": ">=4.1.11 <5"
  # vite 7.x 與 8.x 在 root 並存(解析 7.3.6 + 8.1.3)，兩者均非脆弱範圍(<=6.4.2)；
  #   原 <8 無法約束 vite@8 實例，擴展上界到 <9 同時鎖定 8.x（仍守住 <major 上界）
  "vite": ">=7.0.0 <9"
  # ⛔ 回退 (2026-08-17 09:00 部署前驗證): undici@8 移除了 lib/handler/wrap-handler.js，
  #    jsdom@29.1.1 硬性 require 該路徑 → OmniCore CI / learning-center-ci / VPS 建置三紅。
  #    jsdom@29 只接受 ^7.25.0；跨 major 亦違反 major 上界原則。維持 7.x 修補版。
  "undici": ">=7.30.1 <8"
  "@grpc/grpc-js": ">=1.13.6 <2"
  "cross-spawn": ">=7.0.6 <8"
  "express": ">=4.21.2 <5"
  "cookie": ">=0.7.2 <1"

  "hono": ">=4.13.5 <5"
  # sharp 修補升級（0.35.0 已修 CVE-2026-33327/33328/35590/35591）。
  # 原註解引用的「AGENTS.md #7」並無出處（root AGENTS.md 無編號條文），
  # 故改以 CVE 編號作為依據。
  # 2026-09-28 複審提升至 0.35.4：實測 apps/learning-center（獨立 lockfile）
  # 仍鎖在 0.35.2，帶入 libheif GHSA-g89c-p67h-r4。經 pnpm why 確認其路徑為
  # esggo-auto-repair/worker → wrangler → miniflare → sharp，屬 dev 工具鏈，
  # 且 AGENTS.md「勿用 overrides 強升傳遞依賴」明文只針對 undici/jsdom，
  # sharp 為 minor 修補故適用此處。
  # 2026-10-12 複審提升至 0.35.5：Dependabot high GHSA-wq5f-xc86-pv6w
  # (my-worker/pnpm-lock.yaml, fix>=0.35.5)。
  "sharp": ">=0.35.5"
  # ── 2026-08-21 Dependabot 修補 (pnpm audit --prod 剩 1 high) ──
  "deepmerge-ts": ">=8.0.0 <9"
  # 2026-08-31 安全修補：mariadb GHSA-cqhc-2h57-wpxf (MitM password leak)
  "mariadb": ">=3.4.6"
  # ── 2026-09-05 pnpm audit 修補：mysql2 GHSA-rgwj-5xj2-c3m3 (zlib inflate DoS) ──
  # 傳入鏈路：@google/adk@2.0.0 → @mikro-orm/mysql@6.6.16 → mysql2@3.20.0
  #          knex@3.2.10 → mysql2@3.20.0
  # 修補：升級至 >=3.23.1 (patched version)
  "mysql2": ">=3.23.1"
  # ── 2026-10-12 Dependabot critical 修補: handlebars CVE-2026-106445/446
  # (JS injection / own property check bypass) — 傳遞依賴釘 4.7.9 → 4.7.10
  # 傳入鏈路：經 pnpm-lock.yaml 解析（manifest 無直依），走 workspace overrides 統一提升
  "handlebars": ">=4.7.10"
  # ── 2026-10-14 Dependabot 修補 (open alerts 2 high/1 medium) ──
  # http-cache-semantics GHSA: max-stale 跨用戶快取洩漏；鏈路 make-fetch-happen→node-gyp→sqlite3
  # postcss-selector-parser GHSA: flat selector 解析 CPU 耗盡；鏈路 postcss 生態
  "http-cache-semantics": ">=4.3.0 <5"
  "postcss-selector-parser": ">=7.1.6 <8"

allowBuilds:
  '@firebase/util': false
  '@google/genai': false
  '@prisma/client': true
  '@prisma/engines': true
  core-js: true
  esbuild: true
  prisma: true
  protobufjs: false
  sharp: true
  sqlite3: false
  tesseract.js: true
  unrs-resolver: false
  # 修正 2026-09-28：加入 esggo-auto-repair/* 進 workspace（a1fedbb4e）後，
  # 該專案的 wrangler 依賴帶入 workerd（CF workerd runtime）。pnpm 11 遇未宣告
  # 的依賴會寫入佔位字串 "set this to true or false"，該非 boolean 值會讓
  # CI 乾淨環境 pnpm install 於 Install dependencies 階段 exit 1
  # （ERR_PNPM_IGNORED_BUILDS），連帶 23 個 check 全紅。
  # 與 40621aeb5（tesseract.js 同類問題）相同根因。
  # 採 false：workerd 僅供 wrangler dev 執行 Cloudflare worker，CI 不需要其
  # postinstall 產物，與 sqlite3 / protobufjs / unrs-resolver 採相同保守設定。
  workerd: false

