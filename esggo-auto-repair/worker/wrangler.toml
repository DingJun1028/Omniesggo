# source_origin: 萬能分身修復 Worker（CF Workers Builds 部署目標）
# 本輪修正：[build].command 的 npx 重複 + 納入 pnpm workspace（見 git log a1fedbb4e）
name = "esggo-auto-repair"
main = "src/index.ts"
compatibility_date = "2025-03-01"
compatibility_flags = ["nodejs_compat"]

[[queues.producers]]
queue = "esggo-repair-queue"
binding = "REPAIR_QUEUE"

[[queues.consumers]]
queue = "esggo-repair-queue"
max_batch_size = 5
max_retries = 3
max_batch_timeout = 1
dead_letter_queue = "esggo-repair-dlq"
[build]
# 修正 2026-09-28：`npx --yes npx --yes pnpm install` 會被解析成 `npx install`
# （npm 的 install），pnpm 專屬選項 --no-frozen-lockfile 觸發
# 「install: unknown option -- no-frozen-lockfile」→ CF Workers Builds 必失敗。
# 與根 wrangler.toml 的寫法一致：單一 npx --yes 包 pnpm。
# source_origin: PR #8 esggo-auto-repair build. [build].command runs in the
# directory containing wrangler.toml (= esggo-auto-repair/worker). The old
# `cd esggo-auto-repair/worker` resolved relative to that dir, i.e.
# esggo-auto-repair/worker/esggo-auto-repair/worker, which does not exist,
# causing "The system cannot find the path specified." (esggo-auto-repair#build
# failure). We are already in the worker dir, so drop the cd.
command = "npx --yes pnpm install --no-frozen-lockfile --ignore-scripts && npx tsc -p tsconfig.json"
