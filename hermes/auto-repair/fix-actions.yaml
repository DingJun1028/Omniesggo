# Auto-Repair Fix Actions
# Maps each pattern ID to concrete shell commands and workflows
#
# Tag contract: every action MUST carry the 6-dimension MECE tags
# matching its parent pattern.
#

fix_actions:
  # ═══════════════════════════════════════════════════════════
  # Dimension 1: Security Level  (security:critical|high|medium|low)
  # Dimension 2: Agent Ownership (agent:auto-repair|agent:manual)
  # Dimension 3: Lifecycle Stage (lifecycle:repair|detect|validate)
  # Dimension 4: Quality Grade  (p1|p2|p3 — priority 1=highest)
  # Dimension 5: Platform       (platform:github|vps|local)
  # Dimension 6: Barrier Inherit (barrier:none|ssh|secret|network)
  # ═══════════════════════════════════════════════════════════

  # ── Dependabot / pnpm audit overrides ──
  DAB-001:
    tags:
      security: high
      agent: auto-repair
      lifecycle: repair
      quality: p1
      platform: github
      barrier: secret
    description: "Override vulnerable dependency version in pnpm overrides"
    commands:
      - "cat pnpm-workspace.yaml"
      - "pnpm audit --filter @esggo/*"
      - "gh pr create --title 'fix: override vulnerable dep' --body 'Auto-generated by auto-repair engine' --label 'auto-repair,dependabot'"
    requires: [gh_cli, pnpm]
    rollback: "git revert HEAD"

  DAB-002:
    tags:
      security: high
      agent: auto-repair
      lifecycle: repair
      quality: p1
      platform: github
      barrier: secret
    description: "Create per-package Dependabot PR for direct dependency"
    commands:
      - "pnpm audit --json > /tmp/audit.json"
      - "python3 .hermes/auto-repair/parse-audit.py /tmp/audit.json"
      - "gh pr create --title 'fix: direct dep override' --label 'auto-repair'"
    requires: [gh_cli, pnpm, python3]
    rollback: "git revert HEAD"

  PNA-001:
    tags:
      security: high
      agent: auto-repair
      lifecycle: repair
      quality: p1
      platform: local
      barrier: none
    description: "Run pnpm audit and apply overrides from pnpm-workspace.yaml"
    # 註：`pnpm audit` 在「有漏洞」時固定 exit 1（2026-09-29 實測：3 moderate → exit 1），
    # 拿它當修復指令會讓此動作在它要修的狀態下永遠失敗。改用 --audit-level high
    # 作為「high/critical 已清零」的驗收條件（實測：3 moderate → exit 0）。
    commands:
      - "pnpm audit --audit-level high"
      - "pnpm install"
    requires: [pnpm]
    rollback: "git checkout pnpm-lock.yaml"

  # ── SSH Connection ──
  SSH-001:
    tags:
      security: critical
      agent: auto-repair
      lifecycle: repair
      quality: p2
      platform: vps
      barrier: ssh
    description: "Fix SSH key permissions and verify connection via SSH config alias"
    commands:
      - "chmod 700 ~/.ssh"
      - "chmod 600 ~/.ssh/esggo_vps_fix"
      - "chmod 600 ~/.ssh/esggo_original"
      - "chmod 644 ~/.ssh/esggo_vps_fix.pub"
      - "chmod 644 ~/.ssh/esggo_original.pub"
      - "chmod 600 ~/.ssh/config"
    verify:
      - "ssh -o ConnectTimeout=10 -o StrictHostKeyChecking=no esggo-vps 'echo SSH_OK'"
    requires: [ssh_key]
    rollback: "chmod 644 ~/.ssh/esggo_vps_fix ~/.ssh/esggo_original"

  SSH-002:
    tags:
      security: medium
      agent: auto-repair
      lifecycle: detect
      quality: p2
      platform: vps
      barrier: network
    description: "Check VPS status and retry connection"
    commands:
      - "ping -c 3 161.118.248.180"
      - "ssh -o ConnectTimeout=10 esggo-vps echo 'VPS reachable'"
    requires: [network]
    rollback: "none"

  # ── Build Failures ──
  BLD-002:
    tags:
      security: low
      agent: auto-repair
      lifecycle: repair
      quality: p3
      platform: local
      barrier: none
    description: "Install missing module and rebuild"
    commands:
      - "pnpm install"
      - "pnpm build"
    requires: [pnpm]
    rollback: "git checkout pnpm-lock.yaml"

  # ── Lockfile Conflicts ──
  LCK-001:
    tags:
      security: medium
      agent: auto-repair
      lifecycle: repair
      quality: p2
      platform: github
      barrier: none
    description: "Resolve pnpm-lock.yaml merge conflict"
    commands:
      - "git checkout --theirs pnpm-lock.yaml"
      - "pnpm install"
      - "git add pnpm-lock.yaml"
      - "git commit -m 'fix: resolve pnpm-lock.yaml merge conflict'"
    requires: [git, pnpm]
    rollback: "git checkout HEAD~1 pnpm-lock.yaml"

  # ── .env.example Conflicts ──
  ENV-001:
    tags:
      security: critical
      agent: auto-repair
      lifecycle: repair
      quality: p2
      platform: github
      barrier: secret
    description: "Deduplicate .env.example merge conflict"
    commands:
      - "git checkout --theirs .env.example"
      - "git add .env.example"
      - "git commit -m 'fix: resolve .env.example merge conflict'"
    requires: [git]
    rollback: "git checkout HEAD~1 .env.example"

  # ── Python Script Truncation ──
  PYT-001:
    tags:
      security: low
      agent: auto-repair
      lifecycle: repair
      quality: p3
      platform: local
      barrier: none
    description: "Rewrite truncated Python script to file then execute"
    commands:
      - "cat > /tmp/repair-script.py << 'HEREDOC_END'\n# script content\nHEREDOC_END"
      - "python3 /tmp/repair-script.py"
    requires: [python3]
    rollback: "rm /tmp/repair-script.py"

  # ── Test Failures ──
  TST-001:
    tags:
      security: low
      agent: auto-repair
      lifecycle: validate
      quality: p3
      platform: local
      barrier: none
    description: "Run failing tests and log output for investigation"
    commands:
      - "pnpm test 2>&1 | tee /tmp/test-failure.log"
      - "cat /tmp/test-failure.log | tail -30"
    requires: [pnpm]
    rollback: "none"

  # ── VPS PM2 ──
  VPS-001:
    tags:
      security: medium
      agent: auto-repair
      lifecycle: repair
      quality: p2
      platform: vps
      barrier: ssh
    description: "SSH to VPS and reload PM2 ecosystem"
    commands:
      - "ssh esggo-vps 'cd /opt/esggo && pm2 reload ecosystem.config.js'"
      - "ssh esggo-vps 'pm2 status'"
    requires: [ssh_key, vps_access]
    rollback: "ssh esggo-vps 'pm2 restart previous'"

  # ── Tag Contract Violation ──
  TAG-001:
    tags:
      security: critical
      agent: auto-repair
      lifecycle: validate
      quality: p1
      platform: local
      barrier: none
    description: "Escalate tag contract violation to user — cannot auto-fix missing mandatory tags"
    commands:
      - "echo 'VIOLATION: Missing mandatory tags (agent:*, lifecycle:*, p*) — manual intervention required'"
    requires: []
    rollback: "none"

# ── Default Actions ──
defaults:
  max_retries: 3
  retry_delay_seconds: 5
  notify_on_failure: true
  escalate_to_user_after_retries: true
  clone_tracking: true