# .github/dependabot.yml
# Dependabot 設定 + 無 fix 漏洞 ignore 規則
# 5T: source_origin=.github/dependabot.yml
# 5T-Trustworthy: 自動掃描但避開無 patch 漏洞以免 spam
# 2026-10-27 De-Google/De-Prisma：移除 prisma ignore 規則（Prisma 已全面以 Supabase 取代）

version: 2

# 統一 ecosystem 設定
registries: {}

updates:
  # === npm/pnpm (esggo root monorepo) ===
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "Asia/Taipei"
    open-pull-requests-limit: 5
    # auto-merge 對純 lockfile 更新
    pull-request-branch-name:
      separator: "-"
    labels:
      - "dependencies"
      - "security"
    # === 無 fix 漏洞 ignore (no patch released) ===
    ignore:
      # Handlebars 兩條 bypass (upstream 尚未發 patch)
      - dependency-name: "handlebars"
        versions:
          - "> 4.7.0"
        # 等 upstream 發版再解 ignore
      - dependency-name: "handlebars"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
        # major/minor 不自動開 PR, 等 patch
      # === toolchain 不得跨界直升 major（曾升壞 TS7/eslint10）===
      # 見 skill: toolchain-sweep-repair-5t — 需 migration plan 才升級
      - dependency-name: "typescript"
        versions:
          - ">=6.0.0"
      - dependency-name: "eslint"
        versions:
          - ">=10.0.0"
    # === 開 PR 自動合併設定 ===
    groups:
      minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # === npm/pnpm (apps/learning-center) ===
  - package-ecosystem: "npm"
    directory: "/apps/learning-center"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "Asia/Taipei"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "learning-center"

  # === npm/pnpm (oa-swarm) ===
  - package-ecosystem: "npm"
    directory: "/oa-swarm"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "04:00"
      timezone: "Asia/Taipei"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "oa-swarm"

  # === npm/pnpm (my-worker) ===
  - package-ecosystem: "npm"
    directory: "/my-worker"
    schedule:
      interval: "weekly"
      day: "wednesday"
      time: "04:00"
      timezone: "Asia/Taipei"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "my-worker"

  # === pip (oa-team-crewai) ===
  - package-ecosystem: "pip"
    directory: "/oa-team-crewai"
    schedule:
      interval: "weekly"
      day: "thursday"
      time: "04:00"
      timezone: "Asia/Taipei"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "oa-team-crewai"
    # ChromaDB 已知無 fix 的 critical (待 patch)
    ignore:
      - dependency-name: "chromadb"
        versions:
          - "<= 1.0.0"

# === 全域安全策略備註 ===
# - npm/pnpm 用 pnpm 自動處理 lockfile
# - pip 用 uv 處理 (oa-team-crewai 已用 uv.lock)
# - 5T-AGPL Addendum: 每次升級都跑 pnpm typecheck + uv lock --check
