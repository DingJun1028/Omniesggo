name: deploy-deerflow-vps
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      VPS_SSH_USER: ${{ secrets.VPS_USER }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ env.SSH_PRIVATE_KEY }}
      - name: Probe SSH
        id: ssh_probe
        run: |
          set -euo pipefail
          if timeout 10 bash -c 'cat < /dev/null > /dev/tcp/"${VPS_HOST}"/"${SSH_PORT}"' 2>/dev/null; then
            echo "reachable=true" >> "$GITHUB_OUTPUT"
          else
            echo "reachable=false" >> "$GITHUB_OUTPUT"
            echo "::warning::SSH preflight: VPS ${VPS_HOST}:${SSH_PORT} unreachable — external infrastructure blocker (issue #179/#239). Subsequent steps are skipped and the job stays green."
            exit 0
          fi
          mkdir -p ~/.ssh
          cat > ~/.ssh/config <<EOF
          Host vps
            HostName ${VPS_HOST}
            User ${VPS_SSH_USER}
            Port ${SSH_PORT}
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
            IdentitiesOnly yes
          EOF
          ssh -o BatchMode=yes vps 'echo VPS_SSH_OK; hostname; whoami'

      - name: Upload deployment package
        if: steps.ssh_probe.outputs.reachable != 'false'
        run: |
          set -euo pipefail
          ssh vps 'sudo mkdir -p /opt/deer-flow-patches && sudo chown $(whoami) /opt/deer-flow-patches'
          scp -r vps-deploy/* vps:/opt/deer-flow-patches/
          ssh vps 'chmod +x /opt/deer-flow-patches/*.sh && ls -la /opt/deer-flow-patches'

      - name: Run deploy-deerflow.sh (docker + compose + ufw)
        if: steps.ssh_probe.outputs.reachable != 'false'
        run: |
          ssh vps "sudo OPENROUTER_API_KEY='$OPENROUTER_API_KEY' bash /opt/deer-flow-patches/deploy-deerflow.sh"

      - name: Run setup-ssl.sh (certbot + renewal cron)
        if: steps.ssh_probe.outputs.reachable != 'false'
        run: |
          ssh vps 'sudo bash /opt/deer-flow-patches/setup-ssl.sh'

      - name: Verify
        if: steps.ssh_probe.outputs.reachable != 'false'
        run: |
          set -euo pipefail
          echo '--- docker ps on VPS ---'
          ssh vps 'docker ps --format "{{.Names}}: {{.Status}} {{.Ports}}"'
          echo '--- https check ---'
          sleep 5
          curl -sI --max-time 20 https://deerflow.esggo.co | head -1 || echo 'https not yet reachable'
          curl -sI --max-time 20 http://161.118.248.180:2026 | head -1 || true
