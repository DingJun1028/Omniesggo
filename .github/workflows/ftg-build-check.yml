name: FTG Build Check

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/ftg-tours-website/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/ftg-build-check.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter ./apps/ftg-tours-website run build
