name: omninote-web-tsc-diag

# 一次性診斷工作流（自動自刪）：執行 tsc --noEmit 並將錯誤輸出提交為
# web-tsc-diag.txt，供匿名管道讀取。

on:
  push:
    branches: [feat/omninote-web-ui]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diag:
    if: github.repository == 'DingJun1028/Omniesggo'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Setup pnpm (packageManager pinned)
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run typecheck and capture output
        run: |
          set +e
          cd apps/omninote-web
          pnpm exec tsc --noEmit > ../../web-tsc-diag.txt 2>&1
          echo "exit_code=$?" >> ../../web-tsc-diag.txt
          cd ../..

      - name: Commit diagnostics and remove this workflow
        run: |
          git config user.name "omninote-ci-bot"
          git config user.email "actions@github.com"
          git add web-tsc-diag.txt
          git rm --quiet .github/workflows/omninote-web-tsc-diag.yml
          git commit -m "chore(omninote): capture web tsc diagnostics"
          git push
