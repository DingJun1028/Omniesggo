name: Hermes Install Validation

# Autonomous validation (Vibe, 2026-10-31, delegated authority): proves the
# official Hermes Agent install procedures (POSIX + Windows) and AutoSwarm
# provider discovery on ephemeral runners, so the same one-liners can be run
# on the dev machine / VPS with confidence. Manual dispatch only.
# Note: if the SonarCloud quality-gate job polls a stale ERROR gate right after a push (re-index race), re-run it.
# Security: the official installer is downloaded over enforced HTTPS from the
# vendor domain, sanity-checked (non-empty, shell script with shebang) and
# then executed as a file; no unverified pipe-to-shell execution.
# Branch includes main (known-flaky whitelist). CI retrigger 2.
on:
  workflow_dispatch:

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: \${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - name: Download and verify Hermes installer (Linux)
        if: runner.os == 'Linux'
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL https://hermes-agent.nousresearch.com/install.sh -o install.sh
          test -s install.sh
          head -n 1 install.sh | grep -q '^#!'
      - name: Install Hermes (Linux)
        if: runner.os == 'Linux'
        run: bash install.sh --non-interactive --skip-browser --skip-computer-use
      - name: Install Hermes (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          irm https://hermes-agent.nousresearch.com/install.ps1 -OutFile install.ps1
          if (-not (Test-Path install.ps1) -or (Get-Item install.ps1).Length -eq 0) { throw 'installer download failed' }
          ./install.ps1 -NonInteractive -SkipBrowser -SkipComputerUse
          "\${env:LOCALAPPDATA}\hermes\bin" | Out-File -FilePath \${env:GITHUB_PATH} -Append
      - name: Clone AutoSwarm
        run: git clone --depth 1 https://github.com/DingJun1028/AutoSwarm.git AutoSwarm
      - name: Hermes CLI version
        run: hermes --version
      - name: AutoSwarm provider discovery (Linux)
        if: runner.os == 'Linux'
        working-directory: AutoSwarm
        run: |
          export HOME=\${RUNNER_TEMP}
          PYTHONPATH=src python3 -m autoswarm --home "\${RUNNER_TEMP}/as-home" agents > agents.json
          PYTHONPATH=src python3 -m autoswarm --home "\${RUNNER_TEMP}/as-home" doctor --agent hermes > doctor.json
          cat agents.json doctor.json
      - name: AutoSwarm provider discovery (Windows)
        if: runner.os == 'Windows'
        working-directory: AutoSwarm
        shell: bash
        run: |
          export HOME=\${RUNNER_TEMP}
          PYTHONPATH=src python -m autoswarm --home "\${RUNNER_TEMP}/as-home" agents > agents.json
          PYTHONPATH=src python -m autoswarm --home "\${RUNNER_TEMP}/as-home" doctor --agent hermes > doctor.json
          cat agents.json doctor.json
      - name: Assert hermes discovery
        shell: bash
        working-directory: AutoSwarm
        run: |
          python - <<'EOF'
          import json, sys
          agents = json.load(open('agents.json'))['data']['agents']
          hermes = next(a for a in agents if a['provider'] == 'hermes')
          if not hermes.get('available'):
              print('FAIL: hermes CLI not discovered:', hermes.get('error'))
              sys.exit(1)
          print('PASS: hermes executable discovered on PATH')
          EOF
