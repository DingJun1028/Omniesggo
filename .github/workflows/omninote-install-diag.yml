# =============================================================================
# OmniNote: Unified — 一次性安裝診斷（PR #161 Install 失敗根因定位）
# 於 CI 環境（與 omninote-unified-ci.yml 同版）實跑 frozen 與 no-frozen 兩種
# 安裝，將完整輸出 commit 回分支 install-diag.txt，並在同一 commit 自刪本檔。
# 診斷完成後本工作流即不存在於分支（bot commit 不觸發遞迴 CI）。
# =============================================================================
name: Omninote Install Diag (one-shot)

on:
  push:
    branches: [feat/omninote-unified-package]
    paths: ['.github/workflows/omninote-install-diag.yml']

permissions:
  contents: write

concurrency:
  group: omninote-install-diag
  cancel-in-progress: true

jobs:
  diagnose:
    name: Capture install diagnostics
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
        timeout-minutes: 5

      - name: Setup pnpm 11.5.2
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 11.5.2
        timeout-minutes: 3

      - name: Reproduce installs and capture diagnostics
        run: |
          set +e
          {
            echo "=== pnpm --version ==="
            pnpm --version
            echo
            echo "=== pnpm install --frozen-lockfile ==="
            pnpm install --frozen-lockfile
            echo "frozen_exit_code=$?"
            echo
            echo "=== pnpm install --no-frozen-lockfile ==="
            pnpm install --no-frozen-lockfile
            echo "nofrozen_exit_code=$?"
            echo
            echo "=== pnpm-workspace.yaml ==="
            cat pnpm-workspace.yaml
          } > install-diag.txt 2>&1
          cat install-diag.txt
        timeout-minutes: 20

      - name: Commit diagnostics and remove this workflow (self-cleaning)
        run: |
          git config user.name "omninote-ci-bot"
          git config user.email "actions@github.com"
          git add install-diag.txt
          git rm .github/workflows/omninote-install-diag.yml
          git commit -m "chore(omninote): capture install diagnostics (one-shot workflow self-removal)"
          git push
        timeout-minutes: 5
