# =============================================================================
# OmniCore V5.1 — 週期性安全審計工作流
# =============================================================================
# 排程: 每週一凌晨 2:00 UTC
# 手動觸發: workflow_dispatch
# 檢查: npm audit、已知 CVE、依賴過期
# =============================================================================

name: Security Audit

on:
  schedule:
    - cron: "0 2 * * 1"  # 每週一 02:00 UTC
  workflow_dispatch:       # 允許手動觸發

permissions:
  contents: read
  security-events: write   # 允許寫入 GitHub Security tab

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "11.5.2"

jobs:
  # ─── pnpm 依賴安全審計 ────────────────────────────────────────
  dependency-audit:
    name: Dependency Audit (pnpm)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run pnpm audit
        run: |
          echo "=== pnpm security audit (high severity) ==="
          pnpm audit --audit-level=high || {
            echo "::warning::High-severity vulnerabilities found — review pnpm audit report"
          }
      - name: Check for critical vulnerabilities
        run: |
          echo "=== pnpm security audit (critical only) ==="
          pnpm audit --audit-level=critical || {
            echo "::error::Critical vulnerabilities found — review pnpm audit report"
            exit 1
          }

  # ─── Secret 洩漏掃描 ──────────────────────────────────────────
  secret-scan:
    name: Secret Leak Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Full-repo secret scan
        run: |
          set -e
          echo "=== Full repository secret scan ==="
          PATTERNS=(
            "AKIA[0-9A-Z]{16}"                        # AWS Access Key
            "gh[pousr]_[A-Za-z0-9]{30,}"              # GitHub tokens
            "-----BEGIN .*PRIVATE KEY-----"            # Private keys
            "sk_live_[A-Za-z0-9]+"                     # Stripe live key
            "rk_live_[A-Za-z0-9]+"                     # Stripe restricted key
            "SG\.[A-Za-z0-9_-]{22,}\.[A-Za-z0-9_-]{43,}" # SendGrid
            "xox[baprs]-[A-Za-z0-9-]+"                # Slack tokens
          )
          FOUND=0
          for pattern in "${PATTERNS[@]}"; do
            if grep -rInE --include="*.ts" --include="*.tsx" --include="*.js" --include="*.py" --exclude-dir=node_modules --exclude-dir=.next --exclude-dir=.git -- "$pattern" .; then
              echo "::error::Potential secret found matching pattern: $pattern"
              FOUND=1
            fi
          done
          if [ $FOUND -eq 1 ]; then exit 1; fi
          echo "✅ No secrets detected in source code"

  # ─── 過期依賴檢查 ─────────────────────────────────────────────
  outdated-check:
    name: Outdated Dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true  # 不阻擋，僅報告
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check outdated packages
        run: |
          echo "=== Outdated dependencies report ==="
          pnpm outdated || true
        # 此步驟永遠不失敗，僅提供資訊

  # ─── 環境變數洩漏檢查 ─────────────────────────────────────────
  env-leak-check:
    name: Env File Leak Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check no .env files committed
        run: |
          set -e
          echo "=== Checking for accidentally committed .env files ==="
          # 查找已追蹤的 .env 檔案
          if git ls-files | grep -E "^\.env(\.|$)" | grep -v "\.example$" | grep -v "omni\.example$"; then
            echo "::error::.env file(s) found in git tracking — remove with: git rm --cached .env"
            exit 1
          fi
          echo "✅ No .env files found in git tracking"
