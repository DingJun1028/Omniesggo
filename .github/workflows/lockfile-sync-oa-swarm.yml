name: One-shot lockfile sync (oa-swarm)

on:
  push:
    branches:
      - fix/oa-swarm-vitest-override-sync
    paths:
      - .github/workflows/lockfile-sync-oa-swarm.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/oa-swarm-vitest-override-sync
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Regenerate oa-swarm lockfile
        run: |
          set -euo pipefail
          corepack enable
          cd oa-swarm
          pnpm install --lockfile-only --no-frozen-lockfile
      - name: Commit lockfile and remove workflow
        run: |
          set -euo pipefail
          git config user.name "esggo-branch-sync-bot"
          git config user.email "actions@users.noreply.github.com"
          git add oa-swarm/pnpm-lock.yaml
          git commit -m "chore: regenerate oa-swarm lockfile (vitest 5.1.0 override alignment)" || echo "NO_LOCK_CHANGES"
          git rm .github/workflows/lockfile-sync-oa-swarm.yml
          git commit -m "chore: remove one-shot lockfile sync workflow"
          git push
