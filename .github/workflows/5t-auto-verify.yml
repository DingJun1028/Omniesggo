name: 5T Auto Verify

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  verify-60-agents:
    name: 60 員軍團觸達驗證
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 驗證 60 員觸達
        run: node oa-swarm/scripts/verify-oa-gap.mjs
      - name: 驗證 soul-lineage 血脈
        run: node scripts/check-soul-lineage.mjs

  verify-schema-traceability:
    name: Schema 追溯閘
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: TypeBox Schema 追溯驗證
        run: node scripts/generate-schema-traceability.mjs --check

  verify-agent-registry:
    name: Agent Registry 冒煙測試
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Agent Registry Smoke Test
        run: pnpm exec tsx packages/omni-agent-bus/test/registry.smoke.ts
