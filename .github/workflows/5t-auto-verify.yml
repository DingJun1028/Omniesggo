name: 5T Auto Verify

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  verify-60-agents:
    name: 60 員軍團觸達驗證
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 驗證 60 員觸達
        run: node oa-swarm/scripts/verify-oa-gap.mjs
      - name: 驗證 soul-lineage 血脈
        run: node scripts/check-soul-lineage.mjs

  verify-schema-traceability:
    name: Schema 追溯閘
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: TypeBox Schema 追溯驗證
        run: node scripts/generate-schema-traceability.mjs --check

  verify-agent-registry:
    name: Agent Registry 冒煙測試
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Agent Registry Smoke Test
        run: pnpm exec tsx packages/omni-agent-bus/test/registry.smoke.ts
