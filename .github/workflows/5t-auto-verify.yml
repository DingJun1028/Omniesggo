name: 5T Auto Verify

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  verify-60-agents:
    name: 60 員軍團觸達驗證
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 驗證 60 員觸達
        run: node oa-swarm/scripts/verify-oa-gap.mjs
      - name: 驗證 soul-lineage 血脈
        run: node scripts/check-soul-lineage.mjs

  verify-schema-traceability:
    name: Schema 追溯閘
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: TypeBox Schema 追溯驗證
        run: node scripts/generate-schema-traceability.mjs --check

  verify-agent-registry:
    name: Agent Registry 冒煙測試
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Agent Registry Smoke Test
        run: npx tsx packages/omni-agent-bus/test/registry.smoke.ts
