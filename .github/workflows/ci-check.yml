name: ci-check

# ── 技術驗證 CI 檢查 ─────────────────────────────────────
# 此 workflow 在 push / PR 時自動觸發：
#   1. 掃描完整 repo（21 packages / 34 apps / 47 skills / 30 agents / 15 arch / 2 workflows）
#   2. 執行 ESG-Swarm 本機檢查
#   3. 執行 OmniNote 實驗驗證（含 3-way merge 與 5T 標籤）
#   4. 檢查 OmniAgent 技術生命週期（OllamaFreeCompute + SharedMemoryLayer）
#   5. 計算關鍵指標：95% 信心度 / < 1.5s 延遲 / 85% 覆蓋率
#   6. 判定關鍵指標門檻並寫入步驟摘要 + 生成驗證報告
#
# Usage: 由 GitHub Actions 自動執行，或本地用 `act` 測試。

on:
  push:
    branches: [ feature/oesg-esg-swarm-soul-d ]
  pull_request:
    branches: [ main ]

permissions:
  checks: write
  contents: read
  actions: read

env:
  PYTHONUNBUFFERED: "1"
  ESG_REPO: ${{ github.workspace }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 檢查並設置依賴
        run: |
          python3 -m venv .venv
          source .venv/bin/activate
          pip install --upgrade pip
          # 需要的套件
          pip install -e apps/omni-note
          # 驗證報告工具
          pip install -r tools/capability-explorer/requirements.txt 2>/dev/null || true

      - name: 掃描倉庫
        run: |
          source .venv/bin/activate
          python tools/capability-explorer/verification.py --verify

      - name: 檢查 ESG-Swarm
        run: |
          source .venv/bin/activate
          python -m apps.esg_swarm.workflow --help 2>/dev/null || \
          python apps/esg-swarm/worker.py --help 2>/dev/null || \
          echo "⚠️  ESG-Swarm 雲端調用跳過（需 Mistral API Key）"

      - name: 檢查 OmniNote 3-way merge
        run: |
          source .venv/bin/activate
          python apps/omni-note/run_demo.py 2>&1 | tail -5 || \
          echo "⚠️  OmniNote 演示因無實體同步環境跳過"

      - name: 統計檢查結果
        id: check
        run: |
          source .venv/bin/activate
          python - <<'PY'
          import re, os

          # 讀取驗證報告
          report = open("verification_report.md", encoding="utf-8").read()

          # 提取關鍵指標
          metrics = {}
          for line in report.split("\n"):
              m = re.search(r"\|\s*信心度\s*\|\s*([\d.]+)\s*\|", line)
              if m: metrics["conf"] = float(m.group(1))
              m = re.search(r"\|\s*延遲\s*\|\s*([\d.]+)", line)
              if m: metrics["latency_ms"] = float(m.group(1))
              m = re.search(r"\|\s*覆蓋率\s*\|\s*([\d.]+)\s*\|", line)
              if m: metrics["coverage"] = float(m.group(1))
              m = re.search(r"\|\s*掃描項目數\s*\|\s*([\d.]+)\s*\|", line)
              if m: metrics["scanned"] = int(m.group(1))

          # 判斷結果
          conf_pass = metrics.get("conf", 0) >= 0.95
          latency_pass = metrics.get("latency_ms", 9999) <= 1500
          coverage_pass = metrics.get("coverage", 0) >= 0.85
          all_pass = conf_pass and latency_pass and coverage_pass

          summary = "✅ すべて合格" if all_pass else f"❌ 部分不通過 (conf={conf_pass}, latency={latency_pass}, coverage={coverage_pass})"
          print(f"=== 檢查結果：{summary} ===")
          print(f"  信心度={metrics.get('conf', '?')} 延遲={metrics.get('latency_ms', '?')}ms 覆蓋率={metrics.get('coverage', '?')}")

          # 結果寫入工作流步驟摘要（GitHub Actions 本身即以 verify check run 呈現結論）
          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary_path:
              with open(summary_path, "a", encoding="utf-8") as f:
                  f.write("## ci-check 驗證結果\n\n")
                  f.write(f"{summary}\n\n")
                  f.write(f"信心度={metrics.get('conf', '?')} / 延遲={metrics.get('latency_ms', '?')}ms / 覆蓋率={metrics.get('coverage', '?')}\n\n")

          if not all_pass:
              raise SystemExit(1)
          PY

      - name: 生成並上傳驗證報告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-report
          path: verification_report.md
          retention-days: 30
