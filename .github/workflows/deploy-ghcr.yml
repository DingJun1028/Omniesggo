name: deploy-ghcr

on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'next.config.*'
      - 'app/**'
      - 'sdks/**'
      - 'packages/**'
      - 'Omni-Sanctuary/**'
      - '.github/workflows/deploy-ghcr.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-ghcr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      IMAGE_NAME: ghcr.io/dingjun1028/omniesggo
      DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        id: login
        continue-on-error: true
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Warn when GHCR login is unavailable
        if: steps.login.outcome != 'success'
        run: echo "::warning::GHCR login failed; building the image without pushing"

      - name: Build production image (push when logged in)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ steps.login.outcome == 'success' }}
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger remote deploy hook (optional)
        if: steps.login.outcome == 'success'
        run: |
          if [ -z "$DEPLOY_WEBHOOK_URL" ]; then
            echo "::warning::DEPLOY_WEBHOOK_URL is not set; skipping remote deploy trigger"
            exit 0
          fi
          curl -fsS --max-time 30 -X POST --data-urlencode "image=$IMAGE_NAME:$GITHUB_SHA" "$DEPLOY_WEBHOOK_URL" > /dev/null || echo "::warning::deploy hook call failed; skipped"
