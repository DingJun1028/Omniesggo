name: VPS env secrets write (probe)
on:
  push:
    paths: ['.github/workflows/vps-env-secrets.yml']
  workflow_dispatch:
jobs:
  write:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Prepare SSH key
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          printf '%s
' "${VPS_SSH_KEY}" > /tmp/vps_key
          chmod 600 /tmp/vps_key
      - name: Write SONAR_TOKEN to VPS .env.secrets
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          set +e
          : > /tmp/env-secrets-result.md
          echo "# VPS .env.secrets write result" >> /tmp/env-secrets-result.md
          echo "- date: $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> /tmp/env-secrets-result.md
          SSHOPT="-i /tmp/vps_key -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20"
          KEYS_BEFORE=$(ssh $SSHOPT "$VPS_USER@$VPS_HOST" "cut -d= -f1 /home/ubuntu/.env.secrets 2>/dev/null | sort | tr '\n' ','" 2>/dev/null)
          rc1=$?
          echo "- keys_before: $KEYS_BEFORE (rc=$rc1)" >> /tmp/env-secrets-result.md
          printf '%s\n' "SONAR_TOKEN=$SONAR_TOKEN" | ssh $SSHOPT "$VPS_USER@$VPS_HOST" 'set +e; cp -a /home/ubuntu/.env.secrets /home/ubuntu/.env.secrets.bak-20261101 2>/dev/null; grep -v "^SONAR_TOKEN=" /home/ubuntu/.env.secrets > /home/ubuntu/.env.secrets.tmp 2>/dev/null; cat >> /home/ubuntu/.env.secrets.tmp; chmod 600 /home/ubuntu/.env.secrets.tmp; chown ubuntu:ubuntu /home/ubuntu/.env.secrets.tmp; mv /home/ubuntu/.env.secrets.tmp /home/ubuntu/.env.secrets; exit 0'
          rc2=$?
          echo "- write_rc: $rc2" >> /tmp/env-secrets-result.md
          FP=$(ssh $SSHOPT "$VPS_USER@$VPS_HOST" "grep '^SONAR_TOKEN=' /home/ubuntu/.env.secrets | head -1 | cut -d= -f2- | tr -d '\r\n' | sha256sum | cut -c1-12" 2>/dev/null)
          if [ "$FP" = "aab1f7090195" ]; then
            echo "- fingerprint_match: OK ($FP)" >> /tmp/env-secrets-result.md
          else
            echo "- fingerprint_match: NG ($FP)" >> /tmp/env-secrets-result.md
          fi
          STAT=$(ssh $SSHOPT "$VPS_USER@$VPS_HOST" "stat -c '%a %U %s' /home/ubuntu/.env.secrets" 2>/dev/null)
          KEYS_AFTER=$(ssh $SSHOPT "$VPS_USER@$VPS_HOST" "cut -d= -f1 /home/ubuntu/.env.secrets 2>/dev/null | sort | tr '\n' ','" 2>/dev/null)
          echo "- keys_after: $KEYS_AFTER" >> /tmp/env-secrets-result.md
          echo "- stat: $STAT" >> /tmp/env-secrets-result.md
          cat /tmp/env-secrets-result.md >> "$GITHUB_STEP_SUMMARY"
          echo "RESULT_BEGIN"
          cat /tmp/env-secrets-result.md
          echo "RESULT_END"
      - name: Commit result and self-remove
        run: |
          set +e
          git config user.name "esggo-ci-bot"
          git config user.email "action@github.com"
          cp /tmp/env-secrets-result.md env-secrets-result.md
          git add env-secrets-result.md
          git rm -q .github/workflows/vps-env-secrets.yml
          git commit -q -m "chore: env secrets result (probe)"
          git push -q
          echo "PUSH_RC=$?"
