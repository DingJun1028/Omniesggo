name: Deploy FTG Static Files

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "ftg-*"
    paths:
      - "apps/ftg-tours-website/**"

jobs:
  build-and-deploy:
    name: Build & Sync FTG to VPS
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/ftg-tours-website/package-lock.json

      - name: Build FTG
        working-directory: apps/ftg-tours-website
        run: |
          npm ci
          npm run build

      - name: Setup SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Sync FTG build to VPS
        run: |
          FTG_SRC="apps/ftg-tours-website/dist"
          FTG_DST="/var/www/ftgtours"
          echo "Syncing FTG build artifacts to VPS..."
          rsync -avz --delete \
            "$FTG_SRC/" \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:$FTG_DST/"
          echo "Sync complete!"

      - name: Reload nginx
        run: |
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            'sudo nginx -t && sudo nginx -s reload'
        continue-on-error: true

      - name: Verify deployment
        run: |
          sleep 3
          curl -sL -o /dev/null -w "ftgtours.esggo.co status: %{http_code}\n" "https://ftgtours.esggo.co/"
          curl -sL -o /dev/null -w "esggo.co status: %{http_code}\n" "https://esggo.co/"
        continue-on-error: true
