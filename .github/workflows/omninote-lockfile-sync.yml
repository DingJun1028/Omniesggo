# =============================================================================
# OmniNote: Unified — 一次性 lockfile 再生（PR #161）
# 前置修復已落地：duplicate glob@14.0.2 鍵已移除、cpu-features/ssh2 已列入
# ignoredBuiltDependencies。本工作流於 CI 環境以 pnpm 11.5.2 執行
# pnpm install --no-frozen-lockfile 重新生成與分支 package.jsons 完全同步之
# pnpm-lock.yaml，commit 回分支後自刪本檔（bot commit 不觸發遞迴 CI）。
# =============================================================================
name: Omninote Lockfile Sync (one-shot)

on:
  push:
    branches: [feat/omninote-unified-package]
    paths: ['.github/workflows/omninote-lockfile-sync.yml']

permissions:
  contents: write

concurrency:
  group: omninote-lockfile-sync
  cancel-in-progress: true

jobs:
  sync:
    name: Regenerate pnpm-lock.yaml on CI
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
        timeout-minutes: 5

      - name: Setup pnpm 11.5.2
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 11.5.2
        timeout-minutes: 3

      - name: Regenerate lockfile
        run: pnpm install --no-frozen-lockfile
        timeout-minutes: 20

      - name: Verify frozen now passes
        run: pnpm install --frozen-lockfile
        timeout-minutes: 10

      - name: Commit regenerated lockfile and remove this workflow (self-cleaning)
        run: |
          git config user.name "omninote-ci-bot"
          git config user.email "actions@github.com"
          git add pnpm-lock.yaml
          git rm .github/workflows/omninote-lockfile-sync.yml
          git commit -m "chore(omninote): regenerate pnpm-lock.yaml on CI (pnpm 11.5.2, branch-synced)"
          git push
        timeout-minutes: 5
