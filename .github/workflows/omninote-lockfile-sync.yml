# =============================================================================
# OmniNote: Unified — 一次性 lockfile 再生 v2（PR #161）
# 與 v1 差異：所有安裝輸出擷取至 install-diag2.txt，任何步驟失敗仍回傳
# 診斷檔（|| true），並回推再生後之 lockfile（如有變更）。
# =============================================================================
name: Omninote Lockfile Sync v2 (one-shot)

on:
  push:
    branches: [feat/omninote-unified-package]
    paths: ['.github/workflows/omninote-lockfile-sync.yml']

permissions:
  contents: write

concurrency:
  group: omninote-lockfile-sync
  cancel-in-progress: true

jobs:
  sync:
    name: Regenerate pnpm-lock.yaml on CI (diag)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
        timeout-minutes: 5

      - name: Setup pnpm 11.5.2
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 11.5.2
        timeout-minutes: 3

      - name: Regenerate and capture diagnostics
        run: |
          set +e
          {
            echo "=== pnpm --version ==="; pnpm --version
            echo; echo "=== pnpm install --no-frozen-lockfile ==="
            pnpm install --no-frozen-lockfile
            echo "nofrozen_exit_code=$?"
            echo; echo "=== pnpm install --frozen-lockfile ==="
            pnpm install --frozen-lockfile
            echo "frozen_exit_code=$?"
          } > install-diag2.txt 2>&1
          cat install-diag2.txt
        timeout-minutes: 25

      - name: Commit results and remove this workflow (self-cleaning, always)
        if: always()
        run: |
          git config user.name "omninote-ci-bot"
          git config user.email "actions@github.com"
          git add install-diag2.txt pnpm-lock.yaml
          git rm .github/workflows/omninote-lockfile-sync.yml
          git commit -m "chore(omninote): regenerate pnpm-lock.yaml on CI (v2, with diagnostics)"
          git push
        timeout-minutes: 5
