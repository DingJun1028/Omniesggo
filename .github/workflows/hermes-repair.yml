name: Hermes repair
on:
  push:
    branches: [probe/hermes-repair-20261107]
    paths: [.github/workflows/hermes-repair.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install OCI CLI
        run: pip3 install --quiet --disable-pip-version-check oci-cli
      - name: Configure OCI
        env:
          OCI_USER: ${{ secrets.OCI_USER_OCID }}
          OCI_TENANCY: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_REGION: ${{ secrets.OCI_REGION }}
          OCI_FINGERPRINT: ${{ secrets.OCI_API_FINGERPRINT }}
          OCI_KEY: ${{ secrets.OCI_API_KEY }}
          VPS_HOST_TARGET: ${{ secrets.VPS_HOST }}
        run: |
          mkdir -p ~/.oci
          cat > ~/.oci/config <<EOF
          [DEFAULT]
          user=$OCI_USER
          tenancy=$OCI_TENANCY
          region=$OCI_REGION
          key_file=/tmp/oci_key.pem
          fingerprint=$OCI_FINGERPRINT
          EOF
          printf '%s' "$OCI_KEY" > /tmp/oci_key.pem
          chmod 600 /tmp/oci_key.pem ~/.oci/config
          set +e
          R=/tmp/hrp-result.md
          echo "# Hermes repair $(date -u +%FT%TZ)" > $R
          echo "## OCI instance states" >> $R
          TARGET_OCID=""
          TARGET_STATE=""
          mapfile -t ROWS < <(oci compute instance list --compartment-id "$OCI_TENANCY" --all 2>&1 | jq -r '.data[] | [.id, ."display-name", ."lifecycle-state"] | @tsv')
          for row in "${ROWS[@]}"; do
            IFS=$'\t' read -r ocid dname state <<< "$row"
            ip=$(oci compute instance list-vnics --instance-id "$ocid" 2>/dev/null | jq -r '.data[0]."public-ip" // "none"')
            mark=""
            if [ "$ip" = "$VPS_HOST_TARGET" ]; then TARGET_OCID="$ocid"; TARGET_STATE="$state"; mark=" <== VPS_HOST"; fi
            echo "- $dname : $state$mark" >> $R
          done
          echo "TARGET_STATE=$TARGET_STATE" >> $R
          echo "target_state=$TARGET_STATE" >> "$GITHUB_OUTPUT"
          if [ -n "$TARGET_OCID" ] && [ "$TARGET_STATE" = "STOPPED" ]; then
            echo "## Starting stopped instance" >> $R
            oci compute instance-action --instance-id "$TARGET_OCID" --action START --wait-for-state RUNNING --max-wait-seconds 600 --wait-interval-seconds 10 >> $R 2>&1
            echo "START_ISSUED=1" >> $R
          elif [ -z "$TARGET_OCID" ]; then
            echo "## ERROR: no instance matches VPS_HOST public IP" >> $R
          fi
          cat $R
      - name: Wait for SSH and repair services
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          printf '%s\n' "$VPS_SSH_KEY" > /tmp/hrp_key
          chmod 600 /tmp/hrp_key
          set +e
          R=/tmp/hrp-result.md
          echo "## Waiting for SSH (up to ~12 min)" >> $R
          SSH_OK=0
          for i in $(seq 1 45); do
            if timeout 15 ssh -i /tmp/hrp_key -o StrictHostKeyChecking=accept-new -o ConnectTimeout=12 "$VPS_USER@$VPS_HOST" 'echo SSH_OK' > /tmp/ssh_probe 2>&1; then
              if grep -q SSH_OK /tmp/ssh_probe; then SSH_OK=1; break; fi
            fi
            sleep 15
          done
          echo "SSH_OK=$SSH_OK" >> $R
          if [ "$SSH_OK" = "1" ]; then
            echo "## On-VPS repair" >> $R
            timeout 120 ssh -i /tmp/hrp_key -o StrictHostKeyChecking=accept-new "$VPS_USER@$VPS_HOST" '
              echo "--- enable --now core units";
              sudo systemctl enable --now nginx hermes-serve hermes-dashboard 2>&1;
              for u in hermes-serve hermes-dashboard; do
                if ! sudo systemctl is-active --quiet $u; then
                  echo "$u inactive -> restart";
                  sudo systemctl restart $u 2>&1;
                  sleep 5;
                  sudo systemctl is-active $u;
                else
                  echo "$u already active";
                fi
              done;
              echo "--- ports"; ss -ltn 2>/dev/null | grep -E ":(80|443|3000|8642|9119|9120)" || echo "no expected ports listening";
              echo "--- pm2"; pm2 ls 2>/dev/null || echo "pm2 not available or empty";
              if pm2 ls 2>/dev/null | grep -q "0 online" || ! pm2 ls 2>/dev/null | grep -q online; then
                echo "pm2 resurrect attempt"; pm2 resurrect 2>&1 | tail -2;
              fi
              echo "--- unit final states";
              systemctl is-active nginx hermes-serve hermes-dashboard 2>&1;
              echo "--- journal tails";
              sudo journalctl -u hermes-serve -n 5 --no-pager 2>&1 | tail -5;
              sudo journalctl -u hermes-dashboard -n 5 --no-pager 2>&1 | tail -5;
            ' >> $R 2>&1
          fi
          cat $R
      - name: External verification
        run: |
          set +e
          R=/tmp/hrp-result.md
          sleep 20
          echo "## External verification" >> $R
          for u in "https://hermex.esggo.co/" "https://hermex.esggo.co/_uptime" "https://hermex.esggo.co/api/auth/providers" "https://esggo.co/" "https://ftgtours.esggo.co/"; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 25 "$u")
            echo "- $u -> HTTP $code" >> $R
          done
          echo "## End" >> $R
          cat $R
      - name: Publish result
        run: |
          cp /tmp/hrp-result.md hermes-repair-result.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hermes-repair-result.md
          git rm -q .github/workflows/hermes-repair.yml
          git commit -qm "hermes repair result"
          git push
