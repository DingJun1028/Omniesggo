name: Temporary repair dependency locks
on:
  pull_request:
    paths:
      - '.github/workflows/repair-lockfiles.yml'
      - '.github/worker-tools/package.json'
      - 'oa-team-crewai/pyproject.toml'
permissions:
  contents: read
jobs:
  generate:
    if: github.head_ref == 'fix/repo-ci-crewai-worker' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/repo-ci-crewai-worker
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: '0.13.5'
          enable-cache: false
      - name: Generate CrewAI lock without builds or LLM calls
        working-directory: oa-team-crewai
        run: uv lock --no-build --upgrade-package crewai
      - name: Generate isolated npm lock without lifecycle scripts
        run: |
          mkdir -p "$RUNNER_TEMP/lock-worker"
          cp .github/worker-tools/package.json "$RUNNER_TEMP/lock-worker/package.json"
          cd "$RUNNER_TEMP/lock-worker"
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          cp package-lock.json "$GITHUB_WORKSPACE/.github/worker-tools/package-lock.json"
      - name: Generate actionlint module checksums
        run: |
          mkdir -p "$RUNNER_TEMP/lock-actionlint" .github/actionlint
          cd "$RUNNER_TEMP/lock-actionlint"
          go mod init omniesggo-actionlint-tools
          go get github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          cp go.mod go.sum "$GITHUB_WORKSPACE/.github/actionlint/"
      - name: Commit only generated locks to the repair branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add oa-team-crewai/uv.lock .github/actionlint/go.mod .github/actionlint/go.sum
          git add -f .github/worker-tools/package-lock.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore(ci): lock CrewAI, Worker tooling and actionlint dependencies'
          git push origin HEAD:fix/repo-ci-crewai-worker
