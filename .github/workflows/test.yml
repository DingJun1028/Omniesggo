name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Run junaikey unit tests
        run: node tests/junaikey.test.mjs
      - name: Run model and service resolver unit tests
        run: node --test vps/junaikey/model-resolver.test.mjs vps/junaikey/service-resolver.test.mjs
      - name: Run canon unit tests
        run: node tests/canon.test.mjs
      - name: Run omnitag unit tests
        run: node tests/omnitag.test.mjs
      - name: Run junaikey benchmark
        run: node tests/junaikey.bench.mjs
      - name: Run omni-one 10-layer concentric facilities unit tests
        run: node tests/omni-one.test.mjs
      - name: Run G17 deploy contract tests
        run: node tests/deploy-contract.test.mjs
      - name: Junaikey secrets convention check (fault-tolerant)
        run: node scripts/ci-secrets.mjs
      - name: Run G18 junaikey secrets gate tests
        run: node tests/junaikey-secrets.test.mjs
