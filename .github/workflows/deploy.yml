# .github/workflows/deploy.yml — CI/CD Pipeline with Security Scanning
# Created by wing-ops (esggo-swarm) security review
# NOTE: Live VPS uses HOST nginx (TLS terminator on 0.0.0.0:80/443) + vps/docker-compose.yml
# containers. docker-compose.prod.yml's nginx service would CONFLICT with host nginx,
# so deploy uses docker-compose.yml (esggo + redis + gateway) and reloads host nginx.

name: ESG-GO CI/CD Pipeline

on:
  push:
    branches: [main]
    paths:
      - "vps/**"
      - "src/**"
      - "app/**"
      - "packages/**"
      - "apps/**"
      - "public/**"
      - "next.config.*"
      - "package.json"
      - "pnpm-lock.yaml"
      - "Dockerfile*"
      - ".github/workflows/deploy.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:

# NOTE: the production deploy lock is declared on the `deploy` JOB (see below), NOT here.
# A workflow-level `concurrency` also applies to `pull_request` runs, which then hold the
# production lock for the whole ~6h QEMU-emulated ARM64 `docker-build` job while being
# structurally unable to deploy (the `deploy` job is gated to `push` on main). Because
# `cancel-in-progress: false` keeps only ONE pending run per group, the next run entering
# the group cancels a queued main deploy — observed on run 32668189117 (main @ 12f694cf:
# total_count=0 jobs, conclusion=cancelled). See issue #900.

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '11.5.2'

jobs:
  # ─── Security Scanning ─────────────────────────────────────────
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner (filesystem)
        uses: aquasecurity/trivy-action@8f28faec26515256b6d22074d1d2a8986f4cbd87
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          trivyignores: ".trivyignore"

      - name: Run Hadolint on Dockerfiles
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: 'Dockerfile'
          failure-threshold: error

      - name: Check for secrets in code
        if: github.event_name == 'push'
        uses: trufflesecurity/trufflehog@main
        with:
          base: ${{ github.event.before }}
          head: ${{ github.event.after }}
          extra_args: --only-verified

  # ─── Code Quality ─────────────────────────────────────────────
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      
      - name: Install dependencies
        id: install
        run: pnpm install --frozen-lockfile
      
      - name: Run ESLint (if configured)
        if: ${{ always() }}
        continue-on-error: true
        run: |
          set -e
          echo "Checking for ESLint configuration..."
          if [ -f ".eslintrc.js" ] || [ -f ".eslintrc.json" ] || [ -f "eslint.config.js" ] || [ -f ".eslintrc" ] || { [ -f "package.json" ] && grep -q "eslint" package.json; }; then
            echo "ESLint configuration found, running project lint (pnpm lint)..."
            pnpm lint --max-warnings=9999
          else
            echo "ESLint not configured, skipping..."
          fi
      
      - name: Run Type Check (if configured)
        if: ${{ always() }}
        run: |
          set -e
          echo "Checking for TypeScript configuration..."
          if [ -f "tsconfig.json" ] || [ -f "tsconfig.build.json" ] || [ -f "tsconfig.core.json" ]; then
            echo "TypeScript configuration found, running project type check (pnpm typecheck)..."
            pnpm typecheck
          else
            echo "TypeScript not configured, skipping..."
          fi


      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        continue-on-error: true
        run: pnpm lint --max-warnings=9999

      - name: Run TypeScript type checking
        run: pnpm typecheck

      - name: Run tests
        continue-on-error: true
        run: pnpm test

  # ─── Docker Build Test ───────────────────────────────────────
  docker-build:
    name: Docker Build Test
    # NATIVE arm64 runner (free for public repos). Previously `ubuntu-latest`,
    # which forced buildx to emulate arm64 through QEMU; `RUN pnpm run build`
    # then died with `qemu: uncaught target signal 4 (Illegal instruction)` /
    # `Command was killed with SIGILL` inside corepack's pnpm.mjs. The stack
    # frames land in pnpm.mjs, which makes it LOOK like a dependency/build bug —
    # it is not: do NOT "fix" it by touching pnpm-lock.yaml. Building natively
    # removes the emulator from the path entirely.
    # source_origin: OA-TWINS auto-repair / brief _repair_pr_957.txt / run 32947717773
    runs-on: ubuntu-24.04-arm
    needs: [security-scan, code-quality]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (ARM64)
        # Diagnostic build: on failure, surface the build log's error lines as
        # check-run annotations (::error::) so the root cause is visible via the
        # public annotations API without admin log access. See issue #91 / PR #114.
        run: |
          set -o pipefail
          docker buildx build \
            --file vps/Dockerfile.arm64 \
            --platform linux/arm64 \
            --tag esggo:test \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            --progress=plain \
            . > build.log 2>&1 || BUILD_FAILED=1
          if [ "${BUILD_FAILED:-0}" = "1" ]; then
            echo "==== BUILD FAILED — error extract (see annotations) ===="
            grep -nEi "error:|module not found|cannot find|failed to compile|type error|syntax error|not found:" build.log | tail -40 | while IFS= read -r line; do
              msg=$(printf '%s' "$line" | cut -c1-240 | tr "'" '"' )
              echo "::error::$msg"
            done
            tail -30 build.log | while IFS= read -r line; do
              msg=$(printf '%s' "$line" | cut -c1-240 | tr "'" '"' )
              echo "::error::TAIL $msg"
            done
            exit 1
          fi

  # ─── Deploy to VPS ──────────────────────────────────────────
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: [security-scan, code-quality, docker-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    # Serialize ONLY genuine production deploys. This is the lock that used to sit at
    # workflow level (see the NOTE at the top of this file); at job level it is held for
    # the duration of the SSH deploy instead of the whole ~6h ARM64 build matrix, and it
    # is never taken by `pull_request` runs (which cannot satisfy the `if:` above).
    # source_origin: issue #900 / OA-TWINS auto-repair
    concurrency:
      group: deploy-vps
      cancel-in-progress: false
    timeout-minutes: 90
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        timeout-minutes: 90
        continue-on-error: true
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          timeout: 60m
          command_timeout: 60m
          script: |
            cd /opt/esggo

            # Pull latest changes
            git fetch origin main
            git reset --hard origin/main

            # Sync FTG 3.0 static files to nginx
            rsync -avz --delete \
              --include="*.png" --include="*.html" --include="*.css" --include="*.js" \
              --include="*.json" --include="*.sql" --include="*.md" \
              --exclude="*" \
              apps/ftg-3.0/public/images/esg-impact-note/ \
              /var/www/ftg.esggo.co/images/esg-impact-note/
            rsync -avz \
              apps/ftg-3.0/index.html apps/ftg-3.0/styles.css apps/ftg-3.0/app.js apps/ftg-3.0/feedback.html \
              /var/www/ftg.esggo.co/

            # Build and deploy the LIVE stack (docker-compose.yml = host nginx + containers).
            # NOTE: do NOT use docker-compose.prod.yml here — its nginx service publishes
            # 80/443 and would conflict with the host nginx that terminates TLS.
            cd vps
            docker compose -f docker-compose.yml build
            docker compose -f docker-compose.yml up -d

            # Reload host nginx in case conf/vhost changed
            sudo nginx -t && sudo systemctl reload nginx

            # Wait for health checks
            sleep 30

            # Verify services are running
            docker compose -f docker-compose.yml ps

            # Cleanup old images
            docker image prune -f

      - name: Notify deployment
        if: success()
        run: echo "✅ Deployment successful to ${{ secrets.VPS_HOST }}"

      - name: Notify failure
        id: slack-check
        if: failure()
        run: |
          if [ -n "${{ secrets.SLACK_WEBHOOK_URL }}" ]; then
            echo "has_webhook=true" >> $GITHUB_OUTPUT
          else
            echo "has_webhook=false" >> $GITHUB_OUTPUT
            echo "[SKIP] SLACK_WEBHOOK_URL not configured — skipping Slack notification"
          fi

      - name: Notify Slack (if webhook configured)
        if: ${{ always() && steps.slack-check.outputs.has_webhook == 'true' }}
        continue-on-error: true
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          text: 'Smart AI Router deploy ${{ github.ref_name }} - status: ${{ job.status }}'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  # 6. Validate VPS deployment scripts (ESGGO Node/PM2 stack)
  validate-vps-scripts:
    name: Validate VPS Scripts
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/production'
    continue-on-error: false
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Lint vps shell / node / python scripts
        run: |
          set -e
          echo "== bash syntax =="
          shopt -s globstar nullglob
          fail=0
          for f in vps/**/*.sh vps/*.sh; do
            # Skip console-/recovery-/bundle heredoc wrappers
            case "$f" in
              */console-*|*/recovery/*|*-bundle*|*oneshot*) echo "SKIP $f (console/recovery heredoc wrapper)"; continue ;;
            esac
            if bash -n "$f"; then echo "OK  $f"; else echo "FAIL $f"; fail=1; fi
          done
          echo "== node syntax =="
          for f in vps/**/*.mjs vps/**/*.cjs vps/*.mjs vps/*.cjs; do
            if node --check "$f"; then echo "OK  $f"; else echo "FAIL $f"; fail=1; fi
          done
          echo "== python syntax =="
          for f in vps/**/*.py vps/*.py; do
            if python3 -m py_compile "$f"; then echo "OK  $f"; else echo "FAIL $f"; fail=1; fi
          done
          echo "== yaml syntax =="
          for f in vps/**/*.yml vps/**/*.yaml vps/*.yml vps/*.yaml; do
            if python3 -c "import yaml; yaml.safe_load(open('$f'))"; then echo "OK  $f"; else echo "FAIL $f"; fail=1; fi
          done
          exit $fail

      - name: Secret scan on vps scripts
        run: |
          set -e
          echo "Scanning vps/** for accidentally committed secrets or bad patterns..."
          # 1) Real credential shapes (HARD FAIL)
          if grep -rInE "(ocid1\.[a-z0-9]+\.|AKIA[0-9A-Z]{16}|gh[pousr]_[A-Za-z0-9]{30,}|-----BEGIN .*PRIVATE KEY-----|npm_[A-Za-z0-9]{36}|SG\.[A-Za-z0-9_-]{22,}\.[A-Za-z0-9_-]{43,}|sk_live_[A-Za-z0-9]+|rk_live_[A-Za-z0-9]+|AC[a-f0-9]{32}|cfat_[A-Za-z0-9_-]{20,})" vps/ ; then
            echo "::error::Possible secret found in vps/ — aborting."; exit 1
          fi
          # 2) Hardcoded default secrets in long-running SERVER code (.mjs only).
          if grep -rInE "\\\$\{[A-Za-z_]+:-[A-Za-z0-9_'-]{8,}\}" vps/*.mjs vps/**/*.mjs 2>/dev/null | grep -iE "token|secret|key|pass|auth" ; then
            echo "::error::Hardcoded default secret in server .mjs (use env + fail-fast) — aborting."; exit 1
          fi
          if grep -rInE "(AUTH_TOKEN|TOKEN|API_KEY|API_SERVER_KEY)=\"?[A-Za-z0-9_'-]{8,}\"?" vps/ | grep -vE '\$\{|\$\(|process\.env|os\.environ|getenv' | grep -iE "token|secret|key|pass|auth" ; then
            echo "::warning::Hardcoded token fallback found in a console/bootstrap script — ensure .env.secrets provides the real value."
          fi
          # 3) Server binding to all interfaces (should be 127.0.0.1 behind nginx) (HARD FAIL)
          if grep -rInE "listen\([^,)]*['\"]0\.0\.0\.0|HOST\s*=\s*['\"]0\.0\.0\.0['\"]" vps/*.mjs vps/**/*.mjs vps/*.py vps/**/*.py 2>/dev/null ; then
            echo "::error::Server binds 0.0.0.0 (exposes directly) — bind 127.0.0.1 instead — aborting."; exit 1
          fi
          # 4) Connection strings with embedded passwords (HARD FAIL).
          # Exclude placeholder/redacted DSNs (contain *** or ${...} or <...>) — those are not real secrets.
          if grep -rInE "(mysql|postgres|mongodb)://[^:]+:[^@]+@" vps/ 2>/dev/null | grep -vE '\*\*\*|\$\{|<' ; then
            echo "::error::Connection string with embedded password found — use env vars instead — aborting."; exit 1
          fi
          echo "No secrets or unsafe patterns detected."
