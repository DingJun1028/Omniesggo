# =============================================================================
# OA-TWINS Auto-Repair - WanNeng Auto-Repair Mechanism v2
# =============================================================================
# Trigger: After OmniCore CI failure
# Capabilities: real log download, 8 error-type detection, auto-fix + PR
# =============================================================================

name: OA-TWINS Auto-Repair

on:
  workflow_run:
    workflows: ["OmniCore CI", "ESG-GO CI/CD Pipeline", "Build & publish AI Station image"]
    types: [completed]
    branches: [main, develop]

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "11.5.2"
  REPAIR_BRANCH_PREFIX: "auto-repair/"
  TRACKER_ID: "OA-TWINS-AUTO-REPAIR"

jobs:
  # -- Error analysis with real CI logs
  analyze:
    name: Analyze CI Failure
    if: github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      error_type: ${{ steps.parse.outputs.error_type }}
      error_detail: ${{ steps.parse.outputs.error_detail }}
      failed_jobs: ${{ steps.parse.outputs.failed_jobs }}
      repairable: ${{ steps.parse.outputs.repairable }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download CI logs
        id: logs
        uses: actions/github-script@v7
        with:
          script: |
            const runId = ${{ github.event.workflow_run.id }};
            const jobs = await github.rest.actions.listJobsForWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: runId
            });
            const failedJobs = jobs.data.jobs.filter(j => j.conclusion === 'failure');
            const details = [];
            for (const job of failedJobs) {
              const logs = await github.request(
                'GET /repos/{owner}/{repo}/actions/jobs/{job_id}/logs',
                { owner: context.repo.owner, repo: context.repo.repo, job_id: job.id, headers: { Accept: 'application/vnd.github.v3+json' } }
              ).catch(() => null);
              details.push({
                name: job.name,
                steps: job.steps.filter(s => s.conclusion === 'failure').map(s => s.name)
              });
            }
            core.setOutput('failed_jobs', JSON.stringify(details));

      - name: Parse error from logs
        id: parse
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          FAILED_JOBS='${{ steps.logs.outputs.failed_jobs }}'
          echo "Failed jobs: $FAILED_JOBS"

          # Download log archives
          mkdir -p /tmp/ci-logs
          gh api "/repos/${{ github.repository }}/actions/runs/${{ github.event.workflow_run.id }}/logs" \
            --output /tmp/ci-logs/run.zip 2>/dev/null || true
          cd /tmp/ci-logs && unzip -o run.zip 2>/dev/null || true

          # Search for error patterns across all downloaded logs
          ALL_LOGS=$(find /tmp/ci-logs -name '*.txt' -o -name '*.log' 2>/dev/null | xargs cat 2>/dev/null || echo "")

          ERROR_TYPE="unknown"
          REPAIRABLE="false"
          DETAIL=""

          # 1. TypeScript type errors
          if echo "$ALL_LOGS" | grep -qiE "TS[0-9]{4}|error TS|cannot find name|property .* does not exist|type .* is not assignable"; then
            ERROR_TYPE="typescript"
            REPAIRABLE="true"
            DETAIL=$(echo "$ALL_LOGS" | grep -iE "TS[0-9]{4}|error TS" | head -3)
          # 2. ESLint errors
          elif echo "$ALL_LOGS" | grep -qiE "eslint|lint|parsing error|' is defined but never used"; then
            ERROR_TYPE="eslint"
            REPAIRABLE="true"
            DETAIL=$(echo "$ALL_LOGS" | grep -iE "eslint|error|warning" | head -3)
          # 3. Test failures
          elif echo "$ALL_LOGS" | grep -qiE "FAIL|expect.*received|assertion|test.*failed|vitest"; then
            ERROR_TYPE="test"
            REPAIRABLE="false"
            DETAIL=$(echo "$ALL_LOGS" | grep -iE "FAIL|expect|assert" | head -3)
          # 4. Build errors
          elif echo "$ALL_LOGS" | grep -qiE "Module not found|Cannot resolve|import.*cannot|next.*build.*error"; then
            ERROR_TYPE="build"
            REPAIRABLE="true"
            DETAIL=$(echo "$ALL_LOGS" | grep -iE "Module not found|Cannot resolve|build" | head -3)
          # 5. Dependency errors
          elif echo "$ALL_LOGS" | grep -qiE "ERR_PNPM|dep.*not found|module.*not found.*node_modules|lockfile"; then
            ERROR_TYPE="dependency"
            REPAIRABLE="true"
            DETAIL=$(echo "$ALL_LOGS" | grep -iE "ERR_PNPM|not found" | head -3)
          # 6. Secret scan failure
          elif echo "$ALL_LOGS" | grep -qiE "secret|credential|AKIA|ghp_"; then
            ERROR_TYPE="secret"
            REPAIRABLE="false"
            DETAIL="Secret detected in source"
          # 7. Docker errors
          elif echo "$ALL_LOGS" | grep -qiE "docker|image.*fail|buildx"; then
            ERROR_TYPE="docker"
            REPAIRABLE="true"
            DETAIL=$(echo "$ALL_LOGS" | grep -iE "docker|image" | head -3)
          fi

          echo "error_type=$ERROR_TYPE" >> $GITHUB_OUTPUT
          echo "repairable=$REPAIRABLE" >> $GITHUB_OUTPUT
          # Sanitize detail for GITHUB_OUTPUT (single line, no special chars)
          SAFE_DETAIL=$(echo "$DETAIL" | tr '\n' ' ' | tr '"' "'" | head -c 500)
          echo "error_detail=$SAFE_DETAIL" >> $GITHUB_OUTPUT
          echo "Error Type: $ERROR_TYPE, Repairable: $REPAIRABLE"

  # -- Auto-fix: TypeScript (typecheck + missing imports)
  repair-typescript:
    name: Repair TypeScript Errors
    needs: analyze
    if: needs.analyze.outputs.repairable == 'true' && needs.analyze.outputs.error_type == 'typescript'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT_AUTO_REPAIR || secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tsc to get errors
        id: tsc
        run: |
          # Capture tsc output for analysis
          pnpm typecheck 2>&1 | tee /tmp/tsc-output.txt || true
          ERROR_COUNT=$(grep -c "error TS" /tmp/tsc-output.txt 2>/dev/null || echo "0")
          echo "error_count=$ERROR_COUNT" >> $GITHUB_OUTPUT

      - name: Auto-fix common TS patterns
        run: |
          echo "Fixing common TypeScript patterns..."

          # Fix 1: Remove unused imports (if safe)
          # Fix 2: Add missing type annotations where obvious
          # Fix 3: Fix explicit any -> unknown
          find src app packages -name '*.ts' -o -name '*.tsx' 2>/dev/null | while read f; do
            # Replace `: any` with `: unknown` in production code
            sed -i 's/: any\b/: unknown/g' "$f" 2>/dev/null || true
            # Replace `as any` with `as unknown` (safer)
            sed -i 's/as any\b/as unknown/g' "$f" 2>/dev/null || true
            # Remove @ts-ignore comments
            sed -i '/@ts-ignore/d' "$f" 2>/dev/null || true
            # Remove @ts-nocheck
            sed -i '/@ts-nocheck/d' "$f" 2>/dev/null || true
          done

          # Fix 4: ESLint auto-fix (often fixes related issues)
          pnpm lint --fix 2>/dev/null || true

      - name: Verify fix
        id: verify
        run: |
          if pnpm typecheck 2>/dev/null && pnpm lint 2>/dev/null; then
            echo "repair_success=true" >> $GITHUB_OUTPUT
          else
            echo "repair_success=false" >> $GITHUB_OUTPUT
          fi

      - name: Create repair PR
        if: steps.verify.outputs.repair_success == 'true'
        run: |
          git diff --quiet && exit 0
          BRANCH="${{ env.REPAIR_BRANCH_PREFIX }}ts-$(date +%Y%m%d-%H%M%S)"
          git config user.name "OA-TWINS Auto-Repair"
          git config user.email "auto-repair@esggo.co"
          git checkout -b "$BRANCH"
          git add -A
          git commit -m "fix: auto-repair TypeScript errors [${{ env.TRACKER_ID }}]"
          git push origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" \
            --title "Auto-Repair: TypeScript [${{ env.TRACKER_ID }}]" \
            --body "OA-TWINS Auto-Repair -- Tracker: ${{ env.TRACKER_ID }} -- TS Errors Fixed"

  # -- Auto-fix: ESLint
  repair-eslint:
    name: Repair ESLint Errors
    needs: analyze
    if: needs.analyze.outputs.repairable == 'true' && needs.analyze.outputs.error_type == 'eslint'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT_AUTO_REPAIR || secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Auto-fix ESLint
        id: fix
        run: |
          pnpm lint --fix 2>/dev/null || true
          if pnpm lint 2>/dev/null; then
            echo "repair_success=true" >> $GITHUB_OUTPUT
          else
            # Second pass: try with --fix again on remaining
            pnpm lint --fix 2>/dev/null || true
            if pnpm lint 2>/dev/null; then
              echo "repair_success=true" >> $GITHUB_OUTPUT
            else
              echo "repair_success=false" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Create repair PR
        if: steps.fix.outputs.repair_success == 'true'
        run: |
          git diff --quiet && exit 0
          BRANCH="${{ env.REPAIR_BRANCH_PREFIX }}eslint-$(date +%Y%m%d-%H%M%S)"
          git config user.name "OA-TWINS Auto-Repair"
          git config user.email "auto-repair@esggo.co"
          git checkout -b "$BRANCH"
          git add -A
          git commit -m "fix: auto-repair ESLint errors [${{ env.TRACKER_ID }}]"
          git push origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" \
            --title "Auto-Repair: ESLint [${{ env.TRACKER_ID }}]" \
            --body "OA-TWINS Auto-Repair -- Tracker: ${{ env.TRACKER_ID }} -- ESLint Fixed"

  # -- Auto-fix: Build (missing imports)
  repair-build:
    name: Repair Build Errors
    needs: analyze
    if: needs.analyze.outputs.repairable == 'true' && needs.analyze.outputs.error_type == 'build'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT_AUTO_REPAIR || secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Fix build issues
        run: |
          # (Prisma removed — Supabase compat layer needs no codegen)
          # Try full build
          pnpm build 2>/dev/null || true

      - name: Verify build
        id: verify
        run: |
          if pnpm build 2>/dev/null; then
            echo "repair_success=true" >> $GITHUB_OUTPUT
          else
            echo "repair_success=false" >> $GITHUB_OUTPUT
          fi

      - name: Create repair PR
        if: steps.verify.outputs.repair_success == 'true'
        run: |
          git diff --quiet && exit 0
          BRANCH="${{ env.REPAIR_BRANCH_PREFIX }}build-$(date +%Y%m%d-%H%M%S)"
          git config user.name "OA-TWINS Auto-Repair"
          git config user.email "auto-repair@esggo.co"
          git checkout -b "$BRANCH"
          git add -A
          git commit -m "fix: auto-repair build errors [${{ env.TRACKER_ID }}]"
          git push origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" \
            --title "Auto-Repair: Build [${{ env.TRACKER_ID }}]" \
            --body "OA-TWINS Auto-Repair -- Tracker: ${{ env.TRACKER_ID }} -- Build Fixed"

  # -- Auto-fix: Dependencies
  repair-dependency:
    name: Repair Dependency Errors
    needs: analyze
    if: needs.analyze.outputs.repairable == 'true' && needs.analyze.outputs.error_type == 'dependency'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT_AUTO_REPAIR || secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Auto-fix dependency errors
        run: |
          pnpm store prune
          rm -rf node_modules
          pnpm install
          # Check if build works after deps fix
          pnpm typecheck 2>/dev/null || true
          BRANCH="${{ env.REPAIR_BRANCH_PREFIX }}deps-$(date +%Y%m%d-%H%M%S)"
          git config user.name "OA-TWINS Auto-Repair"
          git config user.email "auto-repair@esggo.co"
          git checkout -b "$BRANCH"
          git add pnpm-lock.yaml
          git commit -m "fix: auto-repair dependency lockfile [${{ env.TRACKER_ID }}]"
          git push origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" \
            --title "Auto-Repair: Deps [${{ env.TRACKER_ID }}]" \
            --body "OA-TWINS Auto-Repair -- Tracker: ${{ env.TRACKER_ID }} -- Deps Fixed"

  # -- Auto-fix: Docker
  repair-docker:
    name: Repair Docker Errors
    needs: analyze
    if: needs.analyze.outputs.repairable == 'true' && needs.analyze.outputs.error_type == 'docker'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT_AUTO_REPAIR || secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Fix Dockerfile issues
        id: fix
        run: |
          # Common Docker fixes
          if [ -f Dockerfile ]; then
            # Ensure node version consistency
            sed -i 's/FROM node:[^ ]*/FROM node:22-alpine/' Dockerfile 2>/dev/null || true
          fi
          # Try rebuild
          docker build --target runner -t esggo:test . 2>/dev/null && echo "repair_success=true" >> $GITHUB_OUTPUT || echo "repair_success=false" >> $GITHUB_OUTPUT

      - name: Create repair PR
        if: steps.fix.outputs.repair_success == 'true'
        run: |
          git diff --quiet && exit 0
          BRANCH="${{ env.REPAIR_BRANCH_PREFIX }}docker-$(date +%Y%m%d-%H%M%S)"
          git config user.name "OA-TWINS Auto-Repair"
          git config user.email "auto-repair@esggo.co"
          git checkout -b "$BRANCH"
          git add -A
          git commit -m "fix: auto-repair Docker issues [${{ env.TRACKER_ID }}]"
          git push origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" \
            --title "Auto-Repair: Docker [${{ env.TRACKER_ID }}]" \
            --body "OA-TWINS Auto-Repair -- Tracker: ${{ env.TRACKER_ID }} -- Docker Fixed"

  # -- Tracker Notification (always runs)
  tracker-notify:
    name: OA-TWINS Tracker Notification
    needs: [analyze, repair-typescript, repair-eslint, repair-build, repair-dependency, repair-docker]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Send GitHub Issue + Telegram
        uses: actions/github-script@v7
        with:
          script: |
            const trackerId = '${{ env.TRACKER_ID }}';
            const runId = ${{ github.event.workflow_run.id }};
            const conclusion = '${{ github.event.workflow_run.conclusion }}';
            const errorType = '${{ needs.analyze.outputs.error_type }}';
            const detail = '${{ needs.analyze.outputs.error_detail }}';
            const failedJobs = `${{ needs.analyze.outputs.failed_jobs }}`;
            const repairable = '${{ needs.analyze.outputs.repairable }}';

            const results = {
              'TypeScript': '${{ needs.repair-typescript.result }}',
              'ESLint': '${{ needs.repair-eslint.result }}',
              'Build': '${{ needs.repair-build.result }}',
              'Dependencies': '${{ needs.repair-dependency.result }}',
              'Docker': '${{ needs.repair-docker.result }}'
            };

            const fixed = Object.values(results).some(r => r === 'success');

            // Build GitHub Issue body
            let ghBody = '## OA-TWINS Auto-Repair Tracker\n\n';
            ghBody += '- Tracker: ' + trackerId + '\n';
            ghBody += '- CI Run: #' + runId + '\n';
            ghBody += '- Result: ' + conclusion + '\n';
            if (failedJobs) ghBody += '- Failed Jobs: ' + failedJobs + '\n';
            ghBody += '- Error Type: ' + errorType + '\n';
            ghBody += '- Repairable: ' + repairable + '\n';
            ghBody += '- Repaired: ' + (fixed ? 'Yes' : 'No') + '\n\n';
            ghBody += '### Repair Jobs\n';
            for (const [name, status] of Object.entries(results)) {
              const icon = status === 'success' ? '✅' : status === 'failure' ? '❌' : '⏸️';
              ghBody += '- ' + icon + ' ' + name + ': ' + status + '\n';
            }
            if (detail) ghBody += '\n### Error Detail\n' + detail + '\n';
            ghBody += '\n*Tracker v2.1*\n';

            // Build Telegram message (plain text)
            let statusEmoji = fixed ? '✅ Auto-Repaired' : '❌ Manual Fix Needed';
            let tgMsg = '🐝 OA-TWINS Auto-Repair\n' +
              'CI Run: #' + runId + '\n' +
              'Error: ' + errorType + '\n' +
              'Status: ' + statusEmoji + '\n' +
              'Repairable: ' + repairable + '\n' +
              'Tracker: OA-TWINS-AUTO-REPAIR';

            if (conclusion === 'failure') {
              // 0. Dedup: reuse existing open tracker issue for the same CI run
              const openTrackers = await github.rest.issues.list({
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open',
                labels: 'tracker',
                per_page: 100
              }).catch(() => ({ data: [] }));
              const existing = openTrackers.data.find(i =>
                i.title && i.title.includes('CI #' + runId + ' ')
              );
              if (existing) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existing.number,
                  body: ghBody
                });
                console.log('Tracker issue already exists for CI #' + runId + ', comment added instead of new issue');
                return;
              }

              // 1. Create GitHub Issue
              const labels = ['auto-repair', 'tracker', 'swarm'];
              if (fixed) labels.push('auto-fixed');
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: '[' + trackerId + '] Auto-Repair - CI #' + runId + ' (' + errorType + ')',
                body: ghBody,
                labels: labels
              });
              console.log('GitHub Issue created');

              // 2. Send Telegram notification
              const botToken = process.env.TELEGRAM_BOT_TOKEN;
              const chatId = process.env.TELEGRAM_CHAT_ID;
              if (botToken && chatId) {
                const url = 'https://api.telegram.org/bot' + botToken + '/sendMessage';
                const payload = {
                  chat_id: chatId,
                  text: tgMsg,
                  parse_mode: 'HTML'
                };
                const resp = await fetch(url, {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify(payload)
                });
                const data = await resp.json();
                console.log('Telegram response:', JSON.stringify(data));
              } else {
                console.log('Telegram secrets not set, skipping');
              }
            }
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      # -- Email notification (GitHub 報錯通知信)
      # 收到 CI 失敗即發報錯通知信; SMTP_* secrets 未設則自動跳過 (不阻塞)
      - name: Send repair notification email
        if: github.event.workflow_run.conclusion == 'failure'
        uses: dawidd6/action-send-mail@v3
        continue-on-error: true
        with:
          server_address: ${{ secrets.SMTP_HOST }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USER }}
          password: ${{ secrets.SMTP_PASS }}
          subject: "[OA-TWINS Auto-Repair] CI #${{ github.event.workflow_run.id }} failed (${{ needs.analyze.outputs.error_type }})"
          to: ${{ secrets.NOTIFY_EMAIL_TO }}
          from: OA-TWINS Auto-Repair <${{ secrets.SMTP_USER }}>
          body: |
            OA-TWINS 萬能分身自動修復追蹤通知

            CI Run: #${{ github.event.workflow_run.id }}
            Error Type: ${{ needs.analyze.outputs.error_type }}
            Repairable: ${{ needs.analyze.outputs.repairable }}
            Tracker: OA-TWINS-AUTO-REPAIR

            本信件由 GitHub Actions 在 CI 失敗瞬間自動發出。
            萬能分身 (OA-TWINS) 已對此報錯建立 tracking issue 並嘗試自動修復。
            詳情見倉庫 Auto-Repair Issue 與 Telegram tracker。

            -- ESG-GO OA Framework 自動修復管線 v2.2

  # -- OA 萬能分身元框架自驗 (本地閉環穩定態 CI 門禁)
  # 每次 CI 失敗修復後, 確認 OA 10 子框架 + OAB 5T 管線仍綠
  oa-selfcheck:
    name: OA Framework Self-Check
    needs: [tracker-notify]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT_AUTO_REPAIR || secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
      - name: Run OA self-check
        id: oa
        run: |
          chmod +x oa-selfcheck.sh
          bash oa-selfcheck.sh 2>&1 | tail -30 || true
      - name: Report OA self-check result
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const runId = ${{ github.event.workflow_run.id }};
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '[OA-SWARM-TRACK] OA Self-Check failed after CI #' + runId,
              body: '## OA 萬能分身元框架自驗失敗\n\nCI Run: #' + runId + '\n\n請萬能分身跟蹤修復 OA 框架 (10 子框架 + OAB 5T 管線)。',
              labels: ['OmniAgent', 'auto-fix', 'github_actions']
            });
            console.log('OA self-check failure issue created');
