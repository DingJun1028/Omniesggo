name: docker-build-debug
on:
  push:
    branches: [feat/supabase-migration]
    paths: ['.github/workflows/docker-build-debug.yml']

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Reproduce docker build (capture log)
        run: |
          set +e
          docker buildx build --progress=plain --platform linux/arm64 \
            -f vps/Dockerfile.arm64 -t esggo:debug . > /tmp/build.log 2>&1
          echo "BUILD_EXIT=$?" >> "$GITHUB_ENV"
      - name: Emit error annotations and fail
        if: always()
        run: |
          if [ "${BUILD_EXIT:-0}" != "0" ]; then
            MSG=$(grep -iE "error|failed|exception|not found" /tmp/build.log | tail -n 6 | tr '\n' ' ' | tr -d '%' | cut -c1-600)
            echo "::error::docker build exit=$BUILD_EXIT :: $MSG"
            TAILMSG=$(tail -n 20 /tmp/build.log | tr '\n' ' ' | tr -d '%' | cut -c1-600)
            echo "::error::tail: $TAILMSG"
            exit 1
          else
            echo "docker build passed"
          fi
