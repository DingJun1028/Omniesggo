name: Temp FTG lockfile minimize

on:
  push:
    branches: [fix/ftg-tailwind-3]
    paths:
      - '.github/workflows/temp-ftg-lock-minimize.yml'

permissions:
  contents: write

jobs:
  minimize:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/ftg-tailwind-3
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Rebuild lockfile as main plus FTG importer block only
        run: |
          git fetch origin main
          python3 - <<'PY'
          import re, subprocess, sys
          main = subprocess.check_output(['git', 'show', 'origin/main:pnpm-lock.yaml'], text=True)
          head = open('pnpm-lock.yaml').read()
          pat = re.compile(r'^  apps/ftg-tours-website:\n(?:(?:    .*)?\n)*', re.M)
          mb = pat.search(main)
          hb = pat.search(head)
          assert mb and hb, 'importer block not found'
          print('--- main block ---'); print(mb.group(0))
          print('--- head block ---'); print(hb.group(0))
          new = main[:mb.start()] + hb.group(0) + main[mb.end():]
          cur = None
          missing = []
          for line in hb.group(0).splitlines():
              m = re.match(r"^      '?([^':]+)'?:$", line)
              if m:
                  cur = m.group(1)
                  continue
              m = re.match(r'^        version: (\S.*)$', line)
              if m and cur:
                  ver = m.group(1)
                  if ver.startswith('link:'):
                      continue
                  key = cur + '@' + ver
                  if not re.search(r"^  '?" + re.escape(key) + r"'?:", new, re.M):
                      missing.append(key)
          print('missing snapshots:', missing)
          if missing:
              sys.exit(1)
          open('pnpm-lock.yaml', 'w').write(new)
          PY
          git diff --stat origin/main -- pnpm-lock.yaml
          git diff origin/main -- pnpm-lock.yaml
      - name: Verify frozen install
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Verify FTG build
        run: pnpm --filter ./apps/ftg-tours-website run build
      - name: Commit minimized lockfile
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pnpm-lock.yaml
          git commit -m 'chore(ftg): limit lockfile changes to FTG importer'
          git push origin HEAD:fix/ftg-tailwind-3
