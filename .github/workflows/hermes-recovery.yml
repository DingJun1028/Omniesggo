name: hermes-recovery
# One-off recovery workflow v3: restart hermes-serve (Hermex backend, 127.0.0.1:9119) on the VPS.
# Progress is committed to the branch (hermes-recovery-report.txt) after every step,
# so failures can be diagnosed even when API/log access is unavailable.
# Path A (preferred): OCI Compute Instance Run Command plugin (no downtime).
# Path B (fallback): hard RESET of the instance (hermes-serve starts on boot: Restart=always + multi-user.target).
permissions:
  contents: write
on:
  workflow_dispatch:
  push:
    branches: ['**']
    paths: ['.github/workflows/hermes-recovery.yml']

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      OCI_USER: ${{ secrets.OCI_USER_OCID }}
      OCI_TENANCY: ${{ secrets.OCI_TENANCY_OCID }}
      OCI_REGION: ${{ secrets.OCI_REGION }}
      OCI_FINGERPRINT: ${{ secrets.OCI_API_FINGERPRINT }}
      OCI_KEY: ${{ secrets.OCI_API_KEY }}
      OCI_TARGET: ${{ secrets.OCI_TARGET_RESOURCE_ID }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
    steps:
      - uses: actions/checkout@v4
      - name: Heartbeat - push started marker
        timeout-minutes: 3
        run: |
          set -e
          touch /tmp/recovery.log
          echo "HEARTBEAT run started $(date -u)" >> /tmp/recovery.log
          git config user.name "hermes-recovery-bot"
          git config user.email "actions@users.noreply.github.com"
          cp /tmp/recovery.log hermes-recovery-report.txt
          git add hermes-recovery-report.txt
          git commit -m "heartbeat: run started" || true
          git push origin HEAD:fix/hermes-serve-recovery && echo "PUSH_OK" || echo "PUSH_FAIL"

      - name: Report helper
        run: |
          cat > /usr/local/bin/report <<'EOS'
          #!/bin/bash
          # usage: report "line1" ...
          for l in "$@"; do echo "$l" >> /tmp/recovery.log; done
          {
            echo "report updated $(date -u)"
            cat /tmp/recovery.log
          } > hermes-recovery-report.txt
          git config user.name "hermes-recovery-bot" >/dev/null 2>&1 || true
          git config user.email "actions@users.noreply.github.com" >/dev/null 2>&1 || true
          git add hermes-recovery-report.txt >/dev/null 2>&1 || true
          git commit -m "diag: update" >/dev/null 2>&1 || echo "nothing to commit"
          git push origin HEAD:fix/hermes-serve-recovery >/dev/null 2>&1 && echo "REPORT_PUSHED" || echo "REPORT_PUSH_FAIL"
          EOS
          chmod +x /usr/local/bin/report

      - name: Setup oci-cli
        timeout-minutes: 8
        run: |
          set -euo pipefail
          pip3 install --user --quiet oci-cli
          export PATH="$HOME/.local/bin:$PATH"
          export OCI_CLI_SUPPRESS_FILE_PERMISSIONS_WARNING=True
          mkdir -p ~/.oci
          cat > ~/.oci/config <<EOFCONF
          [DEFAULT]
          user=$OCI_USER
          tenancy=$OCI_TENANCY
          region=$OCI_REGION
          key_file=/tmp/oci_key.pem
          fingerprint=$OCI_FINGERPRINT
          EOFCONF
          printf '%s' "$OCI_KEY" > /tmp/oci_key.pem
          chmod 600 /tmp/oci_key.pem
          report "oci-cli installed"
          oci iam region-subscription list --tenancy-id "$OCI_TENANCY" --output json >/dev/null 2>&1 && report "OCI_AUTH_OK" || report "OCI_AUTH_FAIL"

      - name: Locate target instance
        timeout-minutes: 10
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          export OCI_CLI_SUPPRESS_FILE_PERMISSIONS_WARNING=True
          TARGET_REGION=$(printf '%s' "$OCI_TARGET" | tr '.' ' ' | awk '{print $4}')
          echo "TARGET_REGION=$TARGET_REGION"
          SAN() { sed -e 's/\[//g' -e 's/\]//g' -e 's/"//g' -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' -e 's/,$//'; }
          # Fast path: OCI_TARGET is the instance OCID
          INST_ID=""
          state=$(oci --raw-output compute instance get --instance-id "$OCI_TARGET" --region "$TARGET_REGION" --query 'data."lifecycle-state"' 2>/tmp/ig.err | SAN || true)
          if [ -n "$state" ]; then
            INST_ID="$OCI_TARGET"
            echo "FAST_PATH=instance-ocid state=$state"
          else
            report "fast path failed: $(head -c 200 /tmp/ig.err)"
            # Scan compartments (bounded)
            found=""
            {
              echo "$OCI_TENANCY"
              oci --raw-output iam compartment list -c "$OCI_TENANCY" --all --region "$TARGET_REGION" --query 'data[].id' 2>/dev/null | SAN
            } | while read -r cid; do
              [ -n "$cid" ] || continue
              oci --raw-output compute instance list -c "$cid" --region "$TARGET_REGION" --query 'data[].id' 2>/dev/null | SAN \
                | while read -r iid; do
                  [ -n "$iid" ] || continue
                  ip=$(oci --raw-output compute instance list-vnics --instance-id "$iid" --region "$TARGET_REGION" --query 'data[]."public-ip"' 2>/dev/null | SAN | head -1)
                  echo "scan ip=$ip inst=$iid" >> /tmp/recovery.log
                  if [ "$ip" = "$VPS_HOST" ]; then echo "$iid"; fi
                done
            done | head -1 > /tmp/inst.txt
            INST_ID=$(cat /tmp/inst.txt)
            state=""
            if [ -n "$INST_ID" ]; then
              state=$(oci --raw-output compute instance get --instance-id "$INST_ID" --region "$TARGET_REGION" --query 'data."lifecycle-state"' 2>/dev/null | SAN || true)
            fi
          fi
          if [ -z "$INST_ID" ]; then
            report "TARGET_NOT_FOUND region=$TARGET_REGION"
            exit 1
          fi
          # compartment of instance (for instance-agent calls)
          COMP_ID=$(oci --raw-output compute instance get --instance-id "$INST_ID" --region "$TARGET_REGION" --query 'data."compartment-id"' 2>/dev/null | SAN)
          echo "COMP_ID=$COMP_ID" >> "$GITHUB_ENV"
          echo "INST_ID=$INST_ID" >> "$GITHUB_ENV"
          report "TARGET_FOUND inst=$INST_ID state=$state comp=$COMP_ID"
          [ "$state" = "RUNNING" ] || { report "INSTANCE_NOT_RUNNING"; exit 1; }

      - name: Path A - Run Command plugin restart (no downtime)
        id: runcmd
        continue-on-error: true
        timeout-minutes: 10
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          export OCI_CLI_SUPPRESS_FILE_PERMISSIONS_WARNING=True
          TARGET_REGION=$(printf '%s' "$OCI_TARGET" | tr '.' ' ' | awk '{print $4}')
          echo '--- Run Command plugin status ---'
          oci instance-agent plugin list --instance-id "$INST_ID" --compartment-id "$COMP_ID" --region "$TARGET_REGION" --output json > /tmp/plugins.json 2>/tmp/plugins.err || report "plugin list err: $(head -c 200 /tmp/plugins.err)"
          python3 - <<'EOF' >> /tmp/recovery.log 2>&1 || true
          import json
          try:
              d = json.load(open('/tmp/plugins.json'))
          except Exception as e:
              print('PLUGIN_LIST_PARSE_FAIL', e); raise SystemExit(1)
          items = d if isinstance(d, list) else d.get('data', d)
          rc = [p for p in items if 'Run Command' in (p.get('name') or '')]
          for p in items:
              print('PLUGIN: %s %s' % (p.get('name'), p.get('status')))
          if not rc:
              print('RUN_COMMAND_PLUGIN_NOT_LISTED'); raise SystemExit(1)
          p = rc[0]
          if p.get('status') not in ('ENABLED', 'ACTIVE'):
              print('RUN_COMMAND_PLUGIN_NOT_ENABLED:' + str(p.get('status'))); raise SystemExit(1)
          print('RUN_COMMAND_PLUGIN_AVAILABLE')
          EOF
          grep -qE 'RUN_COMMAND_PLUGIN_AVAILABLE' /tmp/recovery.log || { report "PATH_A_ABORT plugin unavailable"; exit 1; }
          cat > /tmp/content.json <<'EOFJSON'
          {"sourceType":"TEXT","text":"sudo systemctl restart hermes-serve.service; sleep 5; systemctl is-active hermes-serve.service; curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:9119/ || true","runAsUser":"ubuntu"}
          EOFJSON
          cat > /tmp/target.json <<EOFJSON
          {"instanceId":"$INST_ID"}
          EOFJSON
          CMD_ID=$(oci --raw-output instance-agent command create \
            --compartment-id "$COMP_ID" \
            --content file:///tmp/content.json \
            --target file:///tmp/target.json \
            --timeout-in-seconds 120 --region "$TARGET_REGION" --query 'data.id') || {
              report "RUN_COMMAND_CREATE_FAILED"; exit 1; }
          report "CMD_ID=$CMD_ID"
          ST=UNKNOWN
          for i in $(seq 1 8); do
            sleep 15
            oci instance-agent command-execution list --command-id "$CMD_ID" --compartment-id "$COMP_ID" --region "$TARGET_REGION" --output json > /tmp/exec.json 2>/dev/null || true
            ST=$(python3 -c "
import json
d=json.load(open('/tmp/exec.json'))
items=d if isinstance(d,list) else d.get('data',d)
print(items[0].get('lifecycleState') if items else 'NONE')" 2>/dev/null || echo PARSE_FAIL)
            echo "attempt $i: cmdState=$ST" >> /tmp/recovery.log
            case "$ST" in
              SUCCEEDED|FAILED|TIMEDOUT|CANCELED) break;;
            esac
          done
          report "CMD_FINAL_STATE=$ST"
          [ "$ST" = "SUCCEEDED" ] || { report "RUN_COMMAND_NOT_SUCCEEDED"; exit 1; }
          echo '--- verify from runner ---'
          for i in $(seq 1 12); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -m 15 https://hermex.esggo.co/api/health || echo 000)
            echo "verify $i: HTTP $code" >> /tmp/recovery.log
            case "$code" in 502|503|000) sleep 15;; *) report "HERMES_API_RECOVERED"; exit 0;; esac
          done
          report "HERMES_API_STILL_DOWN"
          exit 1

      - name: Path B - hard RESET fallback
        if: steps.runcmd.outcome == 'failure'
        timeout-minutes: 18
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          export OCI_CLI_SUPPRESS_FILE_PERMISSIONS_WARNING=True
          TARGET_REGION=$(printf '%s' "$OCI_TARGET" | tr '.' ' ' | awk '{print $4}')
          SAN() { sed -e 's/\[//g' -e 's/\]//g' -e 's/"//g' -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' -e 's/,$//'; }
          report "RESET_BEGIN"
          oci --raw-output compute instance action --instance-id "$INST_ID" --region "$TARGET_REGION" --action RESET \
            --wait-for-state RUNNING --wait-interval-seconds 20 --max-wait-seconds 600 \
            --query 'data."lifecycle-state"' 2>/tmp/reset.err | SAN | sed 's/^/RESET_RESULT=/' >> /tmp/recovery.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" != "0" ]; then report "RESET_FAILED rc=$rc $(head -c 300 /tmp/reset.err)"; fi
          echo '--- waiting for Hermex API (up to 8 min) ---'
          for i in $(seq 1 32); do
            sleep 15
            code=$(curl -s -o /dev/null -w '%{http_code}' -m 15 https://hermex.esggo.co/api/health || echo 000)
            echo "verify $i: HTTP $code" >> /tmp/recovery.log
            case "$code" in 502|503|000) ;; *) report "HERMES_API_RECOVERED"; exit 0;; esac
          done
          report "HERMES_API_STILL_DOWN_AFTER_RESET"
          exit 1

      - name: Final report
        if: always()
        timeout-minutes: 4
        run: |
          set +e
          {
            echo "run_url=https://github.com/DingJun1028/Omniesggo/actions/runs/$GITHUB_RUN_ID"
            date -u
            cat /tmp/recovery.log 2>/dev/null
            echo "--- hermex api (final) ---"
            curl -s -o /dev/null -w '%{http_code}' -m 15 https://hermex.esggo.co/api/health || echo 000
            echo
          } > hermes-recovery-report.txt
          cat hermes-recovery-report.txt
          git config user.name "hermes-recovery-bot"
          git config user.email "actions@users.noreply.github.com"
          git add hermes-recovery-report.txt
          git commit -m "chore: hermes recovery diagnostic report" || echo "nothing to commit"
          git push origin HEAD:fix/hermes-serve-recovery || echo "push report failed"
