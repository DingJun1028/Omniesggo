name: hermes-recovery
# Emergency VPS recovery: SSH probe -> OCI state -> start/reset.
permissions:
  contents: write
on:
  push:
    branches: ['**']
    paths: ['.github/workflows/hermes-recovery.yml']
  workflow_dispatch: {}
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER || 'root' }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      OCI_USER: ${{ secrets.OCI_USER_OCID }}
      OCI_TENANCY: ${{ secrets.OCI_TENANCY_OCID }}
      OCI_REGION: ${{ secrets.OCI_REGION }}
      OCI_FINGERPRINT: ${{ secrets.OCI_API_FINGERPRINT }}
      OCI_KEY: ${{ secrets.OCI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Report helper
        run: |
          touch /tmp/recovery.log
          cat > /usr/local/bin/report <<'EOS'
          #!/bin/bash
          for l in "$@"; do echo "$l" >> /tmp/recovery.log; done
          {
            echo "report updated $(date -u)"
            cat /tmp/recovery.log
          } > vps-outage-report.txt
          git config user.name "hermes-recovery-bot" || true
          git config user.email "actions@users.noreply.github.com" || true
          git add vps-outage-report.txt || true
          git commit -m "diag: vps outage update" || true
          git push origin HEAD:fix/hermes-serve-recovery || true
          EOS
          chmod +x /usr/local/bin/report
          report "run started v9"
      - name: SSH probe
        id: sshprobe
        timeout-minutes: 3
        run: |
          set +e
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          timeout 40 ssh -i ~/.ssh/deploy_key -o BatchMode=yes \
            -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=25 -p 22 "$VPS_USER@$VPS_HOST" \
            'echo SSH_OK; uptime' > /tmp/sshprobe.out 2>&1
          if grep -q SSH_OK /tmp/sshprobe.out
          then
            echo "up=true" >> $GITHUB_OUTPUT
            report "SSH probe: UP"
          else
            echo "up=false" >> $GITHUB_OUTPUT
            report "SSH probe: DOWN"
          fi
      - name: Install OCI CLI
        if: steps.sshprobe.outputs.up != 'true'
        run: |
          python3 -m venv /tmp/ocivenv
          /tmp/ocivenv/bin/pip install -q --upgrade pip
          /tmp/ocivenv/bin/pip install -q oci-cli
          sudo ln -sf /tmp/ocivenv/bin/oci /usr/local/bin/oci
          oci --version
      - name: Configure OCI
        if: steps.sshprobe.outputs.up != 'true'
        run: |
          mkdir -p ~/.oci
          {
            echo "[DEFAULT]"
            echo "user=$OCI_USER"
            echo "tenancy=$OCI_TENANCY"
            echo "region=$OCI_REGION"
            echo "key_file=/tmp/oci_key.pem"
            echo "fingerprint=$OCI_FINGERPRINT"
          } > ~/.oci/config
          chmod 600 ~/.oci/config
          printf '%s' "$OCI_KEY" > /tmp/oci_key.pem
          chmod 600 /tmp/oci_key.pem
          KFP=$(openssl rsa -pubout -outform DER -in /tmp/oci_key.pem 2>/dev/null \
            | openssl md5 | awk '{print $2}' | tr -d ':')
          if [ "$KFP" = "$OCI_FINGERPRINT" ]; then
            report "key/fingerprint MATCH"
          else
            report "key/fingerprint MISMATCH"
          fi
          if [ -z "$OCI_USER" ] || [ -z "$OCI_TENANCY" ] || [ -z "$OCI_REGION" ] \
            || [ -z "$OCI_FINGERPRINT" ] || [ ! -s /tmp/oci_key.pem ]; then
            report "EMPTY_OR_MISSING_SECRET present"
          fi
      - name: Inspect and repair instance
        if: steps.sshprobe.outputs.up != 'true'
        timeout-minutes: 22
        run: |
          set +e
          export SUPPRESS_LABEL_WARNING=True
          report "SSH unreachable - querying OCI"
          oci iam compartment list --compartment-id "$OCI_TENANCY" --all \
            > /tmp/compartments.json 2>/tmp/oci-err1.txt
          COMPARTMENTS="$OCI_TENANCY"
          if [ -s /tmp/compartments.json ]; then
            for c in $(jq -r '.data[].id' /tmp/compartments.json 2>/dev/null); do
              COMPARTMENTS="$COMPARTMENTS $c"
            done
          else
            report "COMPART_ERR: $(cat /tmp/oci-err1.txt | tr '\n' ' ' | head -c 2000)"
          fi
          FOUND=""
          for c in $COMPARTMENTS; do
            oci compute instance list --compartment-id "$c" --all \
              > /tmp/inst.json 2>/tmp/oci-err2.txt
            if [ -s /tmp/inst.json ]; then
              N=$(jq '.data | length' /tmp/inst.json 2>/dev/null)
              report "compartment $c: $N instances"
              FOUND=yes
              jq -c '.data[]' /tmp/inst.json | while read -r row; do
                iid=$(echo "$row" | jq -r '.id')
                st=$(echo "$row" | jq -r '."lifecycle-state"')
                nm=$(echo "$row" | jq -r '."display-name"')
                report "instance name=$nm state=$st"
                if [ "$st" = "STOPPED" ]; then
                  report "issuing START"
                  oci compute instance action --instance-id "$iid" \
                    --action START --wait-for-state RUNNING \
                    --max-wait-seconds 480 >/dev/null 2>&1
                  report "START issued"
                elif [ "$st" = "RUNNING" ]; then
                  report "RUNNING but unreachable, re-probe 45s then RESET"
                  sleep 45
                  timeout 30 ssh -i ~/.ssh/deploy_key -o BatchMode=yes \
                    -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
                    -o ConnectTimeout=20 -p 22 "$VPS_USER@$VPS_HOST" \
                    'echo SSH_OK' > /tmp/re.out 2>&1
                  if grep -q SSH_OK /tmp/re.out; then
                    report "SSH recovered by itself"
                  else
                    report "issuing RESET"
                    oci compute instance action --instance-id "$iid" \
                      --action RESET --wait-for-state RUNNING \
                      --max-wait-seconds 480 >/dev/null 2>&1
                    report "RESET issued, waiting 120s"
                    sleep 120
                  fi
                fi
              done
            else
              report "INST_ERR: $(cat /tmp/oci-err2.txt | tr '\n' ' ' | head -c 2000)"
            fi
          done
          [ -z "$FOUND" ] && report "NO_INSTANCES_FOUND check tenancy/secrets"
          report "post-repair SSH probe"
          timeout 40 ssh -i ~/.ssh/deploy_key -o BatchMode=yes \
            -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=25 -p 22 "$VPS_USER@$VPS_HOST" \
            'echo SSH_OK; uptime' > /tmp/post.out 2>&1
          if grep -q SSH_OK /tmp/post.out; then
            report "POST_RECOVERY SSH_OK"
            cat /tmp/post.out | while IFS= read -r l; do report "R| $l"; done
          else
            report "POST_RECOVERY SSH_STILL_DOWN"
          fi
          rm -f ~/.ssh/deploy_key
          exit 0
      - name: Final report
        if: always()
        run: |
          report "run finished $(date -u)"
