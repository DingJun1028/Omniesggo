name: hermes-recovery
# Emergency: VPS unreachable (all sites down). SSH probe -> OCI state -> start/reset as needed.
permissions:
  contents: write
on:
  push:
    branches: ['**']
    paths: ['.github/workflows/hermes-recovery.yml']
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER || 'root' }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      OCI_USER: ${{ secrets.OCI_USER_OCID }}
      OCI_TENANCY: ${{ secrets.OCI_TENANCY_OCID }}
      OCI_REGION: ${{ secrets.OCI_REGION }}
      OCI_FINGERPRINT: ${{ secrets.OCI_API_FINGERPRINT }}
      OCI_KEY: ${{ secrets.OCI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Report helper
        run: |
          touch /tmp/recovery.log
          cat > /usr/local/bin/report <<'EOS'
          #!/bin/bash
          for l in "$@"; do echo "$l" >> /tmp/recovery.log; done
          {
            echo "report updated $(date -u)"
            cat /tmp/recovery.log
          } > vps-outage-report.txt
          git config user.name "hermes-recovery-bot" || true
          git config user.email "actions@users.noreply.github.com" || true
          git add vps-outage-report.txt || true
          git commit -m "diag: vps outage update" || true
          git push origin HEAD:fix/hermes-serve-recovery || true
          EOS
          chmod +x /usr/local/bin/report
          report "OUTAGE_RECOVERY run started v2"
      - name: SSH probe
        id: sshprobe
        timeout-minutes: 3
        run: |
          set +e
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          timeout 40 ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=25 -p 22 "$VPS_USER@$VPS_HOST" 'echo SSH_OK; uptime' 2>&1 | tee /tmp/sshprobe.out
          if grep -q SSH_OK /tmp/sshprobe.out; then echo "up=true" >> $GITHUB_OUTPUT; report "SSH probe: UP"; else echo "up=false" >> $GITHUB_OUTPUT; report "SSH probe: DOWN"; fi
      - name: Install OCI CLI
        if: steps.sshprobe.outputs.up != 'true'
        run: |
          python3 -m venv /tmp/ocivenv
          /tmp/ocivenv/bin/pip install -q --upgrade pip
          /tmp/ocivenv/bin/pip install -q oci-cli
          sudo ln -sf /tmp/ocivenv/bin/oci /usr/local/bin/oci
          oci --version
      - name: Configure OCI
        if: steps.sshprobe.outputs.up != 'true'
        run: |
          mkdir -p ~/.oci
          cat > ~/.oci/config <<'EOFCONF'
          [DEFAULT]
          user=OCI_USER_VALUE
          tenancy=OCI_TENANCY_VALUE
          region=OCI_REGION_VALUE
          key_file=/tmp/oci_key.pem
          fingerprint=OCI_FINGERPRINT_VALUE
          EOFCONF
          sed -i "s|OCI_USER_VALUE|$OCI_USER|;s|OCI_TENANCY_VALUE|$OCI_TENANCY|;s|OCI_REGION_VALUE|$OCI_REGION|;s|OCI_FINGERPRINT_VALUE|$OCI_FINGERPRINT|" ~/.oci/config
          chmod 600 ~/.oci/config
          printf '%s' "$OCI_KEY" > /tmp/oci_key.pem
          chmod 600 /tmp/oci_key.pem
      - name: Inspect and repair instance
        if: steps.sshprobe.outputs.up != 'true'
        timeout-minutes: 22
        run: |
          set +e
          report "SSH unreachable - querying OCI"
          INSTANCES=$(oci compute instance list --compartment-id "$OCI_TENANCY" --all --query 'data[].{id:id,state:"lifecycle-state"}' --output json 2>/dev/null)
          if [ -z "$INSTANCES" ] || [ "$INSTANCES" = "[]" ]; then
            for c in $(oci iam compartment list --compartment-id "$OCI_TENANCY" --all --query 'data[?"lifecycle-state"==\'ACTIVE\'].id' --raw-output 2>/dev/null); do
              INSTANCES=$(oci compute instance list --compartment-id "$c" --all --query 'data[].{id:id,state:"lifecycle-state"}' --output json 2>/dev/null)
              [ -n "$INSTANCES" ] && [ "$INSTANCES" != "[]" ] && break
            done
          fi
          echo "$INSTANCES" | jq -c '.[]' | while read -r row; do
            iid=$(echo "$row" | jq -r '.id')
            st=$(echo "$row" | jq -r '.state')
            report "instance state=$st"
            if [ "$st" = "STOPPED" ]; then
              report "starting stopped instance"
              oci compute instance action --instance-id "$iid" --action START --wait-for-state RUNNING --max-wait-seconds 480 >/dev/null 2>&1
              report "START issued"
            elif [ "$st" = "RUNNING" ]; then
              report "instance RUNNING but unreachable - waiting 45s then re-probing"
              sleep 45
              timeout 30 ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=20 -p 22 "$VPS_USER@$VPS_HOST" 'echo SSH_OK' > /tmp/re.out 2>&1
              if grep -q SSH_OK /tmp/re.out; then
                report "SSH recovered by itself"
              else
                report "still unreachable - issuing RESET"
                oci compute instance action --instance-id "$iid" --action RESET --wait-for-state RUNNING --max-wait-seconds 480 >/dev/null 2>&1
                report "RESET issued, waiting 120s"
                sleep 120
              fi
            fi
          done
          report "post-repair SSH probe"
          timeout 40 ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=25 -p 22 "$VPS_USER@$VPS_HOST" 'echo SSH_OK; uptime' > /tmp/post.out 2>&1
          if grep -q SSH_OK /tmp/post.out; then report "POST_RECOVERY SSH_OK"; cat /tmp/post.out | while IFS= read -r l; do report "R| $l"; done; else report "POST_RECOVERY SSH_STILL_DOWN"; fi
          rm -f ~/.ssh/deploy_key
      - name: Final report
        if: always()
        run: |
          report "run finished $(date -u)"
