name: hermes-recovery
# Emergency: VPS unreachable (all sites down). SSH probe -> OCI state -> start/reset as needed.
permissions:
  contents: write
on:
  push:
    branches: ['**']
    paths: ['.github/workflows/hermes-recovery.yml']
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER || 'root' }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      OCI_USER: ${{ secrets.OCI_USER_OCID }}
      OCI_TENANCY: ${{ secrets.OCI_TENANCY_OCID }}
      OCI_REGION: ${{ secrets.OCI_REGION }}
      OCI_FINGERPRINT: ${{ secrets.OCI_API_FINGERPRINT }}
      OCI_KEY: ${{ secrets.OCI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Report helper
        run: |
          touch /tmp/recovery.log
          cat > /usr/local/bin/report <<'EOS'
          #!/bin/bash
          for l in "$@"; do echo "$l" >> /tmp/recovery.log; done
          {
            echo "report updated $(date -u)"
            cat /tmp/recovery.log
          } > vps-outage-report.txt
          git config user.name "hermes-recovery-bot" || true
          git config user.email "actions@users.noreply.github.com" || true
          git add vps-outage-report.txt || true
          git commit -m "diag: vps outage update" || true
          git push origin HEAD:fix/hermes-serve-recovery || true
          EOS
          chmod +x /usr/local/bin/report
          report "OUTAGE_RECOVERY run started"
      - name: SSH probe
        id: sshprobe
        timeout-minutes: 3
        run: |
          set +e
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          timeout 40 ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=25 -p 22 "$VPS_USER@$VPS_HOST" 'echo SSH_OK; uptime; free -m | head -2; systemctl is-active cloudflared nginx hermes-serve hermes-dashboard 2>&1' 2>&1 | tee /tmp/sshprobe.out
          if grep -q SSH_OK /tmp/sshprobe.out; then echo "up=true" >> $GITHUB_OUTPUT; else echo "up=false" >> $GITHUB_OUTPUT; fi
      - name: Install OCI CLI
        if: steps.sshprobe.outputs.up != 'true'
        run: |
          python3 -m venv /tmp/ocivenv
          /tmp/ocivenv/bin/pip install -q --upgrade pip
          /tmp/ocivenv/bin/pip install -q oci-cli
          sudo ln -sf /tmp/ocivenv/bin/oci /usr/local/bin/oci
          oci --version
      - name: Configure OCI
        if: steps.sshprobe.outputs.up != 'true'
        run: |
          mkdir -p ~/.oci
          cat > ~/.oci/config <<EOFCONF
          [DEFAULT]
          user=$OCI_USER
          tenancy=$OCI_TENANCY
          region=$OCI_REGION
          key_file=/tmp/oci_key.pem
          fingerprint=$OCI_FINGERPRINT
          EOFCONF
          printf '%s' "$OCI_KEY" > /tmp/oci_key.pem
          chmod 600 /tmp/oci_key.pem
      - name: Inspect and repair instance
        if: steps.sshprobe.outputs.up != 'true'
        timeout-minutes: 22
        run: |
          set +e
          report "SSH unreachable - querying OCI"
          COMPARTMENTS=$(jq -n --arg t "$OCI_TENANCY" '[$t]')
          oci iam compartment list --compartment-id "$OCI_TENANCY" --all > /tmp/compartments.json 2>/tmp/oci-err1.txt
          if [ -s /tmp/compartments.json ]; then
            for c in $(jq -r '.data[] | select(."lifecycle-state"=="ACTIVE") | .id' /tmp/compartments.json 2>/dev/null); do
              COMPARTMENTS=$(echo "$COMPARTMENTS" | jq --arg c "$c" '. + [$c]')
            done
          else
            report "compartment list error: $(head -c 400 /tmp/oci-err1.txt | tr '\n' ' ')"
          fi
          report "compartments to scan: $(echo "$COMPARTMENTS" | jq '. | length')"
          FOUND=""
          for c in $(echo "$COMPARTMENTS" | jq -r '.[]'); do
            oci compute instance list --compartment-id "$c" --all > /tmp/inst.json 2>/tmp/oci-err2.txt
            if [ -s /tmp/inst.json ]; then
  
            N=$(jq '.data | length' /tmp/inst.json 2>/dev/null)
              report "compartment instances: $N"
              jq -c '.data[]' /tmp/inst.json | while read -r row; do
                iid=$(echo "$row" | jq -r '.id')
                st=$(echo "$row" | jq -r '."lifecycle-state"')
                nm=$(echo "$row" | jq -r '."display-name"')
                report "instance: name=$nm state=$st"
                if [ "$st" = "STOPPED" ]; then
                  report "starting stopped instance"
                  oci compute instance action --instance-id "$iid" --action START --wait-for-state RUNNING --max-wait-seconds 480 >/dev/null 2>&1
                  report "START issued"
                elif [ "$st" = "RUNNING" ]; then
                  report "RUNNING but unreachable - re-probe in 45s then RESET if still down"
                  sleep 45
                  timeout 30 ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=20 -p 22 "$VPS_USER@$VPS_HOST" 'echo SSH_OK' > /tmp/re.out 2>&1
                  if grep -q SSH_OK /tmp/re.out; then
                    report "SSH recovered by itself"
                  else
                    report "still unreachable - issuing RESET"
                    oci compute instance action --instance-id "$iid" --action RESET --wait-for-state RUNNING --max-wait-seconds 480 >/dev/null 2>&1
                    report "RESET issued, waiting 120s"
                    sleep 120
                  fi
                fi
                FOUND=yes
              done
            else
              report "instance list error: $(head -c 300 /tmp/oci-err2.txt | tr '\n' ' ')"
            fi
          done
          [ -z "$FOUND" ] && report "NO_INSTANCES_FOUND check tenancy/secrets"
          report "post-repair SSH probe"
          timeout 40 ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=25 -p 22 "$VPS_USER@$VPS_HOST" 'echo SSH_OK; uptime' > /tmp/post.out 2>&1
          if grep -q SSH_OK /tmp/post.out; then report "POST_RECOVERY SSH_OK"; cat /tmp/post.out | while IFS= read -r l; do report "R| $l"; done; else report "POST_RECOVERY SSH_STILL_DOWN"; fi
          rm -f ~/.ssh/deploy_key
          exit 0
      - name: If SSH was up - collect diagnostics
        if: steps.sshprobe.outputs.up == 'true'
        run: |
          set +e
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          timeout 120 ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -p 22 "$VPS_USER@$VPS_HOST" 'sudo bash -s' <<'VPS' > /tmp/diag.out 2>&1
            echo "uptime: $(uptime)"
            echo "last: $(last reboot | head -3)"
            free -m | head -2
            systemctl --failed --no-legend
            journalctl -p err -n 15 --no-pager | tail -15
            curl -s -m 8 -o /dev/null -w 'local hermex 8795: %{http_code}' http://127.0.0.1:8795/_uptime
            echo
            curl -s -m 8 -o /dev/null -w 'providers via edge: %{http_code}' https://hermex.esggo.co/api/auth/providers
            echo
          VPS
          n=0
          while IFS= read -r l; do n=$((n+1)); [ $n -le 60 ] && report "R| $l"; done < /tmp/diag.out || true
          rm -f ~/.ssh/deploy_key
      - name: Final report
        if: always()
        run: |
          set +e
          {
            echo "run_url=https://github.com/DingJun1028/Omniesggo/actions/runs/$GITHUB_RUN_ID"
            date -u
            cat /tmp/recovery.log
          } > vps-outage-report.txt
          git config user.name "hermes-recovery-bot"
          git config user.email "actions@users.noreply.github.com"
          git add vps-outage-report.txt
          git commit -m "chore: vps outage report"
          git push origin HEAD:fix/hermes-serve-recovery
