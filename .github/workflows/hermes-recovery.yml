name: hermes-recovery
permissions:
  contents: write
on:
  workflow_dispatch:
  push:
    branches: ['**']
    paths: ['.github/workflows/hermes-recovery.yml']
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Smoke
        run: |
          echo "SMOKE_OK $(date -u)"
