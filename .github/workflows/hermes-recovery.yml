name: hermes-recovery
# One-off recovery workflow v10: SSH live diagnostic of hermes-serve stability.
permissions:
  contents: write
on:
  workflow_dispatch:
  push:
    branches: ['**']
    paths: ['.github/workflows/hermes-recovery.yml']
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER || 'root' }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Report helper
        run: |
          touch /tmp/recovery.log
          cat > /usr/local/bin/report <<'EOS'
          #!/bin/bash
          for l in "$@"; do echo "$l" >> /tmp/recovery.log; done
          {
            echo "report updated $(date -u)"
            cat /tmp/recovery.log
          } > hermes-v10-report.txt
          git config user.name "hermes-recovery-bot" || true
          git config user.email "actions@users.noreply.github.com" || true
          git add hermes-v10-report.txt || true
          git commit -m "diag: update v10" || true
          git push origin HEAD:fix/hermes-serve-recovery || true
          EOS
          chmod +x /usr/local/bin/report
          report "V10 run started"
      - name: SSH diagnostic
        timeout-minutes: 10
        run: |
          set -uo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          timeout 150 ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=20 -p 22 "$VPS_USER@$VPS_HOST" 'sudo bash -s' <<'VPS' > /tmp/diag.out 2>&1 || true
            echo '---STATUS---'
            systemctl status hermes-serve --no-pager -l 2>&1 | head -25 || true
            echo '---ISACTIVE---'
            systemctl is-active hermes-serve 2>&1 || true
            echo '---NREST---'
            systemctl show hermes-serve -p NRestarts -p ExecMainStartTimestamp -p SubState 2>&1 || true
            echo '---JOURNAL60---'
            journalctl -u hermes-serve -n 60 --no-pager 2>&1 | cut -c1-300 || true
            echo '---PROC---'
            ps aux | grep -E 'hermes|9119' | grep -v grep || true
            echo '---LOCAL---'
            curl -s -o /dev/null -w 'root=%{http_code}\n' -m 10 http://127.0.0.1:9119/ || true
            curl -s -o /dev/null -w 'health=%{http_code}\n' -m 10 http://127.0.0.1:9119/health || true
            echo '---MEM---'
            free -m | head -3 || true
            echo '---DONE---'
          VPS
          n=0
          while IFS= read -r l; do n=$((n+1)); [ $n -le 90 ] && echo "R|$l" >> /tmp/recovery.log; done < /tmp/diag.out || true
          report "DIAG_DONE lines=$n"
          rm -f ~/.ssh/deploy_key
      - name: Final report
        if: always()
        timeout-minutes: 4
        run: |
          set +e
          {
            echo "run_url=https://github.com/DingJun1028/Omniesggo/actions/runs/$GITHUB_RUN_ID"
            date -u
            cat /tmp/recovery.log
            echo "hermex api final:"
            curl -s -o /dev/null -w '%{http_code}' -m 15 https://hermex.esggo.co/api/health
            echo
          } > hermes-v10-report.txt
          git config user.name "hermes-recovery-bot"
          git config user.email "actions@users.noreply.github.com"
          git add hermes-v10-report.txt
          git commit -m "chore: hermes v10 diagnostic report"
          git push origin HEAD:fix/hermes-serve-recovery