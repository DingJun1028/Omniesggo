name: One-shot branch sync (my-worker types_node)

on:
  push:
    branches: [dependabot/npm_and_yarn/my-worker/types_node-26.6.6]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: dependabot/npm_and_yarn/my-worker/types_node-26.6.6

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Merge main (lockfile conflicts resolved by regeneration)
        run: |
          set -euo pipefail
          git fetch origin main
          if git merge FETCH_HEAD --no-edit; then
            echo "MERGED=clean" >> "$GITHUB_ENV"
          else
            git checkout --theirs pnpm-lock.yaml || true
            git add pnpm-lock.yaml || true
            git checkout --theirs uv.lock || true
            git add uv.lock || true
            UNRESOLVED="$(git diff --name-only --diff-filter=U | grep -v -E '^(pnpm-lock\.yaml|uv\.lock)$' || true)"
            if [ -n "$UNRESOLVED" ]; then
              echo "Unresolvable conflicts: $UNRESOLVED"
              exit 1
            fi
            echo "MERGED=conflict" >> "$GITHUB_ENV"
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Regenerate root lockfile
        run: pnpm install --lockfile-only --no-frozen-lockfile

      - name: Commit merge resolution
        run: |
          git add pnpm-lock.yaml uv.lock 2>/dev/null || git add pnpm-lock.yaml
          if ! git diff --cached --quiet; then
            git commit -m "chore: sync branch with main (regenerate pnpm-lock.yaml)"
          else
            if [ -f .git/MERGE_HEAD ]; then
              git commit --no-edit
            fi
          fi

      - name: Remove one-shot workflow and push
        run: |
          git rm -f .github/workflows/branch-sync-163.yml || true
          if ! git diff --cached --quiet; then
            git commit -m "chore: remove one-shot branch sync workflow"
          fi
          git push origin dependabot/npm_and_yarn/my-worker/types_node-26.6.6
