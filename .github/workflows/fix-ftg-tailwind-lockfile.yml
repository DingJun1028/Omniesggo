name: fix-ftg-tailwind-lockfile

on:
  push:
    branches: [fix/ftg-tailwind-3]
    paths:
      - '.github/workflows/fix-ftg-tailwind-lockfile.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Downgrade tailwindcss to 3.4.x (lockfile only)
        run: pnpm --filter ./apps/ftg-tours-website add -D "tailwindcss@^3.4.19" --lockfile-only
      - name: Show diff
        run: git diff --stat
      - name: Commit lockfile and package.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/ftg-tours-website/package.json pnpm-lock.yaml
          git commit -m "fix(ftg-tours-website): downgrade tailwindcss to ^3.4.19 and sync pnpm-lock.yaml"
          git push
