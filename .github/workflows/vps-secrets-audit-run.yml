name: vps-secrets-audit-run

on:
  push:
    branches: [probe/vps-secrets-audit-20261031]
    paths: [".github/workflows/vps-secrets-audit-run.yml"]

permissions:
  contents: write
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
      OCI_USER: ${{ secrets.OCI_USER_OCID }}
      OCI_TENANCY: ${{ secrets.OCI_TENANCY_OCID }}
      OCI_REGION: ${{ secrets.OCI_REGION }}
      OCI_FINGERPRINT: ${{ secrets.OCI_API_FINGERPRINT }}
      OCI_KEY: ${{ secrets.OCI_API_KEY }}
      OCI_TARGET: ${{ secrets.OCI_TARGET_RESOURCE_ID }}
      R: /tmp/audit-result.md
    steps:
      - uses: actions/checkout@v4

      - name: audit
        run: |
          set -uo pipefail
          say() { printf '%s\n' "$*" >> "$R"; printf '%s\n' "$*" >> "$GITHUB_STEP_SUMMARY"; printf '%s\n' "$*"; }
          say "## vps-secrets-audit v2 $(date -u +%FT%TZ)"
          say "### Key identity"
          mkdir -p ~/.ssh
          say "env GITHUB_STEP_SUMMARY=${GITHUB_STEP_SUMMARY:-UNSET}"
          for var in SSH_PRIVATE_KEY VPS_SSH_KEY VPS_USER VPS_HOST OCI_USER OCI_TENANCY OCI_REGION OCI_FINGERPRINT OCI_KEY OCI_TARGET; do
            val="${!var}"
            if [ -n "$val" ]; then say "- $var: SET (${#val} chars)"; else say "- $var: EMPTY"; fi
          done
          KNOWN_INSTANCE_PUB_B64=''
          for var in SSH_PRIVATE_KEY VPS_SSH_KEY; do
            val="${!var}"
            if [ -z "$val" ]; then say "- $var: EMPTY, skipping"; continue; fi
            f=~/.ssh/$var
            printf '%s\n' "$val" > "$f"
            chmod 600 "$f"
            pub=$(ssh-keygen -y -f "$f" 2>/dev/null || true)
            if [ -z "$pub" ]; then say "- $var: PRESENT but unparsable as private key"; continue; fi
            b64=$(printf '%s' "$pub" | awk '{print $2}')
            if [ "$b64" = "$KNOWN_INSTANCE_PUB_B64" ]; then
              say "- $var: VALID, matches instance-2026-07-21 key"
            else
              say "- $var: VALID, different key (not instance-2026-07-21)"
            fi
          done

      - name: vps-host-probe
        run: |
          set -uo pipefail
          say() { printf '%s\n' "$*" >> "$R"; printf '%s\n' "$*" >> "$GITHUB_STEP_SUMMARY"; printf '%s\n' "$*"; }
          say "### VPS_HOST"
          if [ -z "$VPS_HOST" ]; then say "- VPS_HOST: EMPTY, skipping"; exit 0; fi
          getent ahosts "$VPS_HOST" >/dev/null 2>&1 && say "- resolves: YES" || say "- resolves: NO"
          if timeout 15 bash -c "exec 3<>/dev/tcp/$VPS_HOST/22 && head -c 40 <&3" > /tmp/banner 2>/dev/null; then
            say "- port22 banner: YES ($(tr -d '\r\n' < /tmp/banner | cut -c1-30))"
          else
            say "- port22 banner: NO"
          fi
          scan=$(timeout 20 ssh-keyscan -t ed25519 -p "$SSH_PORT" "$VPS_HOST" 2>/dev/null | awk '{print $3}' | head -1)
          if [ -n "$scan" ]; then
            case "$scan" in
              "AAAAC3NzaC1lZDI1NTE5AAAAIPYr6ZbzG0O7D7ZFOKUfIuS3RP3BkdXNJ34RkUrrs71o")
                say "- hostkey: matches PIN-A (OpenSSH 9.6p1 rebuilt VPS)" ;;
              "AAAAC3NzaC1lZDI1NTE5AAAAIE7XY1yvUryldWlybkhFZM3klqg7UrQRfT69wMLDPr2M")
                say "- hostkey: matches PIN-B (OpenSSH 9.9 instance-2026-07-21)" ;;
              *)
                say "- hostkey: UNKNOWN (neither pin)" ;;
            esac
          else
            say "- hostkey: scan failed"
          fi

      - name: ssh-matrix
        run: |
          set -uo pipefail
          say() { printf '%s\n' "$*" >> "$R"; printf '%s\n' "$*" >> "$GITHUB_STEP_SUMMARY"; printf '%s\n' "$*"; }
          say "### SSH auth (VPS_HOST)"
          [ -n "$VPS_USER" ] || VPS_USER=root
          for var in SSH_PRIVATE_KEY VPS_SSH_KEY; do
            f=~/.ssh/$var
            [ -f "$f" ] || { say "- $var: (no key file)"; continue; }
            if timeout 30 ssh -i "$f" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=15 -o BatchMode=yes -p "$SSH_PORT" "${VPS_USER}@${VPS_HOST}" 'true' 2>/dev/null; then
              say "- $var as ${VPS_USER}@VPS_HOST: SSH OK"
            else
              say "- $var as ${VPS_USER}@VPS_HOST: SSH FAIL"
            fi
          done

      - name: sites
        run: |
          set -uo pipefail
          say() { printf '%s\n' "$*" >> "$R"; printf '%s\n' "$*" >> "$GITHUB_STEP_SUMMARY"; printf '%s\n' "$*"; }
          say "### Sites"
          for u in https://ftgtours.esggo.co/ https://esggo.co/ https://hermex.esggo.co/ https://omniagent.esggo.co/; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$u" || echo ERR)
            say "- $u -> $code"
          done

      - name: oci-inventory
        run: |
          set +e
          say() { printf '%s\n' "$*" >> "$R"; printf '%s\n' "$*" >> "$GITHUB_STEP_SUMMARY"; printf '%s\n' "$*"; }
          say "### OCI inventory"
          [ -n "$OCI_USER" ] || { say "- OCI secrets: EMPTY, skipping"; exit 0; }
          pip3 install --user --quiet oci-cli >/dev/null 2>&1
          export PATH="$HOME/.local/bin:$PATH"
          export OCI_CLI_SUPPRESS_FILE_PERMISSIONS_WARNING=True
          export SUPPRESS_LABEL_WARNING=True
          mkdir -p ~/.oci
          cat > ~/.oci/config <<EOFCONF
          [DEFAULT]
          user=$OCI_USER
          tenancy=$OCI_TENANCY
          region=$OCI_REGION
          key_file=/tmp/oci_key.pem
          fingerprint=$OCI_FINGERPRINT
          EOFCONF
          printf '%s' "$OCI_KEY" > /tmp/oci_key.pem
          chmod 600 /tmp/oci_key.pem
          if ! oci iam compartment list -c "$OCI_TENANCY" --all --output json >/dev/null 2>&1; then
            say "- OCI creds: INVALID or expired"
            exit 0
          fi
          say "- OCI creds: VALID"
          TRG=$(printf '%s' "$OCI_TARGET" | tr '.' ' ' | awk '{print $4}')
          {
            echo "$OCI_REGION"
            [ -n "$TRG" ] && echo "$TRG"
            oci iam region-subscription list --tenancy-id "$OCI_TENANCY" --output json 2>/dev/null | jq -r '.data[]."region-name"' 2>/dev/null
          } | sort -u | grep -v '^$' > /tmp/regs
          if [ -n "$TRG" ]; then
            tstate=$(oci --raw-output compute instance get --instance-id "$OCI_TARGET" --region "$TRG" --query 'data."lifecycle-state"' 2>/dev/null)
            [ -n "$tstate" ] && say "- OCI_TARGET resolves as INSTANCE ($tstate)"
            bstate=$(oci --raw-output bastion bastion get --bastion-id "$OCI_TARGET" --region "$TRG" --query 'data."lifecycle-state"' 2>/dev/null)
            [ -n "$bstate" ] && say "- OCI_TARGET resolves as BASTION ($bstate)"
          fi
          idx=0
          while read -r REG; do
            [ -n "$REG" ] || continue
            {
              echo "$OCI_TENANCY"
              oci iam compartment list -c "$OCI_TENANCY" --all --region "$REG" --output json 2>/dev/null | jq -r '.data[].id' 2>/dev/null
            } > /tmp/comps
            while read -r CID; do
              [ -n "$CID" ] || continue
              for IID in $(oci compute instance list -c "$CID" --region "$REG" --output json 2>/dev/null | jq -r '.data[].id' 2>/dev/null); do
                state=$(oci --raw-output compute instance get --instance-id "$IID" --region "$REG" --query 'data."lifecycle-state"' 2>/dev/null)
                ip=$(oci --raw-output compute instance list-vnics --instance-id "$IID" --region "$REG" --query 'data[0]."public-ip"' 2>/dev/null)
                [ -n "$ip" ] || continue
                idx=$((idx+1))
                if [ "$ip" = "$VPS_HOST" ]; then match=YES; else match=NO; fi
                say "- instance[$idx] region=$REG state=$state public_ip_matches_VPS_HOST=$match"
                for var in SSH_PRIVATE_KEY VPS_SSH_KEY; do
                  f=~/.ssh/$var
                  [ -f "$f" ] || continue
                  if timeout 30 ssh -i "$f" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=15 -o BatchMode=yes "${VPS_USER:-ubuntu}@${ip}" 'true' 2>/dev/null; then
                    say "  - $var as ubuntu@instance[$idx]: SSH OK"
                  else
                    say "  - $var as ubuntu@instance[$idx]: SSH FAIL"
                  fi
                done
                plg=$(oci instance-agent plugin list --compartment-id "$CID" --instance-id "$IID" --region "$REG" --output json 2>/dev/null | jq -r '.data[].name' 2>/dev/null | tr '\n' ' ')
                if printf '%s' "$plg" | grep -qi 'run.command\|runcommand'; then
                  say "  - instance[$idx] run-command plugin: ENABLED"
                elif [ -n "$plg" ]; then
                  say "  - instance[$idx] run-command plugin: not in plugin list"
                else
                  say "  - instance[$idx] run-command plugin: query failed"
                fi
              done
            done < /tmp/comps
          done < /tmp/regs
          say "- total instances with public IP: $idx"

      - name: publish
        run: |
          set +e
          echo "--- results file ---"; cat "$R" || echo "NO RESULTS FILE"
          cp "$R" audit-result.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit-result.md
          git commit -m "audit results snapshot v2" || true
          git push || echo "git push failed"
          BODY=$(jq -Rs '{body: .}' < "$R")
          curl -s -X POST \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/90/comments" \
            -d "$BODY" | head -c 200
          echo
