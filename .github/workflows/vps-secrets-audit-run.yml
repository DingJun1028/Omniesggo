name: vps-secrets-audit-run

on:
  push:
    branches: [probe/vps-secrets-audit-20261031]
    paths: [".github/workflows/vps-secrets-audit-run.yml"]

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
      OCI_USER: ${{ secrets.OCI_USER_OCID }}
      OCI_TENANCY: ${{ secrets.OCI_TENANCY_OCID }}
      OCI_REGION: ${{ secrets.OCI_REGION }}
      OCI_FINGERPRINT: ${{ secrets.OCI_API_FINGERPRINT }}
      OCI_KEY: ${{ secrets.OCI_API_KEY }}
      OCI_TARGET: ${{ secrets.OCI_TARGET_RESOURCE_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Key identity audit
        run: |
          set -uo pipefail
          S="$GITHUB_STEP_SUMMARY"
          echo "## vps-secrets-audit $(date -u +%FT%TZ)" >> "$S"
          echo "### Key identity" >> "$S"
          mkdir -p ~/.ssh
          KNOWN_INSTANCE_PUB_B64=''
          for var in SSH_PRIVATE_KEY VPS_SSH_KEY; do
            val="${!var}"
            if [ -z "$val" ]; then echo "- $var: EMPTY" >> "$S"; continue; fi
            f=~/.ssh/$var
            printf '%s\n' "$val" > "$f"
            chmod 600 "$f"
            pub=$(ssh-keygen -y -f "$f" 2>/dev/null || true)
            if [ -z "$pub" ]; then echo "- $var: PRESENT but unparsable as private key" >> "$S"; continue; fi
            b64=$(printf '%s' "$pub" | awk '{print $2}')
            if [ "$b64" = "$KNOWN_INSTANCE_PUB_B64" ]; then
              echo "- $var: VALID, matches instance-2026-07-21 key" >> "$S"
            else
              echo "- $var: VALID, different key (not instance-2026-07-21)" >> "$S"
            fi
          done

      - name: VPS_HOST reachability and host key identity
        run: |
          set -uo pipefail
          S="$GITHUB_STEP_SUMMARY"
          echo "### VPS_HOST" >> "$S"
          if [ -z "$VPS_HOST" ]; then echo "- VPS_HOST: EMPTY" >> "$S"; exit 0; fi
          getent ahosts "$VPS_HOST" >/dev/null 2>&1 && echo "- resolves: YES" >> "$S" || echo "- resolves: NO" >> "$S"
          if timeout 15 bash -c "exec 3<>/dev/tcp/$VPS_HOST/22 && head -c 40 <&3" > /tmp/banner 2>/dev/null; then
            echo "- port22 banner: YES ($(tr -d '\r\n' < /tmp/banner | cut -c1-30))" >> "$S"
          else
            echo "- port22 banner: NO" >> "$S"
          fi
          scan=$(timeout 20 ssh-keyscan -t ed25519 -p "$SSH_PORT" "$VPS_HOST" 2>/dev/null | awk '{print $3}' | head -1)
          if [ -n "$scan" ]; then
            case "$scan" in
              "AAAAC3NzaC1lZDI1NTE5AAAAIPYr6ZbzG0O7D7ZFOKUfIuS3RP3BkdXNJ34RkUrrs71o")
                echo "- hostkey: matches PIN-A (OpenSSH 9.6p1 rebuilt VPS)" >> "$S" ;;
              "AAAAC3NzaC1lZDI1NTE5AAAAIE7XY1yvUryldWlybkhFZM3klqg7UrQRfT69wMLDPr2M")
                echo "- hostkey: matches PIN-B (OpenSSH 9.9 instance-2026-07-21)" >> "$S" ;;
              *)
                echo "- hostkey: UNKNOWN (neither pin)" >> "$S" ;;
            esac
          else
            echo "- hostkey: scan failed" >> "$S"
          fi

      - name: SSH auth matrix against VPS_HOST
        run: |
          set -uo pipefail
          S="$GITHUB_STEP_SUMMARY"
          echo "### SSH auth (VPS_HOST)" >> "$S"
          [ -n "$VPS_USER" ] || VPS_USER=root
          for var in SSH_PRIVATE_KEY VPS_SSH_KEY; do
            f=~/.ssh/$var
            [ -f "$f" ] || { echo "- $var: (no key file)" >> "$S"; continue; }
            if timeout 30 ssh -i "$f" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=15 -o BatchMode=yes -p "$SSH_PORT" "${VPS_USER}@${VPS_HOST}" 'true' 2>/dev/null; then
              echo "- $var as ${VPS_USER}@VPS_HOST: SSH OK" >> "$S"
            else
              echo "- $var as ${VPS_USER}@VPS_HOST: SSH FAIL" >> "$S"
            fi
          done

      - name: Site status
        run: |
          S="$GITHUB_STEP_SUMMARY"
          echo "### Sites" >> "$S"
          for u in https://ftgtours.esggo.co/ https://esggo.co/ https://hermex.esggo.co/ https://omniagent.esggo.co/; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$u" || echo ERR)
            echo "- $u -> $code" >> "$S"
          done

      - name: OCI inventory (booleans only)
        run: |
          set +e
          S="$GITHUB_STEP_SUMMARY"
          echo "### OCI inventory" >> "$S"
          pip3 install --user --quiet oci-cli >/dev/null 2>&1
          export PATH="$HOME/.local/bin:$PATH"
          export OCI_CLI_SUPPRESS_FILE_PERMISSIONS_WARNING=True
          export SUPPRESS_LABEL_WARNING=True
          mkdir -p ~/.oci
          cat > ~/.oci/config <<EOFCONF
          [DEFAULT]
          user=$OCI_USER
          tenancy=$OCI_TENANCY
          region=$OCI_REGION
          key_file=/tmp/oci_key.pem
          fingerprint=$OCI_FINGERPRINT
          EOFCONF
          printf '%s' "$OCI_KEY" > /tmp/oci_key.pem
          chmod 600 /tmp/oci_key.pem
          if ! oci iam compartment list -c "$OCI_TENANCY" --all --output json >/dev/null 2>&1; then
            echo "- OCI creds: INVALID or expired" >> "$S"
            exit 0
          fi
          echo "- OCI creds: VALID" >> "$S"
          TRG=$(printf '%s' "$OCI_TARGET" | tr '.' ' ' | awk '{print $4}')
          {
            echo "$OCI_REGION"
            [ -n "$TRG" ] && echo "$TRG"
            oci iam region-subscription list --tenancy-id "$OCI_TENANCY" --output json 2>/dev/null | jq -r '.data[]."region-name"' 2>/dev/null
          } | sort -u | grep -v '^$' > /tmp/regs
          if [ -n "$TRG" ]; then
            tstate=$(oci --raw-output compute instance get --instance-id "$OCI_TARGET" --region "$TRG" --query 'data."lifecycle-state"' 2>/dev/null)
            [ -n "$tstate" ] && echo "- OCI_TARGET resolves as INSTANCE ($tstate)" >> "$S"
            bstate=$(oci --raw-output bastion bastion get --bastion-id "$OCI_TARGET" --region "$TRG" --query 'data."lifecycle-state"' 2>/dev/null)
            [ -n "$bstate" ] && echo "- OCI_TARGET resolves as BASTION ($bstate)" >> "$S"
          fi
          idx=0
          while read -r REG; do
            [ -n "$REG" ] || continue
            {
              echo "$OCI_TENANCY"
              oci iam compartment list -c "$OCI_TENANCY" --all --region "$REG" --output json 2>/dev/null | jq -r '.data[].id' 2>/dev/null
            } > /tmp/comps
            while read -r CID; do
              [ -n "$CID" ] || continue
              for IID in $(oci compute instance list -c "$CID" --region "$REG" --output json 2>/dev/null | jq -r '.data[].id' 2>/dev/null); do
                state=$(oci --raw-output compute instance get --instance-id "$IID" --region "$REG" --query 'data."lifecycle-state"' 2>/dev/null)
                ip=$(oci --raw-output compute instance list-vnics --instance-id "$IID" --region "$REG" --query 'data[0]."public-ip"' 2>/dev/null)
                [ -n "$ip" ] || continue
                idx=$((idx+1))
                if [ "$ip" = "$VPS_HOST" ]; then match=YES; else match=NO; fi
                echo "- instance[$idx] region=$REG state=$state public_ip_matches_VPS_HOST=$match" >> "$S"
                for var in SSH_PRIVATE_KEY VPS_SSH_KEY; do
                  f=~/.ssh/$var
                  [ -f "$f" ] || continue
                  if timeout 30 ssh -i "$f" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=15 -o BatchMode=yes "${VPS_USER:-ubuntu}@${ip}" 'true' 2>/dev/null; then
                    echo "  - $var as ubuntu@instance[$idx]: SSH OK" >> "$S"
                  else
                    echo "  - $var as ubuntu@instance[$idx]: SSH FAIL" >> "$S"
                  fi
                done
                plg=$(oci instance-agent plugin list --compartment-id "$CID" --instance-id "$IID" --region "$REG" --output json 2>/dev/null | jq -r '.data[].name' 2>/dev/null | tr '\n' ' ')
                if printf '%s' "$plg" | grep -qi 'run.command\|runcommand'; then
                  echo "  - instance[$idx] run-command plugin: ENABLED" >> "$S"
                elif [ -n "$plg" ]; then
                  echo "  - instance[$idx] run-command plugin: not in plugin list" >> "$S"
                else
                  echo "  - instance[$idx] run-command plugin: query failed" >> "$S"
                fi
              done
            done < /tmp/comps
          done < /tmp/regs
          echo "- total instances with public IP: $idx" >> "$S"

      - name: Commit results snapshot
        run: |
          set +e
          cp "$GITHUB_STEP_SUMMARY" audit-result.md 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit-result.md
          git commit -m "audit results snapshot" || true
          git push || echo "push failed (non-fatal)"
