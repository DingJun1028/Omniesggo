name: TS Matrix 雙向驗證閘 (esggo)

on:
  push:
    branches: [main, develop, feat/**]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  matrix:
    name: TS Matrix Drift Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run TS Matrix 雙向驗證閘
        run: node tools/ts-matrix/verify.mjs
      - name: Upload drift-report.json (Trustworthy 5T evidence)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ts-matrix-drift-report-${{ github.sha }}
          path: tools/ts-matrix/drift-report.json
          retention-days: 30
      - name: Fail on drift
        if: hashFiles('tools/ts-matrix/drift-report.json') != ''
        run: |
          # 棘輪規則：只有「不在基線內的新增 drift」才失敗（既有 75 筆見 baseline.json）
          read count base total new < <(node -e "
            const r = require('./tools/ts-matrix/drift-report.json');
            console.log(r.pass ? '0' : '1', r.reverse.baseline.total, r.reverse.shadowedCount, r.reverse.baseline.newDriftCount);
          ")
          if [ "$count" != "0" ] || [ "$new" -gt "0" ]; then
            echo "::error::TS Matrix 新增 $new 處 type drift（基線 $base 筆 / 現況 $total 筆，只減不增）"
            exit 1
          fi
          echo "✅ TS Matrix 雙向 PASS（基線棘輪 $base 筆，新增 0）"
