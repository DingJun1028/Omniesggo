# 一次性 workflow：將 main（PR #80 squash 合併後）同步進 feat/degoogle-supabase。
# 已知衝突僅 src/lib/db/prisma-compat.ts（add/add）與 src/lib/prisma.ts（content），
# 兩檔皆以 main 版本為準（含延遲建構修復，De-Google 變更未觸及此二檔邏輯）。
# 完成後自我移除。
name: degoogle-merge-main (one-shot)
on:
  push:
    branches: [feat/degoogle-supabase]
    paths: ['.github/workflows/degoogle-merge-main.yml']
permissions:
  contents: write
jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feat/degoogle-supabase
      - name: Merge main with conflict resolution
        run: |
          set -e
          git config user.name "esggo-ci-bot"
          git config user.email "actions@users.noreply.github.com"
          git merge origin/main --no-edit && DONE=0 || DONE=1
          if [ "$DONE" = "1" ]; then
            # 以 main 版本解決已知衝突檔
            git checkout --theirs -- src/lib/db/prisma-compat.ts src/lib/prisma.ts
            git add src/lib/db/prisma-compat.ts src/lib/prisma.ts
            REMAIN=$(git diff --name-only --diff-filter=U | wc -l)
            if [ "$REMAIN" != "0" ]; then
              echo "::error::未預期衝突："
              git diff --name-only --diff-filter=U
              git merge --abort || true
              exit 1
            fi
            git commit --no-edit
          fi
          git rm .github/workflows/degoogle-merge-main.yml
          git commit -m "chore(ci): remove one-shot degoogle-merge-main workflow" --allow-empty
          git push
