name: Lockfile Sync (one-shot oesg-dao)

on:
  push:
    branches: [feat/oesg-dao-module]
    paths: ['.github/workflows/lockfile-sync-dao.yml']

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/oesg-dao-module
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepare pnpm
        run: corepack prepare pnpm@latest --activate
      - name: Regenerate lockfile
        run: pnpm install --no-frozen-lockfile
      - name: Commit lockfile if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "NO_CHANGES"
          else
            git commit -m "chore: sync pnpm-lock.yaml for oesg-dao"
          fi
      - name: Remove one-shot workflow
        run: |
          git rm .github/workflows/lockfile-sync-dao.yml
          git commit -m "chore: remove one-shot lockfile sync workflow" --allow-empty
      - name: Push
        run: git push origin HEAD:feat/oesg-dao-module
