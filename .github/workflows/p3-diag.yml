name: p3-diag

# 一次性診斷工作流（自動自刪）：擷取 Trivy 掃描輸出與 canon 測試於 Node 22 之完整輸出。

on:
  push:
    branches: [feat/omninote-web-phase3]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diag:
    if: github.repository == 'DingJun1028/Omniesggo'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'

      - name: Canon tests on Node 22 (capture)
        run: |
          set +e
          node tests/canon.test.mjs > p3-canon-diag.txt 2>&1
          echo "exit_code=$?" >> p3-canon-diag.txt

      - name: Trivy fs scan (capture)
        uses: aquasecurity/trivy-action@8f28faec26515256b6d22074d1d2a8986f4cbd87
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          trivyignores: '.trivyignore'
          output: 'p3-trivy-diag.txt'

      - name: Commit diagnostics and remove this workflow
        run: |
          git config user.name "omninote-ci-bot"
          git config user.email "actions@github.com"
          git add p3-canon-diag.txt p3-trivy-diag.txt
          git rm --quiet .github/workflows/p3-diag.yml
          git commit -m "chore(omninote): capture canon + trivy diagnostics"
          git push
