# =============================================================================
# OmniNote Web — 液態玻璃控制台驗證工作流
# 觸發：feature 分支 push 與涉及 apps/omninote-web 之 PR
# 驗證：tsc --noEmit（strict 權威型別檢查）+ next build（生產建置）
# 安裝：frozen 優先；lockfile 同步前允許 --no-frozen-lockfile 降級（附 warning）
# =============================================================================
name: OmniNote Web CI

on:
  push:
    branches: [feat/omninote-web-ui]
  pull_request:
    paths:
      - 'apps/omninote-web/**'
      - 'pnpm-lock.yaml'

permissions:
  contents: read

concurrency:
  group: omninote-web-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  omninote-web:
    name: TypeCheck + next build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
        timeout-minutes: 5

      - name: Setup pnpm 12.16.1
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 12.16.1
        timeout-minutes: 3

      - name: Install dependencies (frozen 優先；lockfile 同步前允許降級)
        run: |
          pnpm install --frozen-lockfile || (
            echo "::warning::frozen-lockfile 失敗，降級 --no-frozen-lockfile（lockfile 同步後自動成立）"
            pnpm install --no-frozen-lockfile
          )
        timeout-minutes: 15

      - name: TypeCheck (tsc --noEmit)
        run: pnpm --filter @esggo/omninote-web typecheck
        timeout-minutes: 10

      - name: Build (next build)
        run: pnpm --filter @esggo/omninote-web build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        timeout-minutes: 15
