name: Temporary verified security dependency repair
on:
  push:
    branches: [fix/repo-ci-crewai-worker]
    paths: ['.github/workflows/repair-security-deps.yml']
permissions:
  contents: write
concurrency:
  group: security-repair-pr-76
  cancel-in-progress: false
jobs:
  repair:
    if: github.ref == 'refs/heads/fix/repo-ci-crewai-worker'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OTEL_SDK_DISABLED: 'true'
      CREWAI_TELEMETRY_DISABLED: 'true'
      OPENAI_API_KEY: 'offline-config-check-not-a-real-key'
      OPENAI_MODEL_NAME: gpt-4o-mini
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/repo-ci-crewai-worker
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: '0.13.5'
          enable-cache: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: '11.5.2'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Apply bounded manifest and Dockerfile repairs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          def replace_or_accept(text, old, new):
              if old in text:
                  return text.replace(old, new, 1)
              assert new in text, old
              return text
          p = Path('oa-team-crewai/pyproject.toml')
          text = p.read_text()
          text = replace_or_accept(text, '>=3.10,<3.14', '>=3.11,<3.14')
          text = replace_or_accept(text, '"crewai[litellm]==1.15.23"', '"crewai[litellm]==1.15.30"')
          text = replace_or_accept(text, '"crewai-tools>=0.30.0"', '"crewai-tools==1.15.30"')
          constraints = 'constraint-dependencies = ["pillow>=13.0.0", "filelock>=4.2.1", "uv>=0.13.4"]'
          if '[tool.uv]' not in text:
              text += '\n[tool.uv]\n' + constraints + '\n'
          elif 'constraint-dependencies' not in text:
              text = text.replace('[tool.uv]\n', '[tool.uv]\n' + constraints + '\n', 1)
          else:
              assert all(item in text for item in ('pillow>=13.0.0', 'filelock>=4.2.1', 'uv>=0.13.4'))
          p.write_text(text)
          p = Path('pnpm-workspace.yaml')
          text = p.read_text()
          for old, new in [('3.4.12 <4', '3.4.17 <4'), ('1.20.6 <2', '1.20.9 <2'), ('7.29.1 <8', '7.30.1 <8')]:
              text = replace_or_accept(text, old, new)
          if '"@azure/msal-node":' not in text:
              assert 'overrides:\n' in text
              text = text.replace('overrides:\n', 'overrides:\n  "@azure/msal-node": ">=7.1.0 <8"\n', 1)
          # Genkit still requires Zod 3; do not force a Zod 4 root export into it.
          text = text.replace('  "zod-to-json-schema>zod": ">=4.6.6 <5"\n', '')
          p.write_text(text)
          p = Path('package.json')
          data = json.loads(p.read_text())
          for section in ('overrides', 'resolutions'):
              data[section].update({'dompurify': '^3.4.17', 'body-parser': '^1.20.9', 'undici': '^7.30.1'})
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n')
          p = Path('Dockerfile')
          text = p.read_text()
          text = text.replace('RUN apk upgrade --no-cache\n# 啟用 corepack 以支援 pnpm\nRUN corepack enable pnpm', 'RUN apk upgrade --no-cache && corepack enable pnpm')
          text = text.replace('RUN apk upgrade --no-cache\nRUN corepack enable pnpm', 'RUN apk upgrade --no-cache && corepack enable pnpm')
          text = text.replace('RUN npx prisma generate\n\n# 執行建置（用 npx next build 繞過 pnpm 11 deps-status-check 鎖定，與本機驗證一致）\nRUN npx next build', 'RUN npx prisma generate && npx next build')
          text = text.replace('RUN apk upgrade --no-cache && corepack enable pnpm\n# healthcheck 探活依賴 curl\nRUN apk add --no-cache curl\n# 應用資料目錄 (NCBDB / uploads / 5T 存證目錄等需要)\nRUN mkdir -p /app/data /app/public/uploads /app/Omni-Sanctuary/omni-one-萬能筆記/memories', 'RUN apk upgrade --no-cache && corepack enable pnpm && mkdir -p /app/data /app/public/uploads /app/Omni-Sanctuary/omni-one-萬能筆記/memories')
          old = 'CMD curl -f -s -o /dev/null http://127.0.0.1:3000/api/healthz || exit 1'
          new = "CMD node -e \"fetch('http://127.0.0.1:3000/api/healthz', {signal: AbortSignal.timeout(4000)}).then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""
          if old in text:
              text = text.replace(old, new, 1)
          else:
              assert new in text
          assert 'apk add --no-cache curl' not in text
          p.write_text(text)
          p = Path('vitest.config.ts')
          text = p.read_text()
          target = "'tests/junaikey.test.mjs',"
          additions = ['tests/deploy-contract.test.mjs', 'tests/junaikey-secrets.test.mjs', 'tests/omni-one.test.mjs', 'vps/junaikey/model-resolver.test.mjs', 'vps/junaikey/service-resolver.test.mjs']
          lines = text.splitlines()
          index = next((i for i, line in enumerate(lines) if line.strip() == target), None)
          assert index is not None, target
          existing = {line.strip().strip("',") for line in lines}
          missing = [name for name in additions if name not in existing]
          if missing:
              indent = lines[index][:len(lines[index]) - len(lines[index].lstrip())]
              lines[index:index] = [indent + "'" + name + "'," for name in missing]
              text = '\n'.join(lines) + ('\n' if text.endswith('\n') else '')
          p.write_text(text)
          PY
      - name: Resolve and install locked Python dependencies
        working-directory: oa-team-crewai
        run: |
          uv lock --upgrade-package crewai --upgrade-package crewai-cli --upgrade-package crewai-tools --upgrade-package pillow --upgrade-package filelock --upgrade-package uv --python 3.13
          uv sync --locked --no-build --no-install-project --python 3.13
      - name: Smoke configuration without network or LLM calls
        working-directory: oa-team-crewai
        run: |
          ./.venv/bin/python - <<'PY'
          import socket
          def deny_network(*args, **kwargs):
              raise RuntimeError('Network access is forbidden in config smoke')
          socket.socket.connect = deny_network
          socket.socket.connect_ex = deny_network
          socket.create_connection = deny_network
          from crewai import Crew
          def deny_kickoff(*args, **kwargs):
              raise RuntimeError('LLM execution is forbidden in config smoke')
          Crew.kickoff = deny_kickoff
          from main import check_config
          check_config()
          PY
      - name: Resolve JavaScript lockfile and test
        run: |
          pnpm install --lockfile-only --ignore-scripts
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm test
          node tests/deploy-contract.test.mjs
          node tests/junaikey-secrets.test.mjs
          node tests/omni-one.test.mjs
      - name: Hadolint repaired Dockerfile
        uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf
        with:
          dockerfile: Dockerfile
          failure-threshold: warning
      - name: Save independently tested repairs to fixed PR branch
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = 'fix/repo-ci-crewai-worker'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add oa-team-crewai/pyproject.toml oa-team-crewai/uv.lock pnpm-workspace.yaml package.json pnpm-lock.yaml Dockerfile vitest.config.ts
          git diff --cached --stat
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m 'fix: save tested dependency, test discovery, and Dockerfile repairs; Zod remains open'
            git push origin HEAD:fix/repo-ci-crewai-worker
          fi
      - name: Enforce high and critical vulnerability gate
        uses: aquasecurity/trivy-action@8f28faec26515256b6d22074d1d2a8986f4cbd87
        with:
          scan-type: fs
          scan-ref: .
          format: table
          exit-code: '1'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          trivyignores: .trivyignore
