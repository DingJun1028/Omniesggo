name: One-shot branch sync (#226)

on:
  push:
    branches: [dependabot/npm_and_yarn/my-worker/wrangler-4.158.0]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: dependabot/npm_and_yarn/my-worker/wrangler-4.158.0

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Merge main
        run: |
          set -euo pipefail
          git fetch origin main
          if ! git merge FETCH_HEAD --no-edit; then
            UNRESOLVED="$(git diff --name-only --diff-filter=U | grep -v '^my-worker/pnpm-lock.yaml$' || true)"
            if [ -n "$UNRESOLVED" ]; then
              echo "Unresolvable conflicts: $UNRESOLVED"
              exit 1
            fi
            git checkout --theirs my-worker/pnpm-lock.yaml
            git add my-worker/pnpm-lock.yaml
          fi

      - name: Regenerate nested lockfile
        run: |
          corepack enable
          cd my-worker
          pnpm install --lockfile-only --no-frozen-lockfile

      - name: Commit merge resolution
        run: |
          git add my-worker/pnpm-lock.yaml
          if ! git diff --cached --quiet; then
            git commit -m "chore: sync branch with main (regenerate my-worker lockfile)"
          else
            if [ -f .git/MERGE_HEAD ]; then
              git commit --no-edit
            fi
          fi

      - name: Remove one-shot workflow and push
        run: |
          git rm -f .github/workflows/branch-sync-226.yml || true
          if ! git diff --cached --quiet; then
            git commit -m "chore: remove one-shot branch sync workflow"
          fi
          git push origin HEAD:dependabot/npm_and_yarn/my-worker/wrangler-4.158.0
