# =============================================================================
# OmniNote: Unified — 一次性診斷 v9（PR #161）
# 復刻 ts-matrix 之步驟順序（setup-node 在前、pnpm/action-setup@v4 無版本在後），
# 擷取 pnpm install --frozen-lockfile 瞬時失敗之錯誤文本。自刪本檔。
# =============================================================================
name: Omninote Full Diag v9 (one-shot)

on:
  push:
    branches: [feat/omninote-unified-package]
    paths: ['.github/workflows/omninote-full-diag.yml']

permissions:
  contents: write

concurrency:
  group: omninote-full-diag
  cancel-in-progress: true

jobs:
  diagnose:
    name: Replicate ts-matrix step order
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Diagnose
        run: |
          set +e
          {
            echo "=== which pnpm ==="; which pnpm
            echo "=== pnpm --version ==="; pnpm --version
            echo; echo "=== pnpm install --frozen-lockfile ==="
            pnpm install --frozen-lockfile
            echo "frozen_install_exit_code=$?"
          } > install-diag9.txt 2>&1
          cat install-diag9.txt
        timeout-minutes: 30

      - name: Commit diagnostics and remove this workflow (self-cleaning, always)
        if: always()
        run: |
          git config user.name "omninote-ci-bot"
          git config user.email "actions@github.com"
          git add install-diag9.txt
          git rm .github/workflows/omninote-full-diag.yml
          git commit -m "chore(omninote): capture ts-matrix-order diagnostics (v9)"
          git push
        timeout-minutes: 5
