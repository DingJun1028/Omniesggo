# =============================================================================
# OmniNote: Unified — 一次性清理 v10（PR #161）
# 移除歷次診斷遺留之 install-diag*.txt 與本工作流自身。
# =============================================================================
name: Omninote Full Diag v10 (one-shot)

on:
  push:
    branches: [feat/omninote-unified-package]
    paths: ['.github/workflows/omninote-full-diag.yml']

permissions:
  contents: write

concurrency:
  group: omninote-full-diag
  cancel-in-progress: true

jobs:
  cleanup:
    name: Remove diagnostics artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Remove install-diag artifacts and this workflow
        run: |
          git config user.name "omninote-ci-bot"
          git config user.email "actions@github.com"
          git rm --ignore-unmatch install-diag*.txt
          git rm .github/workflows/omninote-full-diag.yml
          git commit -m "chore(omninote): remove one-shot diagnostics artifacts (cleanup)"
          git push
        timeout-minutes: 5
