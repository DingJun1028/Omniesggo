# =============================================================================
# OmniNote: Unified — 一次性診斷 v8（PR #161）
# 復刻 ts-matrix/deploy(Code Quality) 之未釘選 @v4 actions 配置，
# 擷取 pnpm install --frozen-lockfile 瞬時失敗之錯誤文本。自刪本檔。
# =============================================================================
name: Omninote Full Diag v8 (one-shot)

on:
  push:
    branches: [feat/omninote-unified-package]
    paths: ['.github/workflows/omninote-full-diag.yml']

permissions:
  contents: write

concurrency:
  group: omninote-full-diag
  cancel-in-progress: true

jobs:
  diagnose:
    name: Replicate unpinned-at-v4 install failure
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm (unpinned v4, no version input — replicate ts-matrix)
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Diagnose
        run: |
          set +e
          {
            echo "=== which pnpm ==="; which pnpm; echo "exit=$?"
            echo "=== pnpm --version ==="; pnpm --version; echo "exit=$?"
            echo "=== pnpm config get store-dir ==="; pnpm config get store-dir; echo "exit=$?"
            echo; echo "=== pnpm install --frozen-lockfile ==="
            pnpm install --frozen-lockfile
            echo "frozen_install_exit_code=$?"
          } > install-diag8.txt 2>&1
          cat install-diag8.txt
        timeout-minutes: 30

      - name: Commit diagnostics and remove this workflow (self-cleaning, always)
        if: always()
        run: |
          git config user.name "omninote-ci-bot"
          git config user.email "actions@github.com"
          git add install-diag8.txt
          git rm .github/workflows/omninote-full-diag.yml
          git commit -m "chore(omninote): capture unpinned-v4 install diagnostics (v8)"
          git push
        timeout-minutes: 5
