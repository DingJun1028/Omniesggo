# =============================================================================
# OmniNote: Unified — 一次性全鏈診斷 v6（PR #161）
# 16ebc25 上安裝與 typecheck 已過；本工作流擷取 38 項測試之完整輸出至
# install-diag6.txt，任何步驟失敗仍回傳，並自刪本檔。
# =============================================================================
name: Omninote Full Diag v6 (one-shot)

on:
  push:
    branches: [feat/omninote-unified-package]
    paths: ['.github/workflows/omninote-full-diag.yml']

permissions:
  contents: write

concurrency:
  group: omninote-full-diag
  cancel-in-progress: true

jobs:
  diagnose:
    name: Capture contract test output
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
        timeout-minutes: 5

      - name: Setup pnpm 12.16.1
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 12.16.1
        timeout-minutes: 3

      - name: Install and run tests with captured output
        run: |
          set +e
          {
            echo "=== pnpm --version ==="; pnpm --version
            echo "=== node --version ==="; node --version
            echo; echo "=== pnpm install --frozen-lockfile ==="
            pnpm install --frozen-lockfile
            echo "install_exit_code=$?"
            echo; echo "=== contract tests (38) full output ==="
            pnpm --filter @esggo/omninote-unified test
            echo "test_exit_code=$?"
          } > install-diag6.txt 2>&1
          tail -60 install-diag6.txt
        timeout-minutes: 30

      - name: Commit diagnostics and remove this workflow (self-cleaning, always)
        if: always()
        run: |
          git config user.name "omninote-ci-bot"
          git config user.email "actions@github.com"
          git add install-diag6.txt
          git rm .github/workflows/omninote-full-diag.yml
          git commit -m "chore(omninote): capture contract test diagnostics (v6)"
          git push
        timeout-minutes: 5
