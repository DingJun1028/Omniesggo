# =============================================================================
# OmniNote: Unified — 一次性診斷 v7（PR #161）
# 擷取：frozen 安裝失敗之完整錯誤文本、ts-matrix verify 輸出與 drift-report.json。
# 自刪本檔。
# =============================================================================
name: Omninote Full Diag v7 (one-shot)

on:
  push:
    branches: [feat/omninote-unified-package]
    paths: ['.github/workflows/omninote-full-diag.yml']

permissions:
  contents: write

concurrency:
  group: omninote-full-diag
  cancel-in-progress: true

jobs:
  diagnose:
    name: Capture frozen install error and drift report
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
        timeout-minutes: 5

      - name: Setup pnpm 12.16.1
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 12.16.1
        timeout-minutes: 3

      - name: Diagnose
        run: |
          set +e
          {
            echo "=== versions ==="; pnpm --version; node --version
            echo; echo "=== pnpm install --frozen-lockfile (no fallback, capture error) ==="
            pnpm install --frozen-lockfile
            echo "frozen_install_exit_code=$?"
            echo; echo "=== ts-matrix verify.mjs ==="
            node tools/ts-matrix/verify.mjs
            echo "ts_matrix_exit_code=$?"
            echo; echo "=== drift-report.json ==="
            cat tools/ts-matrix/drift-report.json 2>/dev/null || echo "(no drift-report.json)"
          } > install-diag7.txt 2>&1
          tail -40 install-diag7.txt
        timeout-minutes: 30

      - name: Commit diagnostics and remove this workflow (self-cleaning, always)
        if: always()
        run: |
          git config user.name "omninote-ci-bot"
          git config user.email "actions@github.com"
          git add install-diag7.txt
          git rm .github/workflows/omninote-full-diag.yml
          git commit -m "chore(omninote): capture frozen-install and drift diagnostics (v7)"
          git push
        timeout-minutes: 5
