name: Build & publish AI Station image

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      cloud_ready: ${{ steps.cloud_gate.outputs.cloud_ready }}
    # Publishing and cloud-provider secrets are available only on main pushes.
    env:
      DOCKERHUB_USERNAME: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.DOCKERHUB_USERNAME || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg (pipeline + API tests render with it)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install deps + run pytest
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pytest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        continue-on-error: true   # registry/network blips must not fail the test-gated CI

      - name: Set up QEMU (for multi-arch arm64 builds on the amd64 runner)
        if: ${{ env.DOCKERHUB_USERNAME != '' }}
        uses: docker/setup-qemu-action@v3

      - name: Log in to Docker Hub (only on main pushes with credentials)
        if: ${{ env.DOCKERHUB_USERNAME != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build image (publish only on main pushes with credentials)
        uses: docker/build-push-action@v6
        continue-on-error: true   # build-only CI: image build is best-effort
        with:
          context: .
          # Pull requests and manual runs build locally without registry credentials or publishing.
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && env.DOCKERHUB_USERNAME != '' }}
          load: ${{ env.DOCKERHUB_USERNAME == '' }}
          platforms: >-
            ${{ env.DOCKERHUB_USERNAME != '' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          tags: >-
            ${{ env.DOCKERHUB_USERNAME != '' && format('{0}/aistation:latest', env.DOCKERHUB_USERNAME) || 'aistation:ci' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Probe cloud secrets (main pushes only)
        id: cloud_gate
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          RUNWAY_API_KEY: ${{ secrets.RUNWAY_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          if [ -n "$RUNWAY_API_KEY" ] || [ -n "$ELEVENLABS_API_KEY" ]; then
            echo "cloud_ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "cloud_ready=false" >> "$GITHUB_OUTPUT"
          fi

  cloud-integration:
    # Real cloud-provider calls run only after a main push and when matching secrets exist.
    needs: build
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.build.outputs.cloud_ready == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ffmpeg + deps
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run real cloud integration tests
        env:
          RUNWAY_API_KEY: ${{ secrets.RUNWAY_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
        run: pytest -m cloud -v
