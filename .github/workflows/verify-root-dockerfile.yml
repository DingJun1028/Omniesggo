name: Verify repaired root Dockerfile
on:
  pull_request:
    branches: [main]
    paths:
      - 'Dockerfile'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/verify-root-dockerfile.yml'
permissions:
  contents: read
jobs:
  lint:
    if: github.head_ref == 'fix/repo-ci-crewai-worker'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Lint repaired root Dockerfile
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387
        with:
          dockerfile: Dockerfile
          failure-threshold: warning
  build:
    if: github.head_ref == 'fix/repo-ci-crewai-worker'
    needs: lint
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Build repaired root Dockerfile without publishing
        run: docker build --progress=plain --tag esggo-pr-76-root:test --file Dockerfile .
