name: pnpm-lockfile-sync

on:
  push:
    branches: [dependabot/npm_and_yarn/apps/learning-center/autoprefixer-10.6.2]
    paths: [".github/workflows/lockfile-sync.yml"]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: setup-pnpm
        uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: sync
        run: |
          set +e
          pnpm install --lockfile-only --no-frozen-lockfile > /tmp/pnpm.log 2>&1; rc=$?
          echo "pnpm install rc=$rc" >> /tmp/pnpm.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ $rc -ne 0 ]; then
            cp /tmp/pnpm.log pnpm-sync-fail.log
            git add pnpm-sync-fail.log
            git commit -m "chore: pnpm lockfile sync failed — diag log"
            git push
            exit 1
          fi
          git add pnpm-lock.yaml
          git commit -m "chore: sync root pnpm-lock.yaml with learning-center autoprefixer bump" || true
          git push
