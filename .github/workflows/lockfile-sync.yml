name: lockfile-sync
on:
  push:
    paths:
      - .github/workflows/lockfile-sync.yml
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: merge main, fix workflows, regenerate lockfile
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git merge origin/main -m "chore: sync with main" -X ours
          pnpm install --no-frozen-lockfile
          git add -A
          git commit -m "chore: regenerate lockfile after syncing main" || true
          git rm .github/workflows/lockfile-sync.yml
          git commit --amend --no-edit || git commit -m "chore: remove lockfile-sync workflow"
          git push
