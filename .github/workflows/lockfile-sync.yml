# =============================================================================
# 一次性鎖檔同步工作流（自我移除）One-shot lockfile sync (self-removing)
# 觸發 Trigger：本檔案之 push；於 CI 執行 pnpm install --no-frozen-lockfile 生成
#   pnpm-lock.yaml，連同本工作流之刪除一併由 GITHUB_TOKEN 推回。
#   bot push 不觸發後續 CI（GitHub 慣例）。
# Runs pnpm install --no-frozen-lockfile on CI, then commits the resulting
#   pnpm-lock.yaml plus deletion of this workflow file via GITHUB_TOKEN.
#   Bot pushes do not trigger further CI (GitHub convention).
# 慣例追溯 Precedent：PR #351 之一次性 lockfile-sync 工作流。
# =============================================================================
name: One-shot lockfile sync

on:
  push:
    branches: [feat/omninote-web-junaikey]
    paths:
      - '.github/workflows/lockfile-sync.yml'

permissions:
  contents: write

jobs:
  sync:
    name: Sync pnpm-lock.yaml (self-removing)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm 12.16.1
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.16.1
        timeout-minutes: 3

      - name: Setup Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: pnpm
        timeout-minutes: 5

      - name: Update lockfile
        run: pnpm install --no-frozen-lockfile
        timeout-minutes: 15

      - name: Commit lockfile and remove this workflow
        run: |
          git config user.name "omniesggo-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git rm .github/workflows/lockfile-sync.yml
          git commit -m "chore: sync pnpm-lock.yaml for @esggo/tailwind-preset workspace dependency"
          git push
