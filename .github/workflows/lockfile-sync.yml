name: One-shot lockfile sync

on:
  push:
    branches: [feature/omni-arch-12-modules]
    paths: ['.github/workflows/lockfile-sync.yml']

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13'
      - run: corepack enable && corepack prepare pnpm@11.5.2 --activate
      - run: pnpm install --no-frozen-lockfile
      - name: Commit lockfile if changed
        run: |
          git config user.name "omni-arch-bot"
          git config user.email "actions@github.com"
          git add pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "lockfile already in sync"
          else
            git commit -m "chore: sync pnpm-lock.yaml for @esggo/omni-arch importer"
            git push
          fi
