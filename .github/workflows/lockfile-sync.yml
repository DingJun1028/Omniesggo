name: Lockfile Sync (one-shot)

on:
  push:
    paths:
      - '.github/workflows/lockfile-sync.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.5.2 --activate
      - name: Sync lockfile
        run: pnpm install --no-frozen-lockfile
      - name: Commit and push lockfile
        run: |
          git config user.name "omni-agent-bot"
          git config user.email "actions@users.noreply.github.com"
          git add pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "lockfile already in sync"
            exit 0
          fi
          git commit -m "chore(deps): sync pnpm-lock.yaml for zod-to-typebox migration"
          git push
