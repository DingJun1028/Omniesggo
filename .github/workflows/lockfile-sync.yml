name: One-shot lockfile sync (Supabase migration)

on:
  push:
    branches: [feat/supabase-migration]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lockfile-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/supabase-migration

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.2

      - name: Regenerate lockfile without installing
        run: pnpm install --no-frozen-lockfile --lockfile-only

      - name: Commit lockfile and remove this workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet pnpm-lock.yaml; then
            echo "lockfile already in sync"
          else
            git add pnpm-lock.yaml
            git commit -m "chore(db): regenerate pnpm-lock.yaml after Prisma removal"
          fi
          git rm .github/workflows/lockfile-sync.yml
          git commit -m "chore: remove one-shot lockfile sync workflow" || true
          git push
