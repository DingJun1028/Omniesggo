name: lockfile-sync

on:
  push:
    branches: [feat/tailwind-preset-phase2]
    paths:
      - 'apps/ftg-journey-web/package.json'
      - 'apps/htb-esggo-co/package.json'
      - 'packages/tailwind-preset/**'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/lockfile-sync.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/tailwind-preset-phase2

      - name: Setup Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Install pnpm
        run: corepack enable && corepack prepare pnpm@12.16.1 --activate

      - name: Sync lockfile
        run: pnpm install --no-frozen-lockfile

      - name: Commit lockfile and remove this workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git rm .github/workflows/lockfile-sync.yml
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "chore: sync pnpm-lock.yaml for tailwind-preset phase2 and remove lockfile-sync workflow"
          git push
