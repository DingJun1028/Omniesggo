# 一次性 workflow：為 apps/mcp-gateway 加入 @carlos-tzin/tzin 後同步根 pnpm-lock.yaml。
# 完成後自我移除（最後一步 git rm 本檔並推送）。
name: lockfile-sync (one-shot)
on:
  push:
    branches: [feat/tzin-mcp-gateway]
    paths: ['apps/mcp-gateway/**', '.github/workflows/lockfile-sync.yml']
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install and sync lockfile
        run: pnpm install --no-frozen-lockfile
      - name: Commit lockfile and self-remove this workflow
        run: |
          git config user.name "esggo-ci-bot"
          git config user.email "actions@users.noreply.github.com"
          git add pnpm-lock.yaml
          git diff --cached --quiet || git commit -m "chore(lockfile): sync for apps/mcp-gateway (@carlos-tzin/tzin)"
          git rm .github/workflows/lockfile-sync.yml
          git commit -m "chore(ci): remove one-shot lockfile-sync workflow" --allow-empty
          git push
