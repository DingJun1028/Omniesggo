name: One-shot uv relock (crewai interlock)

on:
  push:
    branches: [dependabot/pip/oa-team-crewai/crewai-1.15.33]

permissions:
  contents: write

jobs:
  relock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dependabot/pip/oa-team-crewai/crewai-1.15.33

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78

      - name: uv lock
        working-directory: oa-team-crewai
        run: uv lock

      - name: Commit lockfile and remove one-shot workflow
        run: |
          git add oa-team-crewai/uv.lock
          if ! git diff --cached --quiet; then
            git commit -m "chore: sync uv.lock after crewai/crewai-tools 1.15.33 interlock bump"
          fi
          git rm -f .github/workflows/uv-relock-166.yml || true
          if ! git diff --cached --quiet; then
            git commit -m "chore: remove one-shot uv relock workflow"
          fi
          git push origin dependabot/pip/oa-team-crewai/crewai-1.15.33
