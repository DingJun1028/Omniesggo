name: Deploy OmniGateway Worker

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - 'wrangler.toml'
      - '.github/workflows/deploy-worker.yml'
      - 'deploy/worker-tools/**'
  pull_request:
    paths:
      - 'worker/**'
      - 'wrangler.toml'
      - '.github/workflows/deploy-worker.yml'
      - 'deploy/worker-tools/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Worker typecheck and dry-run
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Install locked isolated Worker tooling without scripts
        run: |
          mkdir -p "$RUNNER_TEMP/worker-tools"
          cp deploy/worker-tools/package.json deploy/worker-tools/package-lock.json "$RUNNER_TEMP/worker-tools/"
          cd "$RUNNER_TEMP/worker-tools"
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Typecheck Worker
        run: |
          "$RUNNER_TEMP/worker-tools/node_modules/.bin/tsc" --noEmit -p worker/tsconfig.json --typeRoots "$RUNNER_TEMP/worker-tools/node_modules/@types"
      - name: Bundle Worker without deploying
        run: |
          "$RUNNER_TEMP/worker-tools/node_modules/.bin/wrangler" deploy --dry-run --config wrangler.toml --outdir "$RUNNER_TEMP/worker-bundle"

  deploy:
    name: Deploy OmniGateway Worker
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Install locked isolated Worker tooling without scripts
        run: |
          mkdir -p "$RUNNER_TEMP/worker-tools"
          cp deploy/worker-tools/package.json deploy/worker-tools/package-lock.json "$RUNNER_TEMP/worker-tools/"
          cd "$RUNNER_TEMP/worker-tools"
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          "$RUNNER_TEMP/worker-tools/node_modules/.bin/wrangler" deploy --config wrangler.toml
