name: Deploy OmniGateway Worker

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - 'wrangler.toml'
      - '.github/workflows/deploy-worker.yml'
  pull_request:
    paths:
      - 'worker/**'
      - 'wrangler.toml'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Worker typecheck and dry-run
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated Worker tooling
        run: |
          mkdir -p "$RUNNER_TEMP/worker-tools"
          cd "$RUNNER_TEMP/worker-tools"
          npm init -y
          npm install --no-audit --no-fund typescript@5.9.3 @types/node@26.6.5 wrangler@4.151.2
      - name: Typecheck Worker
        run: |
          "$RUNNER_TEMP/worker-tools/node_modules/.bin/tsc" --noEmit -p worker/tsconfig.json --typeRoots "$RUNNER_TEMP/worker-tools/node_modules/@types"
      - name: Bundle Worker without deploying
        run: |
          "$RUNNER_TEMP/worker-tools/node_modules/.bin/wrangler" deploy --dry-run --config wrangler.toml --outdir "$RUNNER_TEMP/worker-bundle"

  deploy:
    name: Deploy OmniGateway Worker
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated Wrangler
        run: |
          mkdir -p "$RUNNER_TEMP/worker-tools"
          cd "$RUNNER_TEMP/worker-tools"
          npm init -y
          npm install --no-audit --no-fund wrangler@4.151.2
      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          "$RUNNER_TEMP/worker-tools/node_modules/.bin/wrangler" deploy --config wrangler.toml
