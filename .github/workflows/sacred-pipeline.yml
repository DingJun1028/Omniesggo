name: 🌌 ESG GO Sacred Pipeline (CI/CD)

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # 階段一：原罪煉金 (自動化測試與防禦)
  entropy-reduction-test:
    name: 🛡️ 原罪煉金 (Entropy Reduction)
    runs-on: ubuntu-latest
    steps:
      - name: 📥 召喚源碼 (Checkout code)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: ⚙️ 構築結界 (Setup Node.js)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: 📦 注入依賴 (Install dependencies)
        run: pnpm install --frozen-lockfile

      - name: 🔍 零幻覺靜態掃描 (Linting)
        continue-on-error: true
        run: pnpm run lint

      - name: 🧪 神聖契約驗證 (Unit Tests, 阻塞覆蓋)
        # 5T-Traceable: 2026-11-23 使用者裁決改阻塞（含 junaikey-layout 7 項單元測試）。
        # 阻塞範圍＝CI 環境確定安全之子集（同 package.json check 之核心契約組＋tailwind-preset 包）。
        # 全量套件含 flaky／需本機依賴之測試（vitest.config.ts 註明同 commit 連跑失敗數
        # 5→1→0 跳動；本 PR 首跑 Unit Tests 步驟紅、install/lint 綠，即為實證），
        # 移至下一步驟以不阻斷方式全量報告，防不穩定閘阻斷無關 PR，亦不回復慢性遮蔽。
        run: pnpm vitest run src/impl/__tests__/core.test.ts src/agents/twelve-omni/__tests__ packages/tailwind-preset

      - name: 🧪 全量單元測試報告 (Full unit test report, 不阻斷)
        # 全量執行供觀測（含 junaikey-ui/layout 以外之全部測試），紅燈不阻斷；
        # 慢性紅項目依觀察紀錄列管整治，而非以遮蔽換取綠燈。
        continue-on-error: true
        run: pnpm vitest run

  # 階段二：神跡顯現 (Docker 映像檔鑄造)
  docker-image-casting:
    name: 🐳 神跡顯現 (Image Casting)
    needs: entropy-reduction-test
    runs-on: ubuntu-latest
    # 只有在 main 分支的 push 才會觸發實體化鑄造
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🔑 登入容器聖所 (Log in to Registry)
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 💠 鑄造前端液態結界 (Build Frontend HUD)
        run: |
          echo "Building Frontend Docker Image..."
          # docker build -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/frontend:latest .

      - name: ⚡ 鑄造符文中樞 (Build Rune API)
        run: |
          echo "Building Rune API Docker Image..."
          # docker build -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/rune-api:latest ./backend-api

      - name: 🕊️ 鑄造神使陣列 (Build Agent Swarm)
        run: |
          echo "Building Agent Swarm Docker Image..."
          # docker build -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/agent-swarm:latest ./agents

      - name: 🔒 封印並上傳 (Push Images)
        run: |
          echo "Pushing images to registry..."
          # docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/frontend:latest
          # docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/rune-api:latest
          # docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/agent-swarm:latest

  # 階段三：永恆刻印 (自動化部署)
  sacred-deployment:
    name: 🚀 永恆刻印 (Sacred Deployment)
    needs: docker-image-casting
    runs-on: ubuntu-latest
    steps:
      - name: 🌐 部署至雲端結界 (Deploy to Cloud Run / ECS)
        run: |
          echo "執行部署腳本... 將最新的神使陣列與符文 API 替換至生產環境"
          echo "確保 Zero Downtime (零停機) 流量切換"
          # 實際指令例如: 
          # gcloud run deploy esg-frontend --image ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/frontend:latest --region asia-east1
          # gcloud run deploy esg-rune-api --image ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/rune-api:latest --region asia-east1
