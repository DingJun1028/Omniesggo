name: uv-relock

on:
  push:
    branches:
      - dependabot/pip/oa-team-crewai/crewai-1.15.32
      - dependabot/pip/oa-team-crewai/crewai-tools-1.15.32
    paths: [".github/workflows/uv-relock.yml"]

permissions:
  contents: write

jobs:
  relock:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: "0.13.5"
          enable-cache: false
      - name: relock
        run: |
          set +e
          cd oa-team-crewai
          uv lock > /tmp/lock.log 2>&1; rc=$?
          echo "uv lock rc=$rc" >> /tmp/lock.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ $rc -ne 0 ]; then
            cp /tmp/lock.log relock-fail.log
            git add relock-fail.log
            git commit -m "chore: uv lock failed — diag log"
            git push
            exit 1
          fi
          git add uv.lock
          git commit -m "chore: sync uv.lock with bumped crewai dependency" || true
          git push
