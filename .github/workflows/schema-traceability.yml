name: Schema Traceability

on:
  pull_request:
    paths:
      - "shared/prd-matrix.json"
      - "docs/vault-canon/OMN-PRD-001-SCHEMA-TRACEABILITY.md"
      - "scripts/generate-schema-traceability.mjs"
      - ".github/workflows/schema-traceability.yml"
      - "**/*.ts"
      - "**/*.mts"
  push:
    branches: [main]
    paths:
      - "shared/prd-matrix.json"
      - "docs/vault-canon/OMN-PRD-001-SCHEMA-TRACEABILITY.md"
      - "scripts/generate-schema-traceability.mjs"
      - ".github/workflows/schema-traceability.yml"
      - "**/*.ts"
      - "**/*.mts"

jobs:
  schema-traceability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check committed traceability report against canonical
        run: node scripts/generate-schema-traceability.mjs --check
