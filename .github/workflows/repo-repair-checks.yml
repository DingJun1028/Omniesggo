name: Repository repair workflow checks
on:
  pull_request:
    paths:
      - '.github/workflows/crewai-run.yml'
      - '.github/workflows/deploy-worker.yml'
      - '.github/workflows/deploy-deerflow.yml'
      - '.github/workflows/repo-repair-checks.yml'
      - '.github/actionlint/**'
      - 'packages/oa-framework/src/**'
      - 'packages/oa-framework/test/**'
      - 'packages/oa-framework/package.json'
      - 'packages/oa-framework/tsconfig.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/crewai-run.yml'
      - '.github/workflows/deploy-worker.yml'
      - '.github/workflows/deploy-deerflow.yml'
      - '.github/workflows/repo-repair-checks.yml'
      - '.github/actionlint/**'
      - 'packages/oa-framework/src/**'
      - 'packages/oa-framework/test/**'
      - 'packages/oa-framework/package.json'
      - 'packages/oa-framework/tsconfig.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  workflow-syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.24.13'
          cache: false
      - name: Build actionlint from the checked-in lockfile
        working-directory: .github/actionlint
        run: go build -mod=readonly -o "$RUNNER_TEMP/actionlint" github.com/rhysd/actionlint/cmd/actionlint
      - name: Check repaired workflows and existing Deerflow workflow
        run: |
          "$RUNNER_TEMP/actionlint" -shellcheck= -pyflakes= .github/workflows/crewai-run.yml .github/workflows/deploy-worker.yml .github/workflows/deploy-deerflow.yml .github/workflows/repo-repair-checks.yml
  oa-framework-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.5.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm
      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck OA Framework
        run: pnpm --filter @esggo/oa-framework typecheck
      - name: Build OA Framework
        run: pnpm --filter @esggo/oa-framework build
      - name: Run offline registration and 5T smoke test
        run: pnpm --filter @esggo/oa-framework exec tsx test/registration.smoke.ts
