name: nextbuild-debug
on:
  push:
    branches: [feat/supabase-migration]
    paths: ['.github/workflows/nextbuild-debug.yml']

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Reproduce docker-style build (no secrets)
        env:
          DATABASE_URL: postgresql://build:build@localhost:5432/build
          NODE_ENV: production
          CI: 'true'
          NEXT_TELEMETRY_DISABLED: '1'
        run: |
          set +e
          pnpm run build > /tmp/build.log 2>&1
          echo "BUILD_EXIT=$?" >> "$GITHUB_ENV"
      - name: Summary
        if: always()
        run: |
          {
            echo "# next build debug"
            echo "BUILD_EXIT=${BUILD_EXIT:-unknown}"
            echo '## Last 100 lines'
            tail -n 100 /tmp/build.log | sed 's/^/    /'
          } >> "$GITHUB_STEP_SUMMARY"
