name: nextbuild-debug
on:
  push:
    branches: [feat/supabase-migration]
    paths: ['.github/workflows/nextbuild-debug.yml']

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Reproduce docker-style build (no secrets)
        env:
          DATABASE_URL: postgresql://build:build@localhost:5432/build
          NODE_ENV: production
          CI: 'true'
          NEXT_TELEMETRY_DISABLED: '1'
        run: |
          set +e
          pnpm run build > /tmp/build.log 2>&1
          echo "BUILD_EXIT=$?" >> "$GITHUB_ENV"
      - name: Emit error annotations and fail
        if: always()
        run: |
          if [ "${BUILD_EXIT:-0}" != "0" ]; then
            MSG=$(grep -iE "error|failed|exception|not found" /tmp/build.log | tail -n 6 | tr '\n' ' ' | tr -d '%' | cut -c1-600)
            echo "::error::next build exit=$BUILD_EXIT :: $MSG"
            TAILMSG=$(tail -n 20 /tmp/build.log | tr '\n' ' ' | tr -d '%' | cut -c1-600)
            echo "::error::tail: $TAILMSG"
            exit 1
          else
            echo "next build passed"
          fi
