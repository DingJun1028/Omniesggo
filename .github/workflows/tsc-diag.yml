name: TSC Diag (one-shot)

on:
  push:
    paths:
      - '.github/workflows/tsc-diag.yml'

permissions:
  contents: write

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable && corepack prepare pnpm@11.5.2 --activate
      - run: pnpm install --frozen-lockfile
      - name: Run tsc and capture output
        run: |
          set +e
          npx tsc --noEmit > tsc-diag.txt 2>&1
          echo "exit=$?" >> tsc-diag.txt
          echo "---file---"
          cat tsc-diag.txt
      - name: Commit diag output
        run: |
          git config user.name "omni-agent-bot"
          git config user.email "actions@users.noreply.github.com"
          git add tsc-diag.txt
          git commit -m "chore: tsc diagnostic output"
          git push
