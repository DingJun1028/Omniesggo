name: One-shot conflict report 168
on:
  push:
    branches: ["feature/architecture-diagram-v2"]
permissions:
  contents: write
jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Attempt merge and report
        run: |
          set +e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge FETCH_HEAD --no-edit > /tmp/merge.log 2>&1
          RC=$?
          echo "BRANCH_SHA=$(git rev-parse HEAD)" > /tmp/conflict-report.md
          echo "MAIN_SHA=$(git rev-parse FETCH_HEAD)" >> /tmp/conflict-report.md
          if [ $RC -eq 0 ]; then
            echo "MERGE_RESULT=clean" >> /tmp/conflict-report.md
            git reset --hard ORIG_HEAD > /dev/null 2>&1
          else
            echo "MERGE_RESULT=conflict" >> /tmp/conflict-report.md
            echo "" >> /tmp/conflict-report.md
            echo "## Conflicted files" >> /tmp/conflict-report.md
            echo '```' >> /tmp/conflict-report.md
            git diff --name-only --diff-filter=U >> /tmp/conflict-report.md
            echo '```' >> /tmp/conflict-report.md
            echo "" >> /tmp/conflict-report.md
            echo "## Merge log tail" >> /tmp/conflict-report.md
            echo '```' >> /tmp/conflict-report.md
            tail -40 /tmp/merge.log >> /tmp/conflict-report.md
            echo '```' >> /tmp/conflict-report.md
            git merge --abort > /dev/null 2>&1
          fi
          cat /tmp/conflict-report.md
      - name: Publish report and remove one-shot workflows
        run: |
          mkdir -p .conflict-reports
          cp /tmp/conflict-report.md .conflict-reports/168.md
          git add .conflict-reports
          git rm -qf .github/workflows/conflict-report-168.yml || true
          git rm -qf .github/workflows/branch-sync-168.yml || true
          git commit -m "chore: one-shot conflict report 168"
          git push origin HEAD:feature/architecture-diagram-v2
