# 一次性修復：移除 get_file_contents 造成的首行汙染（"successfully downloaded text file (SHA: ...)"）
name: repair-corrupted-first-line
on:
  push:
    branches: [feat/supabase-migration]
    paths: ['.github/workflows/repair-corrupted-first-line.yml']

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/supabase-migration
      - name: Fix corrupted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          FILES=$(grep -rl '^successfully downloaded text file' --exclude-dir=.git . || true)
          if [ -z "$FILES" ]; then
            echo "No corrupted files found."
          else
            echo "$FILES" | while read -r f; do
              echo "Fixing: $f"
              sed -i '1{/^successfully downloaded text file/d}' "$f"
            done
            git add -A
            git commit -q -m "fix: 移除檔案首行傳輸汙染字串（get_file_contents 偽文字）"
          fi
          git rm -q .github/workflows/repair-corrupted-first-line.yml
          git commit -q -m "chore(ci): 移除一次性首行汙染修復工作流程" --allow-empty
          git push origin feat/supabase-migration
          # 於註解輸出受汙染清單
          echo "::error::已修復檔案清單: $(echo $FILES | tr '\n' ' ' | cut -c1-500)"
