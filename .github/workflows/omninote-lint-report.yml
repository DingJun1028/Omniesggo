name: omninote-lint-report

# 一次性工作流（自動自刪）：產出 src/ 之完整 eslint 警告清單（JSON + 文字），
# 提交 lint-report.json / lint-report.txt 至本分支後刪除自身。

on:
  push:
    branches: [tmp/lint-report]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lint-report:
    if: github.repository == 'DingJun1028/Omniesggo'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Setup pnpm (packageManager pinned)
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run eslint (no fix, full report)
        run: |
          pnpm eslint src/ --max-warnings 9999 -f json -o lint-report.json || true
          pnpm eslint src/ --max-warnings 9999 -o lint-report.txt || true
          pnpm exec node -e "const r=require('./lint-report.json');const w=[];for(const f of r){for(const m of f.messages){w.push([f.filePath.replace(process.cwd()+'/',''),m.line,m.ruleId,m.severity,m.message.split('\n')[0]].join('\t'))}};require('fs').writeFileSync('lint-report.txt','count\t'+w.length+'\nfile\tline\trule\tseverity\tmessage\n'+w.join('\n')+'\n');console.log('warnings/errors:',w.length)"

      - name: Commit report and remove this workflow
        run: |
          git config user.name "omninote-ci-bot"
          git config user.email "actions@github.com"
          git add lint-report.json lint-report.txt
          git rm --quiet .github/workflows/omninote-lint-report.yml
          git commit -m "chore(omninote): capture full eslint report (one-shot)"
          git push
