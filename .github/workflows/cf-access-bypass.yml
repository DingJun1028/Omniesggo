name: CF Access bypass (esggo-web)

on:
  workflow_dispatch:

jobs:
  ensure-bypass:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ensure worker-level bypass app for esggo-web
        timeout-minutes: 4
        env:
          TOKEN_A: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CF_API_TOKEN }}
          TOKEN_B: ${{ secrets.CF_DNS_EDIT_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          # 目的：account 級 all_workers Access 會擋 web.esggo.co（實測 302 CF_AppSession）。
          # 官方解法：worker 級 bypass app 覆蓋 account 級 fallback。
          body='{"type":"self_hosted","name":"esggo-web public bypass","destinations":[{"type":"worker","worker_id":"esggo-web"}],"policies":[{"name":"public bypass","decision":"bypass","include":[{"everyone":{}}]}]}'
          for tok_name in TOKEN_A TOKEN_B; do
            eval tok=\$$tok_name
            if [ -z "$tok" ]; then echo "[diag] $tok_name empty, skip"; continue; fi
            echo "[diag] trying $tok_name for GET list"
            list=$(curl -sS -H "Authorization: Bearer $tok" \
              "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/access/apps?per_page=100")
            if ! echo "$list" | grep -q '"success":true\|"success": true'; then
              echo "[diag] $tok_name GET failed: $(echo "$list" | head -c 300)"
              continue
            fi
            if echo "$list" | grep -q 'esggo-web public bypass'; then
              echo "[diag] bypass app already exists (via $tok_name)"; exit 0
            fi
            echo "[diag] creating bypass app via $tok_name"
            res=$(curl -sS -X POST -H "Authorization: Bearer $tok" -H "Content-Type: application/json" \
              --data "$body" \
              "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/access/apps")
            echo "[diag] POST result: $res"
            if echo "$res" | grep -q '"success":true\|"success": true'; then
              echo "[diag] bypass app created"; exit 0
            fi
          done
          echo "::error::could not create bypass app with any token"
          exit 1
