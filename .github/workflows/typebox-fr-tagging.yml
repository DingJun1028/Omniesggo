name: TypeBox FR Tagging (one-shot)

on:
  push:
    paths:
      - '.github/workflows/typebox-fr-tagging.yml'

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Insert PRD requirement tags
        run: |
          set -e
          declare -A TAGS=(
            ["app/api/tags/pair/route.ts"]="FR-03"
            ["apps/gateway/sync/schema.ts"]="FR-02"
            ["src/lib/omni-reports/jules-validator.ts"]="FR-07"
            ["lib/runes/covenanter-rune.ts"]="FR-07"
            ["lib/runes/tracer-rune.ts"]="FR-04"
            ["lib/runes/engraver-rune.ts"]="FR-10"
            ["lib/runes/dispatcher-rune.ts"]="FR-08"
            ["lib/runes/alchemist-rune.ts"]="FR-08"
            ["lib/runes/validator-rune.ts"]="NFR-03"
            ["lib/runes/hallucination-verification-rune.ts"]="NFR-03"
            ["lib/runes/ncbdb-engrave-rune.ts"]="FR-07,FR-10"
          )
          declare -A NAMES=(
            ["FR-02"]="即時事件流"
            ["FR-03"]="智慧標籤引擎"
            ["FR-04"]="雙向追蹤"
            ["FR-07"]="符文鑲嵌插件 API"
            ["FR-08"]="自動化引擎"
            ["FR-10"]="稽核與監控"
            ["NFR-03"]="標籤準確率"
          )
          for f in "${!TAGS[@]}"; do
            if [ ! -f "$f" ]; then echo "MISSING $f"; exit 1; fi
            if grep -q "PRD: docs/OMN-PRD-001" "$f"; then echo "ALREADY TAGGED $f"; continue; fi
            ids="${TAGS[$f]}"
            labels=""
            IFS=',' read -ra arr <<< "$ids"
            for id in "${arr[@]}"; do labels="$labels${NAMES[$id]}/"; done
            sed -i "1i // PRD: docs/OMN-PRD-001.md §4.1 $ids（$labels schema 追溯標註）" "$f"
            sed -n '1p' "$f"
          done
      - name: Regenerate traceability report
        run: node scripts/generate-schema-traceability.mjs
      - name: Verify check passes
        run: node scripts/generate-schema-traceability.mjs --check
      - name: Commit and push
        run: |
          git config user.name "omni-agent-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "feat(traceability): tag 11 TypeBox definition files with PRD requirement IDs (honest mapping)"
          git push
