name: Insert expert-review section into README

on:
  push:
    branches: [probe/readme-expert-review-20261128]

permissions:
  contents: write

jobs:
  insert:
    name: Insert section 12 before License and push fix branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 1
      - name: Configure git
        run: |
          git config user.name "omniesggo-maintenance-bot"
          git config user.email "omniesggo-maintenance-bot@users.noreply.github.com"
      - name: Work
        id: work
        env:
          SECTION_B64: 
        run: |
          set +e
          printf %s "$SECTION_B64" | base64 -d > /tmp/section.md
          echo "section_lines=$(wc -l < /tmp/section.md)" >> "$GITHUB_OUTPUT"
          git checkout -b fix/readme-expert-review
          python3 - <<'PYEOF'
          import io
          src = io.open('README.md', encoding='utf-8').read()
          sec = io.open('/tmp/section.md', encoding='utf-8').read()
          marker = '## License'
          idx = src.index(marker)
          io.open('README.md', 'w', encoding='utf-8').write(src[:idx] + sec + src[idx:])
          PYEOF
          echo "py_rc=$? sec12=$(grep -c '^## 12\.' README.md) lic=$(grep -c '^## License' README.md)" >> "$GITHUB_OUTPUT"
          git add README.md
          git commit -m "docs(readme): add section 12 expert review (DevOps/CI-CD, architecture, supply-chain security)"
          echo "commit_rc=$?" >> "$GITHUB_OUTPUT"
          git push origin fix/readme-expert-review
          echo "push_rc=$?" >> "$GITHUB_OUTPUT"
      - name: Self-delete probe branch on success
        if: steps.work.outputs.push_rc == '0'
        run: |
          set -e
          git push origin --delete probe/readme-expert-review-20261128
