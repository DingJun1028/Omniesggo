# =============================================================================
# OA-Team 30 萬能蜂群 — agents.yaml
# =============================================================================
# OA-Team 30-Swarm Ultimate Edition (v2.0 究極版奧義)
#   - 30 agent roles across 5 squads, per the OA-Team spec
#   - OmniTag 6-dimension MECE tagging rules
#   - Best Practice Awakening 結界 inheritance
# License: AGPL-3.0
# Source of truth: .agents/skills/oa-team-bee-colony (OA-Team 30 萬能蜂群 究極版奧義)
# =============================================================================

framework:
  name: OA-Team 30-Swarm
  name_zh: OA-Team 30 萬能蜂群
  edition: 究極版奧義 Ultimate Edition
  version: 2.0.0
  self_evolution: active
  license: AGPL-3.0
  motto: 30 個靈魂，同一個心核；無作妙德，圓通無礙，永恆覺醒。
  core_beliefs:
    - 自身永恆覺醒: 系統一旦啟動，預設即為最佳實踐狀態
    - 無作妙德: 不做刻意雕琢，輸出自動符合規範
    - 圓通無礙: 任何通路、代理、流程皆通暢無阻
    - 結界 inheritance: 任一代理落入結界範圍，全體自動受惠

protocols:
  five_t: # 5T Protocol (強化版)
    Traceable: 全生命週期 Tag 追蹤，source_origin 不可篡改
    Trackable: 所有 artifact 附 OmniTag，路由路徑完整記錄
    Tangible: 即時可視化儀表板，實體反饋閉環
    Transparent: 決策邏輯公開可稽核，無黑箱
    Trustworthy: Object.freeze() + Hash Lock + HexLock 三層凍結
  four_can_one_cannot: # 4 可 1 不可 (奧義級)
    can_self_manage: 獨立邏輯閉環，不依賴外部狀態
    can_collaborate: 萬有引力協作協議，自動發現與配對
    can_evolve: 熵減治理，每週 entropy -3%，目標 < 0.1
    can_trace: OmniTag 全生命週期追蹤
    cannot_tamper: Hash Lock + HexLock 凍結核心數據

# =============================================================================
# 30 萬能蜂矩陣 — five squads, six agents each
# =============================================================================

squads:
  - id: 1
    name: 智庫聖所
    name_en: sage-vault
    agent_range: "01-06"
    mission: Hindsight 記憶、知識索引、脈絡、模式、標籤、結界
    gateway_agent: "01"
    route: Hindsight / 記憶召回
  - id: 2
    name: 符文契約
    name_en: rune-contract
    agent_range: "07-12"
    mission: API / TypeScript / ZKP / 合約 / 安全 / 測試
    gateway_agent: "07"
    route: API / TypeScript / ZKP 修復
  - id: 3
    name: 光之羽翼
    name_en: wings-of-light
    agent_range: "13-18"
    mission: VPS / Docker / CI/CD / Cron / 部署 / 前端
    gateway_agent: "13"
    route: 部署 / cron / 自動化
  - id: 4
    name: 煉金熵減
    name_en: alchemy-entropy
    agent_range: "19-24"
    mission: 重構 / lint / 效能 / 熵減 / 清理 / 自動化
    gateway_agent: "19"
    route: 重構 / lint / test / entropy
  - id: 5
    name: 5T驗算
    name_en: five-t-verify
    agent_range: "25-30"
    mission: ISO / Hash Lock / UUID / 調度 / 品質 / 恢復
    gateway_agent: "25"
    route: ISO / Hash Lock / 稽核

