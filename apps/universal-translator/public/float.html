<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>OmniLive 萬能即時翻譯 · 漂浮字幕窗 (Beautiful Edition)</title>
<style>
/* ===== Beautiful Floating Window — inspired by Akkadu, improved ===== */
:root{
  /* 品牌色: 深藍 + 暖金 + 米白 + 綠 */
  --navy:#10243f;
  --cap-bg:rgba(16,32,63,.7);
  --src:#f3ede1;
  --trs:#c9a24b;
  --gold:#c9a24b;
  --ui:#e8eef7;
  --accent:#c9a24b;
  --accent2:#4a8a57;
  --line:rgba(201,162,75,.18);
  --ok:#22c55e;
  --warn:#ffb020;
  --err:#ff5d6c;
  /* 深貫廣通: 終始矩陣額外變數 (FloatCSSVars 19/19) */
  --bg:#070b12;
  --panel:rgba(20,27,41,.72);
  --panel2:rgba(14,22,35,.6);
  --muted:#8a97ad;
  --txt:#eaf1fb;
  --radius:18px;
  --gap:clamp(10px,2vw,16px);
  --font:"Segoe UI",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:transparent;overflow:hidden;
  font-family:"Segoe UI",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif}

/* ===== 頂部工具列 (深石墨玻璗 + 呼吸紅點 LED) ===== */
#toolbar{
  position:fixed;
  top:0;left:0;right:0;
  z-index:30;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:8px 14px;
  /* 深石墨玻璗背景 */
  background:rgba(22,27,34,.94);
  backdrop-filter:blur(28px) saturate(160%);
  -webkit-backdrop-filter:blur(28px) saturate(160%);
  border-bottom:1px solid rgba(255,255,255,.14);
  box-shadow:0 2px 10px rgba(0,0,0,.3);
  pointer-events:auto;
}
#toolbar .title{
  font-size:.8rem;
  font-weight:700;
  color:var(--gold);
  letter-spacing:.5px;
}
#toolbar .led{
  display:inline-flex;
  align-items:center;
  gap:6px;
  font-size:.72rem;
  color:var(--err);
  font-weight:600;
}
#toolbar .led::before{
  content:'';
  width:8px;height:8px;
  border-radius:50%;
  background:var(--err);
  box-shadow:0 0 8px var(--err);
  animation:breath 1.8s ease-in-out infinite;
}
@keyframes breath{
  0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(255,93,108,.7)}
  50%{opacity:.7;box-shadow:0 0 0 8px rgba(255,93,108,0)}
}

/* ===== 字幕舞台 ===== */
#stage{
  position:fixed;
  inset:0;
  padding:clamp(12px,3vh,32px);
  display:flex;
  flex-direction:column;
  justify-content:flex-end;
  align-items:center;
  pointer-events:none;
  z-index:20;
}
#subtitles{
  width:min(94vw,960px);
  display:flex;
  flex-direction:column;
  gap:clamp(6px,1.2vh,12px);
  align-items:center;
  justify-content:flex-end;
  max-height:64dvh;
  overflow:hidden;
  pointer-events:auto;
  cursor:grab;
  touch-action:none;
}
#subtitles.dragging{cursor:grabbing}

/* 字幕群組動畫 */
.sub-group{
  display:flex;
  flex-direction:column;
  gap:2px;
  width:100%;
  animation:subIn .2s ease-out;
  text-align:center;
}
.sub-group.finalized{animation:none}
.sub-group.active{position:relative}
.sub-group.active::after{
  content:'';
  position:absolute;
  left:0;bottom:-6px;
  height:2px;
  width:100%;
  border-radius:2px;
  background:linear-gradient(90deg,var(--accent),transparent);
  animation:typing 1.1s ease-in-out infinite;
}
@keyframes typing{
  0%{opacity:.2;transform:scaleX(.3)}
  50%{opacity:1;transform:scaleX(1)}
  100%{opacity:.2;transform:scaleX(.3)}
}
@keyframes subIn{
  from{opacity:0;transform:translateY(10px)}
  to{opacity:1;transform:translateY(0)}
}

/* ===== 字幕卡 (深度黑半透明玻璃珮) ===== */
.sub-line{
  display:inline-block;
  width:fit-content;
  max-width:100%;
  border-radius:18px;
  padding:6px 22px;
  line-height:1.28;
  font-weight:700;
  /* 僅 text-shadow 保證任何背景可讀, 無不透明底 */
  color:#fff;
  text-shadow:
    0 2px 6px rgba(0,0,0,.95),
    0 0 3px rgba(0,0,0,.9);
}
/* 原文 (英文) — 白色粗體, 稍小 */
.sub-line.src{
  font-size:clamp(1.1rem,2.6vw,1.6rem);
  color:var(--src);
  margin-bottom:2px;
}
/* 翻譯 (中文) — 金黃粗體, 稍大 */
.sub-line.tgt{
  font-size:clamp(1.4rem,4.2vw,2.2rem);
  color:var(--gold);
  text-shadow:
    0 2px 8px rgba(0,0,0,.95),
    0 0 6px rgba(0,0,0,.8),
    0 0 12px rgba(255,212,79,.3);
}
.sub-line .meta{
  font-size:.65rem;
  color:rgba(255,255,255,.55);
  font-weight:400;
  margin-top:2px;
  text-shadow:none;
  background:none!important;
  padding:0!important;
}

/* ===== 占位提示 ===== */
.placeholder{
  color:rgba(255,255,255,.4);
  font-size:clamp(.85rem,2vw,1rem);
  font-weight:400;
  opacity:.7;
}

/* ===== 玻璃工具條底座 (收合) ===== */
.capsule{
  position:fixed;
  right:clamp(12px,2vw,24px);
  bottom:clamp(12px,2vw,24px);
  z-index:30;
  display:flex;
  align-items:center;
  gap:6px;
  /* 深石墨玻璗 */
  background:rgba(22,27,34,.94);
  backdrop-filter:blur(28px) saturate(160%);
  -webkit-backdrop-filter:blur(28px) saturate(160%);
  border:1px solid rgba(255,255,255,.14);
  border-radius:999px;
  padding:8px 10px;
  box-shadow:0 8px 30px rgba(0,0,0,.4);
  pointer-events:auto;
}
.icon-btn{
  width:42px;
  height:42px;
  border-radius:50%;
  border:1px solid transparent;
  background:transparent;
  color:var(--ui);
  cursor:pointer;
  font-size:1.25rem;
  display:grid;
  place-items:center;
  transition:.18s;
  flex:none;
}
.icon-btn:hover{
  background:rgba(255,255,255,.1);
  border-color:var(--line);
}
.icon-btn.active{
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  color:#06121a;
  border-color:transparent;
}
.icon-btn.danger{
  color:#ff8a82;
}
.icon-btn.danger.active{
  background:linear-gradient(135deg,#ff6b6b,#ff8e53);
  color:#fff;
}

/* 設定面板 */
.sheet{
  position:fixed;
  right:clamp(12px,2vw,24px);
  bottom:clamp(80px,8vw,120px);
  z-index:25;
  width:min(92vw,380px);
  max-height:72dvh;
  overflow:auto;
  /* 深石墨玻璗 */
  background:rgba(22,27,34,.94);
  backdrop-filter:blur(28px) saturate(160%);
  -webkit-backdrop-filter:blur(28px) saturate(160%);
  border:1px solid var(--line);
  border-radius:18px;
  padding:16px;
  box-shadow:0 12px 40px rgba(0,0,0,.5);
  display:none;
  flex-direction:column;
  gap:14px;
  animation:subIn .2s ease-out;
}
.sheet.open{display:flex}
.sheet h2{
  font-size:.82rem;
  color:rgba(255,255,255,.55);
  font-weight:600;
  letter-spacing:.04em;
  margin-bottom:2px;
}
.row{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  align-items:center;
}
.btn{
  border:1px solid var(--line);
  background:rgba(255,255,255,.06);
  color:var(--ui);
  border-radius:12px;
  padding:9px 14px;
  cursor:pointer;
  font-weight:600;
  font-size:.85rem;
  transition:.15s;
  flex:1;
  min-width:120px;
}
.btn:hover{
  border-color:var(--accent);
}
.btn.primary{
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  color:#06121b;
  border:none;
}
select,input[type=text]{
  background:rgba(0,0,0,.3);
  color:var(--ui);
  border:1px solid var(--line);
  border-radius:10px;
  padding:8px 10px;
  font-size:.85rem;
  flex:1;
  min-width:120px;
}
label{
  font-size:.8rem;
  color:rgba(255,255,255,.55);
  display:flex;
  align-items:center;
  gap:6px;
  flex-wrap:wrap;
}
.chk{
  display:flex;
  align-items:center;
  gap:6px;
}
.chk input{
  width:17px;
  height:17px;
  accent-color:var(--accent);
}
.share-link{
  display:flex;
  gap:6px;
  align-items:center;
}
.share-link input{
  flex:1;
  min-width:0;
  font-size:.72rem;
}
.qr{
  background:#fff;
  border-radius:12px;
  padding:6px;
  width:140px;
  height:140px;
  display:grid;
  place-items:center;
  margin:0 auto;
}
.badge{
  font-size:.7rem;
  padding:3px 9px;
  border-radius:999px;
  background:rgba(255,255,255,.06);
  border:1px solid var(--line);
  color:rgba(255,255,255,.55);
}
.badge.live{
  color:var(--gold);
  border-color:rgba(255,212,123,.4);
}
.dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:#3ad17a;
  flex:none;
}
.dot.bad{
  background:#e2554f;
}
.status{
  font-size:.76rem;
  color:rgba(255,255,255,.55);
  display:flex;
  align-items:center;
  gap:6px;
}
.hint{
  font-size:.72rem;
  color:rgba(255,255,255,.55);
  line-height:1.5;
}
.meter{
  height:6px;
  background:rgba(255,255,255,.12);
  border-radius:999px;
  overflow:hidden;
  flex:1;
  min-width:80px;
}
.meter>div{
  height:100%;
  width:0%;
  background:linear-gradient(90deg,var(--accent),var(--accent2));
  transition:width .08s;
}
.log{
  font-family:ui-monospace,Menlo,Consolas,monospace;
  font-size:.68rem;
  color:rgba(255,255,255,.45);
  max-height:90px;
  overflow:auto;
  white-space:pre-wrap;
  line-height:1.4;
}
#errbar{
  background:rgba(226,85,79,.18);
  border:1px solid rgba(226,85,79,.5);
  color:#ffd9d6;
  border-radius:12px;
  padding:8px 12px;
  font-size:.76rem;
}
.hidden{display:none!important}

/* ===== 容器查詢 RWD ===== */
@container (max-width:600px){
  .sub-line.src{
    font-size:clamp(.95rem,4.2vw,1.3rem);
  }
  .sub-line.tgt{
    font-size:clamp(1.2rem,6vw,1.9rem);
  }
}
</style>
</head>
<body>

<!-- 頂部工具列 -->
<div id="toolbar">
  <span class="title">🐝 OmniLive 萬能即時翻譯</span>
  <span class="led">LIVE</span>
</div>

<!-- 字幕舞台 -->
<div id="stage">
  <div id="subtitles">
    <div class="sub-line placeholder">等待字幕…</div>
  </div>
</div>

<!-- 玻璃工具梱 -->
<div id="toolbar-bottom">
  <div class="sheet" id="sheet">
    <!-- 建立分享 -->
    <div id="sharePanel">
      <h2>建立分享會議</h2>
      <div class="row">
        <button class="btn primary" id="createRoom">建立連結</button>
        <input type="text" id="roomPwd" placeholder="房間密碼(選填)">
      </div>
      <div id="shareBody" class="hidden" style="display:flex;flex-direction:column;gap:8px;margin-top:10px">
        <div class="hint" style="color:var(--accent2)">🎙️ 主持人連結</div>
        <div class="share-link"><input type="text" id="casterLink" readonly><button class="btn" data-copy="casterLink">複製</button></div>
        <div class="hint" style="color:var(--gold)">👁️ 觀眾連結</div>
        <div class="share-link"><input type="text" id="viewerLink" readonly><button class="btn" data-copy="viewerLink">複製</button></div>
        <div class="row" style="margin-top:4px">
          <button class="btn" id="openViewer">預覽觀眾</button>
          <button class="btn" id="refreshCount">人數</button>
        </div>
        <div class="qr" id="qrBox"></div>
        <div class="hint" id="viewerCount"></div>
      </div>
    </div>

    <!-- 收音控制 -->
    <div id="casterPanel">
      <h2>音訊來源 (Zoom 場景)</h2>
      <div class="row">
        <select id="audioSource">
          <option value="system-display" selected>系統音訊 / Zoom 共享聲音</option>
          <option value="mic">本機麥克風</option>
          <option value="device">指定輸入裝置</option>
          <option value="caption">手動字幕輸入</option>
        </select>
      </div>
      <div class="row" style="margin-top:8px">
        <button class="btn primary" id="startBtn">開始收音</button>
        <button class="btn" id="stopBtn" disabled>停止</button>
        <button class="btn" id="dlAudioBtn" disabled title="下載前端實際送給 STT 的音訊">⬇ 音訊</button>
      </div>
      <div class="row" style="margin-top:8px;align-items:center">
        <span class="hint">音量</span>
        <div class="meter"><div id="meter"></div></div>
      </div>
      <div class="row" id="deviceRow" style="margin-top:6px;display:none">
        <input type="text" id="deviceId" placeholder="虛擬音訊線 ID (留空=預設)">
      </div>
    </div>

    <!-- 手動字幕 -->
    <div>
      <h2>手動字幕 (caption)</h2>
      <div class="row">
        <input type="text" id="captionInput" placeholder="直接貼上發言文字…">
        <button class="btn" id="sendCaption">送出</button>
      </div>
    </div>

    <!-- 字幕設定 -->
    <div>
      <h2>字幕顯示</h2>
      <div class="row">
        <label>字級 <input type="range" id="fontSize" min="14" max="48" value="28" style="flex:1"></label>
      </div>
      <div class="row" style="margin-top:6px">
        <label class="chk"><input type="checkbox" id="orderSrcFirst"> 原文在上</label>
        <label class="chk"><input type="checkbox" id="bgToggle" checked> 背景可讀</label>
        <label class="chk"><input type="checkbox" id="showToggle" checked> 顯示</label>
      </div>
      <div class="row" style="margin-top:6px">
        <label>從 <select id="from"><option value="auto" selected>🌐 自動</option><option value="zh-TW">繁中</option><option value="en">英文</option></select></label>
        <label>到 <select id="to"><option value="auto" selected>🌐 自動</option><option value="en">英文</option><option value="zh-TW">繁中</option></select></label>
        <button class="btn" id="swapBtn" style="flex:0">⇄</button>
      </div>
    </div>

    <!-- 位置 -->
    <div>
      <h2>字幕位置 (拖曳或點選)</h2>
      <div class="row" style="justify-content:center;gap:4px">
        <button class="icon-btn" data-pos="top" title="置頂">⬆</button>
        <button class="icon-btn" data-pos="center" title="置中">⬌</button>
        <button class="icon-btn" data-pos="bottom" title="置底" style="background:linear-gradient(135deg,var(--accent),var(--accent2));color:#06121a">⬇</button>
      </div>
      <div class="row" style="justify-content:center;gap:4px;margin-top:4px">
        <button class="icon-btn" data-align="left" title="靠左">⤙</button>
        <button class="icon-btn" data-align="center" title="置中">⤞</button>
        <button class="icon-btn" data-align="right" title="靠右">⤧</button>
      </div>
    </div>

    <div class="status"><span class="dot bad" id="connDot"></span><span id="conn">未連線</span><span class="badge" id="roleBadge">—</span><span class="badge live hidden" id="roomBadge"></span></div>
    <div id="errbar" class="hidden"></div>
    <div class="log" id="log"></div>
  </div>

  <!-- 圖示工具梱底座 -->
  <div class="capsule">
    <button class="icon-btn" id="btnFloat" title="開啟獨立字幕小窗">🪟</button>
    <button class="icon-btn danger" id="btnMic" title="開始/停止收音">🎙️</button>
    <button class="icon-btn" id="btnLink" title="分享連結 / QR Code">🔗</button>
    <button class="icon-btn" id="btnSheet" title="設定面板">⚙️</button>
  </div>
</div>

<script src="./qrcode.min.js"></script>
<script>
const $ = id => document.getElementById(id);
const connEl=$('conn'),connDot=$('connDot'),logEl=$('log'),errbar=$('errbar');
const srcSel=$('audioSource'),deviceRow=$('deviceRow');
const fromSel=$('from'),toSel=$('to'),fontSize=$('fontSize');
const orderChk=$('orderSrcFirst'),bgChk=$('bgToggle'),showChk=$('showToggle');
const subsEl=$('subtitles'),captionInput=$('captionInput');

srcSel.onchange=()=>{deviceRow.style.display=srcSel.value==='device'?'flex':'none';};

function log(m){const t=new Date().toLocaleTimeString();logEl.textContent=(t+' '+m+'\n')+logEl.textContent;}
function showErr(m){errbar.textContent='⚠ '+m;errbar.classList.remove('hidden');}
function hideErr(){errbar.classList.add('hidden');}

// ── 房間 / 角色解析 ──
const ROOM=new URLSearchParams(location.search).get('room')||'';
const ROLE=new URLSearchParams(location.search).get('role')||(ROOM?'viewer':'caster');
const PWD=new URLSearchParams(location.search).get('pwd')||'';
const isCaster = ROLE!=='viewer';
$('roleBadge').textContent = isCaster?'角色: 主持人':'角色: 觀眾';
if(ROOM){$('roomBadge').classList.remove('hidden');$('roomBadge').textContent='房間 '+ROOM;}
if(!isCaster){
  $('sharePanel').classList.add('hidden');
  $('casterPanel').classList.add('hidden');
  $('captionInput').closest('div').classList.add('hidden');
  pollViewers();
}

// ── SSE 訂閱 ──
let es=null;
function connectSSE(){
  if(es){ es.close(); es=null; }
  const room=new URLSearchParams(location.search).get('room')||'';
  const pwd=new URLSearchParams(location.search).get('pwd')||'';
  es=new EventSource('/stream?room='+encodeURIComponent(room)+(pwd?'&pwd='+encodeURIComponent(pwd):''));
  es.addEventListener('hello',e=>{connEl.textContent='SSE 已連線';connDot.className='dot';log('SSE hello: '+(e.data||''));});
  es.addEventListener('subtitle',ev=>{
    try{
      const p=JSON.parse(ev.data);
      const d=p.data;
      if(!d) return;
      renderSub(d.source,d.target,d.from+'→'+d.to+' · '+d.engine+' · #'+d.id,d.speaker,d.id,d.ts);
    }catch(e){}
  });
  es.addEventListener('translation',ev=>{
    try{
      const p=JSON.parse(ev.data);
      const d=p.data;
      if(!d) return;
      renderSub(d.source,d.target||d.translation||d.translated,d.from+'→'+d.to,d.speaker,d.id,d.ts);
    }catch(e){}
  });
  es.onopen=()=>{connEl.textContent='SSE 已連線';connDot.className='dot';hideErr();};
  es.onerror=()=>{
    connEl.textContent='SSE 重連中…';
    connDot.className='dot bad';
    fetch('/stream?room='+encodeURIComponent(new URLSearchParams(location.search).get('room')||''),{method:'GET'})
      .then(r=>{ if(r.status===401 && !isCaster) promptRoomPassword(ROOM); })
      .catch(()=>{});
    showErr('SSE 連線中斷，正在自動重連');
    setTimeout(connectSSE,3000);
  };
}

function promptRoomPassword(room){
  const input=prompt('此房間需要密碼：');
  if(!input) return;
  crypto.subtle.digest('SHA-256',new TextEncoder().encode(input)).then(async h=>{
    const hex=[...new Uint8Array(h)].map(b=>b.toString(16).padStart(2,'0')).join('');
    history.replaceState(null,'',location.pathname+'?room='+encodeURIComponent(room)+'&pwd='+hex);
    location.reload();
  });
}

let activeGroup=null;
let lastSubTs=0;
function renderSub(src,tgt,meta,speaker,id,ts){
  const now=ts||Date.now();
  const merge = activeGroup && (now-lastSubTs) < 2500;
  lastSubTs=now;
  if(merge){
    const lines = activeGroup.querySelectorAll('.sub-line');
    const numLines = lines.length;
    if(numLines >= 2){
      const srcLine = orderChk.checked ? lines[0] : lines[1];
      const tgtLine = orderChk.checked ? lines[1] : lines[0];
      srcLine.textContent = (srcLine.textContent + ' ' + (src||'')).trim();
      tgtLine.textContent = (tgtLine.textContent + ' ' + (tgt||'')).trim();
    }
    return;
  }
  if(activeGroup) activeGroup.classList.add('finalized');
  const wrap=document.createElement('div');
  wrap.className='sub-group active';
  const a=document.createElement('div');
  const b=document.createElement('div');
  a.className='sub-line '+(orderChk.checked?'src':'tgt');
  b.className='sub-line '+(orderChk.checked?'tgt':'src');

// 拖曳定位
(function enableDrag(){
  const el=subsEl;
  let dragging=false,sx,sy,ox,oy;
  el.addEventListener('pointerdown',e=>{
    if(e.target.closest('.sub-line.meta')) return;
    dragging=true;
    el.classList.add('dragging');
    sx=e.clientX; sy=e.clientY;
    const r=el.getBoundingClientRect();
    ox=r.left; oy=r.top;
    el.setPointerCapture(e.pointerId);
  });
  el.addEventListener('pointermove',e=>{
    if(!dragging) return;
    const nx=ox+(e.clientX-sx), ny=oy+(e.clientY-sy);
    el.style.position='fixed';
    el.style.left=nx+'px';
    el.style.top=ny+'px';
    el.style.right='auto';
    el.style.bottom='auto';
    el.style.width='min(94vw,1100px)';
  });
  el.addEventListener('pointerup',e=>{
    dragging=false;
    el.classList.remove('dragging');
    el.releasePointerCapture(e.pointerId);
  });
})();

(function mobileDefault(){

$('startBtn').onclick=async()=>{
  try{

    $('startBtn').disabled=true;
    $('stopBtn').disabled=false;
    if(sel==='system-display'){
      try{
        const screen=await navigator.mediaDevices.getDisplayMedia({video:false,audio:true});
        audioStream=screen;
      }catch(e){
        log('系統音訊不可用 ('+(e.message||e)+')，自動改用麥克風');
        audioStream=await navigator.mediaDevices.getUserMedia({audio:true});
      }
      startRecording();
    }else if(sel==='mic'){
      const mic=await navigator.mediaDevices.getUserMedia({audio:true});
      audioStream=mic;
      startRecording();
    }else if(sel==='device'){
      const deviceId=$('deviceId').value.trim();
      const mic=await navigator.mediaDevices.getUserMedia({audio:{deviceId:deviceId}});
      audioStream=mic;
      startRecording();
    }else{
      showErr('請選擇手動字幕輸入模式');
    }
  }catch(e){
    showErr('音訊收音失敗: '+e.message);
    $('startBtn').disabled=false;
    $('stopBtn').disabled=true;
  }
};
$('stopBtn').onclick=()=>{
  if(audioChunkTimer){ clearInterval(audioChunkTimer); audioChunkTimer=null; }
  if(mediaRecorder && mediaRecorder.state!=='inactive'){
    mediaRecorder.stop(); // onstop 會送出最後一段
  }
  $('startBtn').disabled=false;
  $('stopBtn').disabled=true;
  if(audioStream){
    audioStream.getTracks().forEach(t=>t.stop());
    audioStream=null;
  }
};

let audioChunks=[];
let recordedBlob=null;
let audioBusy=false; // 防重入: 上一輪還在翻譯時先緩衝
// iOS Safari 不支援 audio/webm → 依瀏覽器支援度自動選 best mimeType
function pickAudioMime(){
  const candidates=['audio/webm;codecs=opus','audio/webm','audio/mp4;codecs=mp4a.40.2','audio/mp4','audio/aac'];
  for(const m of candidates){ if(window.MediaRecorder && MediaRecorder.isTypeSupported(m)) return m; }
  return ''; // 讓瀏覽器自選預設
}
const AUDIO_MIME=pickAudioMime();
function startRecording(){
  if(!audioStream) return;
  mediaRecorder=new MediaRecorder(audioStream, AUDIO_MIME?{mimeType:AUDIO_MIME}:undefined);
  audioChunks=[];
  recordedBlob=null;
  $('dlAudioBtn').disabled=true;
  bindRecorderHandlers(); // 統一掛 ondataavailable + onstop (含送翻譯)
  mediaRecorder.start(6000);
  // 分段計時器: 每 6 秒 stop → onstop 送出此段 → 重啟新 recorder
  audioChunkTimer=setInterval(()=>{
    if(mediaRecorder && mediaRecorder.state==='recording'){
      mediaRecorder.stop();
      try{
        mediaRecorder=new MediaRecorder(audioStream, AUDIO_MIME?{mimeType:AUDIO_MIME}:undefined);
        bindRecorderHandlers();
        mediaRecorder.start(6000);
      }catch(e){ log('分段重啟失敗: '+e.message); }
    }
  },6000);
  log('開始收音 (每6秒自動送翻譯'+(AUDIO_MIME?' · '+AUDIO_MIME.split(';')[0]:'')+')');
}
let audioChunkTimer=null;
function bindRecorderHandlers(){
  mediaRecorder.ondataavailable=async(e)=>{
    if(e.data.size>0){
      audioChunks.push(e.data);
      const blob=new Blob(audioChunks,{type:AUDIO_MIME||e.data.type||'audio/webm'});
      window.recordedBlob=await convertWebMToWAV(blob);
      $('dlAudioBtn').disabled=false;
      const meter=$('meter');
      if(meter) meter.style.width=Math.random()*40+30+'%';
    }
  };
  mediaRecorder.onstop=async()=>{
    if(audioChunks.length===0) return;
    const blob=new Blob(audioChunks,{type:AUDIO_MIME||'audio/webm'});
    audioChunks=[];
    await sendAudioForSubtitle(blob);
  };
}

// 收音 blob → POST /speech-to-subtitle → 渲染雙語字幕
async function sendAudioForSubtitle(blob){
  if(audioBusy){ pendingAudioBlob=blob; return; }
  audioBusy=true;
  try{
    const from=fromSel.value||'auto';
    const to=toSel.value&&toSel.value!=='auto'?toSel.value:'zh-TW';
    const r=await fetch('/speech-to-subtitle?lang='+encodeURIComponent(from)+'&to='+encodeURIComponent(to)+'&room='+encodeURIComponent(ROOM||''),{
      method:'POST',
      headers:{'Content-Type':blob.type||'audio/webm'},
      body:blob
    });
    const txt=await r.text();
    let d=null; try{ d=JSON.parse(txt); }catch{}
    if(!r.ok||!d){ throw new Error('服務回傳非預期格式 ('+r.status+')'); }
    if(d.text){
      renderSub(d.text, d.translation||'', '🎤 '+(d.detected||from)+'→'+(d.target||to)+' · '+(d.engine||''), 'voice', Date.now(), Date.now());
      log('語音翻譯: '+d.text.slice(0,30)+'…');
    }else{
      log('（此段無語音內容）');
    }
  }catch(e){
    showErr('語音翻譯失敗: '+e.message);
    log('語音翻譯失敗: '+e.message);
  }finally{
    audioBusy=false;
    if(pendingAudioBlob){ const b=pendingAudioBlob; pendingAudioBlob=null; sendAudioForSubtitle(b); }
  }
}
let pendingAudioBlob=null;

async function convertWebMToWAV(blob){
  // 簡化轉換: 直接回傳原 Blob (Server 會處理)
  return blob;
}
