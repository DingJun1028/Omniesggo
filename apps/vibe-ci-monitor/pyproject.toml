[project]
name = "omniesggo-ci-monitor"
version = "0.1.0"
description = "Omniesggo main-branch CI monitor as a Mistral AI Studio workflow"
requires-python = ">=3.12"
dependencies = [
    "mistralai-workflows>=3.10",
    "pydantic>=2.7",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["ci_monitor"]
