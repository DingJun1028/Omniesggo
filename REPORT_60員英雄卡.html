  return `<div class="card array-${a.array}" data-array="${a.array}" data-side="${a.side}">
    <div class="card-header">
      <span class="card-id">#${String(a.id).padStart(2,'0')}</span>
      <span class="card-name">${a.name}</span>
    </div>
    <div class="card-archetype">${a.arch}</div>
    <div class="card-meta">
      <span class="badge ${sideClass}">${sideLabel}</span>
      <span class="badge badge-array">${arrayNames[a.array]}</span>
    </div>
    <div class="stats">
      ${['atk','def','spd','int','syn','mem'].map(s => `
        <div class="stat">
          <div class="stat-val">${a[s]}</div>
          <div class="stat-label">${s.toUpperCase()}</div>
          <div class="bar"><div class="bar-fill" style="width:${a[s]*10}%"></div></div>
        </div>
      `).join('')}
    </div>
    <div class="bonuses">${a.bonus}</div>
    <div class="desc">${a.desc}</div>
  </div>`;
}

function filter(type) {
  document.querySelectorAll('.filters button').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
  const cards = document.querySelectorAll('.card');
  cards.forEach(c => {
    if (type === 'all') c.style.display = '';
    else if (type === 'umbra' || type === 'lumen') c.style.display = c.dataset.side === (type === 'umbra' ? 'local' : 'vps') ? '' : 'none';
    else c.style.display = c.dataset.array === type ? '' : 'none';
  });
}

document.getElementById('grid').innerHTML = agents.map(renderCard).join('');
</script>
</body>
